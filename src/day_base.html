<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脳解剖学 単語帳 Day別</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b3fa0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="../icons/apple-day-180.png">
<script src="../sync.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: one column, phone first; home = chapter list, study = one card + two verdict buttons pinned low */
:root{
  --paper:#f3f2f7; --surface:#ffffff; --ink:#1d1a2b; --muted:#6a6680; --line:#dcd9e6;
  --violet:#5b3fa0; --violet-soft:#ebe5f7;
  --ok:#1f7a55; --ok-soft:#e1f2ea; --again:#a8611a; --again-soft:#f8ecdc;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15131d; --surface:#201d2c; --ink:#ece9f5; --muted:#a29db8; --line:#353148;
    --violet:#b79bf0; --violet-soft:#2d2644;
    --ok:#6fcca2; --ok-soft:#1c3329; --again:#e2a763; --again-soft:#3a2c1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15131d; --surface:#201d2c; --ink:#ece9f5; --muted:#a29db8; --line:#353148;
  --violet:#b79bf0; --violet-soft:#2d2644;
  --ok:#6fcca2; --ok-soft:#1c3329; --again:#e2a763; --again-soft:#3a2c1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,.card:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 32px;min-height:100%;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}
h1{font-family:var(--display);font-size:1.6rem;line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;font-size:.92rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;display:flex;align-items:center;gap:8px}
.toggle[aria-pressed="true"]{background:var(--violet-soft);border-color:var(--violet);color:var(--violet);font-weight:700}
.toggle .dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.toggle[aria-pressed="true"] .dot{background:currentColor}
.chapters{display:flex;flex-direction:column;gap:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{list-style:none;padding:14px 16px;display:flex;align-items:baseline;gap:12px;cursor:pointer;border-radius:12px}
summary::-webkit-details-marker{display:none}
.num::before{content:'DAY';display:block;font-family:var(--body);font-size:.6rem;letter-spacing:.1em;color:var(--muted);line-height:1}
.num{font-family:var(--display);font-size:1.25rem;color:var(--violet);min-width:1.6em;font-variant-numeric:tabular-nums}
.ctitle{flex:1;font-weight:700;line-height:1.4}
.ctitle small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.units{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.unit{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;width:100%}
.unit.all{background:var(--violet);border-color:var(--violet);color:var(--surface);font-weight:700}
.unit.all .count{color:inherit;opacity:.85}
.unit:disabled{opacity:.4;cursor:default}
/* study */
.bar{display:flex;align-items:center;gap:12px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.9rem;white-space:nowrap}
.where{flex:1;min-width:0;font-size:.85rem;color:var(--muted);line-height:1.35}
.where b{display:block;color:var(--ink);font-size:.95rem;overflow-wrap:anywhere}
.stats{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--violet);width:0;transition:width .25s}
.card{flex:1;min-height:260px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;overflow-wrap:anywhere}
.tag{font-size:.75rem;letter-spacing:.08em;color:var(--muted);display:flex;gap:10px;align-items:center}
.star{color:var(--again);letter-spacing:0;font-size:.85rem}
.q{font-family:var(--display);font-size:1.3rem;line-height:1.5;margin:0;text-wrap:balance}
.card.flipped{gap:12px;padding:16px 16px 18px}
.card.flipped .q{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted);line-height:1.5;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card.flipped .q::before{content:"Q ";color:var(--violet);font-weight:700}
.rule{display:none}
.a{margin:0;display:flex;flex-direction:column;gap:10px;font-size:1.05rem;line-height:1.6}
.seg{display:flex;flex-direction:column;gap:4px}
.seg.plain{font-weight:500}
.lab{align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--violet);background:var(--violet-soft);border-radius:6px;padding:1px 8px;line-height:1.6}
.steps{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;counter-reset:st}
.steps li{position:relative;padding:0 0 8px 30px;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:0;top:.15em;width:20px;height:20px;border-radius:50%;background:var(--violet-soft);color:var(--violet);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.steps li::after{content:"";position:absolute;left:9.5px;top:calc(.15em + 22px);bottom:0;width:1px;background:var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.items li{position:relative;padding-left:16px}
.items li::before{content:"";position:absolute;left:3px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--violet)}
.via{display:inline-block;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px}
.paren{color:var(--muted);font-size:.9em}
.note{background:var(--violet-soft);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;padding:10px 12px;font-size:.92rem}
.note b{display:block;font-size:.75rem;color:var(--violet);letter-spacing:.08em}
.hint{margin-top:auto;color:var(--muted);font-size:.85rem;text-align:center}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:0;background:var(--paper);padding:10px 0 12px;margin-bottom:-12px}
.acts button{border-radius:12px;padding:14px 8px;font-weight:700;border:2px solid;line-height:1.3}
.acts small{display:block;font-weight:400;font-size:.75rem}
.again{background:var(--again-soft);border-color:var(--again);color:var(--again)}
.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.show{grid-column:1/-1;background:var(--violet);border-color:var(--violet)!important;color:var(--surface)}
.toast{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:.92rem;font-weight:700}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}
.switch{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;align-self:flex-start}
.switch a{padding:6px 16px;border-radius:999px;font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:600}
.switch a[aria-current="page"]{background:var(--violet-soft);color:var(--violet)}
.urow{display:flex;align-items:center;gap:6px}
.urow .unit{flex:1;min-width:0}
.chk{flex:none;width:40px;height:40px;display:flex;align-items:center;justify-content:center;margin:-4px -4px -4px -6px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--ok);margin:0;cursor:pointer}
.urow.done .unit{opacity:.5}
.prog{font-size:.78rem;font-weight:700;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
details.done .prog,details.done .num{color:var(--ok)}
.resume{display:flex;flex-direction:column;gap:4px;width:100%;text-align:left;background:var(--violet-soft);border:1px solid var(--violet);border-radius:14px;padding:12px 16px;cursor:pointer;color:var(--ink)}
.resume b{font-size:.75rem;letter-spacing:.08em;color:var(--violet)}
.resume span{font-weight:700;line-height:1.45}
.resume small{color:var(--muted);font-size:.82rem}
.unit.inprog .count{color:var(--violet);font-weight:700}
.acts.srs{grid-template-columns:repeat(4,1fr);gap:6px}
.acts.srs .show{grid-column:1/-1}
.acts.srs button{padding:12px 2px;font-size:.92rem}
.acts.srs small{font-variant-numeric:tabular-nums;margin-top:2px}
.g1{background:var(--again-soft);border-color:var(--again);color:var(--again)}
.g2{background:var(--surface);border-color:var(--muted);color:var(--ink)}
.g3{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.g4{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.cnts{display:flex;gap:10px;flex-wrap:wrap}
.count .cn,.count .cl,.count .cr{margin-left:8px}
.cn{color:#2f6fd0;font-weight:700}.cl{color:#c0392b;font-weight:700}.cr{color:var(--ok);font-weight:700}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cn{color:#7fb0ff}:root:not([data-theme="light"]) .cl{color:#ff8a7a}}
:root[data-theme="dark"] .cn{color:#7fb0ff}:root[data-theme="dark"] .cl{color:#ff8a7a}
.cn.zero,.cl.zero,.cr.zero{color:var(--muted);font-weight:400;opacity:.7}
.cdone{color:var(--ok);font-weight:700}
.sright{display:flex;gap:12px;align-items:center}
.restart:disabled{opacity:.35;cursor:default}
.cstate{font-weight:700;letter-spacing:.04em;border-radius:6px;padding:0 6px}
.cstate:empty{display:none}
.cstate.n{color:#2f6fd0;background:rgba(47,111,208,.1)}.cstate.l{color:#c0392b;background:rgba(192,57,43,.1)}.cstate.r{color:var(--ok);background:var(--ok-soft)}
.donebox{flex:1;display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--ok);border-radius:16px;padding:22px 20px}
.donebox b{font-family:var(--display);font-size:1.2rem;color:var(--ok)}
.donebox p{margin:0;color:var(--muted)}
.donebox .unit{flex-direction:column;align-items:flex-start;gap:2px}
.donebox .unit .sub{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
.restart{background:none;border:none;color:var(--muted);font-size:.8rem;text-decoration:underline;cursor:pointer;padding:0}
</style>
</head>
<body>
<main class="wrap" id="home">
  <nav class="switch" aria-label="版の切り替え"><a href="../">章別</a><a href="./" aria-current="page">Day別</a></nav>
  <h1>脳解剖学 単語帳 Day別</h1>
  <p class="lede">Signorelli 口頭試験の一問一答 <span id="total"></span> 枚。21日の学習ルートの順に並んでいます。その日のDayを開いて始めてください。カードは Anki と同じ方式です。答えを見たら「もう一度・難しい・正解・簡単」で手応えを選ぶと、次に出す日が自動で決まります。各Dayの「復習」には、それより前の全Dayから今日が期限のカードが出ます。</p>
  <div class="opts">
    <button class="toggle" id="optStar" aria-pressed="false"><span class="dot"></span>過去問に出た ★ だけ</button>
    <button class="toggle" id="optShuffle" aria-pressed="false"><span class="dot"></span>順番を混ぜる</button>
  </div>
  <button class="resume" id="resume" type="button" hidden><b>前回の続き</b><span></span><small></small></button>
  <div class="chapters" id="chapters"></div>
</main>
<main class="wrap" id="study" hidden>
  <div class="bar">
    <button class="back" id="back">← 単元一覧</button>
    <div class="where"><b id="uTitle"></b><span id="uSub"></span></div>
  </div>
  <div>
    <div class="stats"><span id="left" class="cnts"></span><span class="sright"><span id="round"></span><button class="restart" id="undo" type="button">↶ 取り消す</button><button class="restart" id="restart" type="button">最初から</button></span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div class="toast" id="toast" hidden>全部分かりました。最初からもう一度始めます。</div>
  <div class="card" id="card" tabindex="0" role="button" aria-label="カードをめくる">
    <div class="tag"><span class="cstate" id="cState"></span><span id="cSec"></span><span class="star" id="cStar"></span></div>
    <p class="q" id="q"></p>
    <hr class="rule" id="rule">
    <div class="a" id="a"></div>
    <div class="note" id="note"><b>備考(ゴロ合わせ)</b><span id="noteText"></span></div>
    <div class="hint" id="hint">タップして答えを見る</div>
  </div>
  <div class="donebox" id="doneBox" hidden>
    <b id="doneTitle"></b>
    <p id="doneText"></p>
    <button class="unit all" id="doneHome" type="button">単元一覧へ</button>
    <button class="unit" id="doneCram" type="button">練習:このデッキを全部回す<span class="sub">「分かった/分からなかった」の方式。次に出す日は変わりません</span></button>
  </div>
  <div class="acts" id="acts">
    <button class="show" id="btnShow">答えを見る</button>
    <button class="again" id="btnAgain">分からなかった<small>デッキの一番後ろへ</small></button>
    <button class="ok" id="btnOk">分かった<small>このカードを外す</small></button>
    <button class="g1" data-b="1" hidden>もう一度<small></small></button>
    <button class="g2" data-b="2" hidden>難しい<small></small></button>
    <button class="g3" data-b="3" hidden>正解<small></small></button>
    <button class="g4" data-b="4" hidden>簡単<small></small></button>
  </div>
</main>
<script>
const DECKS=[{"title":"1 脳幹の構成と3つの断面","secs":[{"title":"全体構造と核の配列","cards":[{"q":"脳幹の4要素(横断面の区分)は?","a":"Base(腹側、下行路:cerebral peduncles・ventral pons・pyramids)、tegmentum(脳神経核・上行路・reticular formation)、roof(tectum、medullary vela、第四脳室の屋根)、ventricular cavity","s":2},{"q":"脳神経核の配列の原則は?","a":"縦の柱(columns)を作り、medialがmotor、lateralがsensory。境はsulcus limitans。第四脳室が開いて脊髄の背腹配列が内外配列になった","s":2,"n":"Rule of 4:正中寄りのmotor核は12の約数(III, IV, VI, XII)。medullaにIX–XII、ponsにV–VIII、その上にI–IV"},{"q":"Somatic motor nucleiは?","a":"Oculomotor(midbrain、superior colliculusレベル)、trochlear(inferior colliculusレベル)、abducens(pons、facial colliculus)、hypoglossal(medulla、hypoglossal trigone)","s":0,"n":"12の約数で覚える:3, 4, 6, 12(Rule of 4)"},{"q":"Special visceral efferent (branchiomotor) nucleiは?","a":"Trigeminal motor n.(pons)、facial motor n.(pons)、nucleus ambiguus(medulla)、spinal accessory n.","s":0},{"q":"General visceral efferent(副交感)nucleiは?","a":"Edinger-Westphal、superior salivatory、inferior salivatory、dorsal motor nucleus of vagus","s":0,"n":"副交感を運ぶ脳神経は 1973:X, IX, VII, III"},{"q":"Sensory nuclei(lateral column)は?","a":"Trigeminal sensory nuclei(mesencephalic・main・spinal)、vestibularとcochlear nuclei、solitary nucleus","s":0},{"q":"Medullaの脳神経核を内→外に","a":"Hypoglossal n. → dorsal motor n. of vagus(+ inferior salivatory)→ solitary n. → vestibular nn. → spinal trigeminal n.。nucleus ambiguusは腹外側のreticular formation内","s":1},{"q":"脳幹を通るlong tractsは?","a":"上行:spinothalamic tract(lateral tegmentum)とmedial lemniscus。下行:corticospinalとcorticobulbar tract(base)","s":0}]},{"title":"断面(midbrain・pons・medulla)","cards":[{"q":"Midbrainの断面を前→後に","a":"Interpeduncular fossaとcrus cerebri → substantia nigra → tegmentum(red nucleus、medial lemniscus、spinothalamic tract、reticular formation、MLF、CN III / IV核)→ periaqueductal grayとcerebral aqueduct → tectum(superior / inferior colliculi)","s":2},{"q":"Crus cerebriの線維配列は?","a":"内側1/5:frontopontine。中央3/5:corticospinalとcorticobulbar。外側1/5:parieto-temporo-occipitopontine","s":0},{"q":"Sylvian aqueductとは? 周囲の構造は?","a":"Cerebral aqueduct。第三脳室と第四脳室をつなぐ。周囲はperiaqueductal gray matter","s":1},{"q":"Red nucleusの機能と連絡は?","a":"運動の協調。入力:cerebellum(superior cerebellar peduncle経由)とcortex。出力:rubrospinal tract(上肢屈筋)とinferior olive(central tegmental tract)","s":1},{"q":"Superior / inferior colliculusの機能は?","a":"Superior:視覚反射。Inferior:聴覚路の中継","s":0},{"q":"Midbrain下部(inferior colliculusレベル)の特徴は?","a":"Trochlear nucleus、decussation of superior cerebellar peduncles、lateral lemniscus","s":0},{"q":"Ponsの構造は?","a":"Basilar part:pontine nuclei、横走するpontocerebellar fibers(→ middle cerebellar peduncle)、corticospinal・corticobulbar線維。Tegmentum:CN V–VIIIの核、medial lemniscus、trapezoid body、MLF、reticular formation","s":1},{"q":"Medullaの腹側面の構造は?","a":"Anterior median fissure、pyramid、preolivary sulcus(XIIが出る)、olive、retro-olivary sulcus(IX・X・XIが出る)","s":0},{"q":"Pyramidal decussationの位置と割合は?","a":"Medulla下端。約85〜90%が交叉しlateral corticospinal tractになる","s":0},{"q":"Bulbopontine sulcusから出る神経は(内→外)?","a":"VI、VII(+ nervus intermedius)、VIII","s":0}]}],"rev":[]},{"title":"2 動眼・滑車・外転神経、瞳孔、注視","secs":[{"title":"CN III・IV・VIと眼球運動","cards":[{"q":"III・IV・VIの核をつなぐものは?","a":"Medial longitudinal fasciculus (MLF)。vestibular nucleiとも連絡","s":1},{"q":"眼球を動かす神経と筋は?","a":"III:superior・inferior・medial rectus、inferior oblique、levator palpebrae。IV:superior oblique(down and out)。VI:lateral rectus(out)","s":2,"n":"LR6 SO4, 残りは3:Lateral Rectus = VI, Superior Oblique = IV, その他 = III"},{"q":"CN IIIの経路は?","a":"核(superior colliculusレベル)→ red nucleusを貫く → interpeduncular fossa → PCAとSCAの間 → PCoAの外側 → cavernous sinus外側壁 → superior orbital fissure","s":1},{"q":"Edinger-Westphal nucleusからの線維の運命は?","a":"Preganglionic parasympathetic線維がCN IIIの表層を走る → ciliary ganglion → short ciliary nerves → sphincter pupillaeとciliary muscle","s":2},{"q":"Pupillary light reflexの経路は?","a":"Retina → optic nerve → chiasm → optic tract → pretectal nucleus(LGBは通らない)→ 両側Edinger-Westphal → CN III → ciliary ganglion → short ciliary nerves → sphincter pupillae。directとconsensual","s":2},{"q":"Accommodation reflexの3要素は?","a":"Convergence、lensが厚くなる(ciliary muscle収縮)、miosis。visual association cortexからpretectal areaへ","s":0},{"q":"CN IVの2つの「唯一」は?","a":"唯一、完全に交叉する(superior medullary velum内)。唯一、脳幹の背側(inferior colliculusの下)から出る","s":0,"n":"SO4:Superior Oblique = CN IV"},{"q":"CN VIの核の位置と機能は?","a":"Pons、第四脳室底のfacial colliculusの深部。lateral rectusで眼球外転","s":1},{"q":"CN VIの経路は?","a":"Ponsを前方へ貫く → pontomedullary sulcusで出る → clivus上を上行 → duraを貫きDorello's canal → cavernous sinus(ICAの外側、sinusの内部)→ superior orbital fissure → lateral rectus","s":2},{"q":"Dorello's canalとは?","a":"Petrous apexとpetrosphenoidal (Gruber's) ligamentの間の管。CN VIが通り、ここで固定されるため頭蓋内圧亢進で障害されやすい","s":1},{"q":"Cavernous sinus内でCN VIはどこ?","a":"Sinusの内部でICAの外側。III・IV・V1・V2は外側壁内","s":1,"n":"O TOM CAT:外側壁を上から Oculomotor, Trochlear, Ophthalmic, Maxillary。内部に Carotid, Abducens, (T)"},{"q":"Facial colliculusとは?","a":"第四脳室底(pons部)の隆起。abducens nucleusとそれを回る顔面神経線維(internal genu)が作る","s":1},{"q":"Conjugate horizontal gazeの経路は?","a":"Frontal eye field (area 8) → internal capsule genu → ponsで交叉 → 対側PPRF → 同側abducens nucleus → MLF → 対側oculomotor nucleus。右area 8は眼を左へ向ける","s":0}]},{"title":"瞳孔の交感神経","cards":[{"q":"瞳孔散大の交感神経路は?","a":"Hypothalamus → ciliospinal center (C8–T2) → superior cervical ganglion → internal carotid plexus → long ciliary nerves → dilator pupillae","s":0},{"q":"Horner's syndromeの徴候は?","a":"Miosis、ptosis、enophthalmos、顔面のanhidrosis","s":0,"n":"PAM is horny:Ptosis, Anhidrosis, Miosis"}]}],"rev":[0]},{"title":"3 三叉神経と顔面神経","secs":[{"title":"CN V","cards":[{"q":"Trigeminal nerveの4核と機能は?","a":"Mesencephalic n.(proprioception)、main (principal) sensory n.(light touch)、spinal trigeminal n.(pain・temperature)、motor n.(咀嚼筋)","s":2},{"q":"Gasser's ganglionの別名と位置は?","a":"Trigeminal (semilunar) ganglion。petrous apex上のMeckel's cave内","s":1},{"q":"3枝と頭蓋底の孔は?","a":"V1 ophthalmic:superior orbital fissure。V2 maxillary:foramen rotundum。V3 mandibular:foramen ovale","s":2,"n":"Standing Room Only:V1 Superior orbital fissure, V2 foramen Rotundum, V3 foramen Ovale"},{"q":"V1の3枝は?","a":"Frontal(最大)、nasociliary、lacrimal(最小)","s":0},{"q":"CN Vは脳幹のどこから出る?","a":"Ponsの外側面(middle cerebellar peduncleとの境)","s":0},{"q":"Motor rootが支配する筋は?","a":"Masticatory muscles、tensor veli palatini、tensor tympani、mylohyoid、anterior belly of digastric","s":0},{"q":"Proprioceptionの1st order neuronはどこ?","a":"Mesencephalic nucleus(Gasser's ganglionではない。解剖学的にはganglion)","s":0},{"q":"Trigeminal lemniscusとは?","a":"Main sensory nucleusからの2nd order fibers。交叉してmedial lemniscusに沿って上行しVPMへ。顔の触覚","s":2},{"q":"Trigeminothalamic tractとは?","a":"Spinal trigeminal nucleusからの2nd order fibers。交叉してVPMへ。顔の痛覚・温度覚","s":0},{"q":"三叉神経感覚核内のsomatotopyは?","a":"逆転している:V1(眼)が腹側、V3が背側。spinal nucleusは口周囲が吻側、顔周辺が尾側(onion-skin)","s":1},{"q":"CN Vに関連する反射は?","a":"Corneal reflex:求心V1(nasociliary)、遠心VII、両側閉眼。Jaw-jerk reflex:求心も遠心もV3、mesencephalic n. → motor n.の単シナプス","s":2}]},{"title":"CN VII","cards":[{"q":"Facial nerveの核は?","a":"Motor nucleus(caudal pons)、superior salivatory nucleus(副交感)、solitary tract nucleus(味覚)","s":2},{"q":"Facial nerveの経路(internal acoustic meatusまで)は?","a":"Motor fibersがabducens nucleusを回る(internal genu)→ bulbopontine sulcus外側部でnervus intermediusと共に出る(VIIIの内側)→ cerebellopontine angle → internal acoustic meatus(VIIIと共に、falciform crestの上前方)","s":2},{"q":"Internal acoustic meatus以降は?","a":"Facial canal:labyrinthine segment → geniculate ganglion(external genu)→ tympanic segment → mastoid segment → stylomastoid foramen → parotid gland内で5枝","s":2,"n":"耳下腺内の5枝:To Zanzibar By Motor Car(Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical)"},{"q":"Facial nerveはどの孔から頭蓋を出る?","a":"Stylomastoid foramen","s":1},{"q":"Facial canal内で出る3枝は?","a":"Greater superficial petrosal nerve(geniculate ganglionから)、nerve to stapedius、chorda tympani","s":0},{"q":"顔面神経に関係するgangliaは?","a":"Geniculate(感覚)、pterygopalatineとsubmandibular(副交感)","s":1},{"q":"Lacrimal glandへの経路は?","a":"Superior salivatory n. → nervus intermedius → greater superficial petrosal n. → pterygopalatine ganglion → lacrimal gland","s":1},{"q":"Salivationの経路は?","a":"Superior salivatory n. → nervus intermedius → chorda tympani → submandibular ganglion → submandibularとsublingual glands","s":1},{"q":"味覚を運ぶ顔面神経の枝は?","a":"Chorda tympani(舌前2/3)→ geniculate ganglion → nervus intermedius → solitary tract nucleus","s":1},{"q":"顔面神経核への皮質支配は?","a":"上顔面を支配する部分は両側皮質から、下顔面の部分は対側皮質のみ","s":1},{"q":"Centralとperipheral facial palsyの違いは?","a":"Central(上位):対側の下顔面のみ麻痺、額は保たれる。Peripheral(下位):同側の顔半分全体","s":1}]}],"rev":[1]},{"title":"4 VIII〜XII、嗅神経、副交感神経、第4脳室底","secs":[{"title":"聴覚路","cards":[{"q":"聴覚路の1st order neuronは?","a":"Spiral ganglionの細胞。末梢突起はorgan of Corti、中枢突起がcochlear nerve","s":1},{"q":"聴覚路を順に","a":"Cochlear nuclei → (trapezoid bodyで交叉)superior olivary nucleus → lateral lemniscus → inferior colliculus → brachium of inferior colliculus → medial geniculate body → auditory radiation(sublentiform part)→ Heschl's gyrus (41, 42)","s":1},{"q":"聴覚は同側・対側のどちらに投射?","a":"Bilateral。cochlear nucleiより上は両側性なので、一側の中枢病変では聾にならない","s":1},{"q":"聴覚を受ける皮質の名前は?","a":"Primary auditory cortex = Heschl's gyrus(areas 41, 42)。周囲がWernicke's area (22)","s":1}]},{"title":"CN I(嗅覚)","cards":[{"q":"Olfactory pathwayの1st・2nd order neuronは?","a":"1st:nasal epitheliumのreceptor neurons(fila olfactoriaがcribriform plateを通る)。2nd:olfactory bulbのmitral cells(→ olfactory tract)","s":0},{"q":"Lateral / medial olfactory striaの行き先は?","a":"Lateral:primary olfactory cortex(piriform cortex、uncus)。Medial:anterior commissureを経て対側へ。thalamusを経由しない","s":0}]},{"title":"CN VIIIと味覚","cards":[{"q":"味覚を担う神経と核は?","a":"VII(舌前2/3)、IX(後1/3)、X(epiglottis)→ solitary nucleusの吻側部 → VPM → insula・frontal operculum","s":0},{"q":"CN VIIIの3部とgangliaは?","a":"Superior vestibular、inferior vestibular、cochlear。vestibular (Scarpa's) ganglionとspiral ganglion","s":0},{"q":"聴覚器の構造は?","a":"Cochlea:modiolusの周りを2回転半。受容器はorgan of Cortiのhair cells。spiral ganglionはRosenthal's canal内","s":1},{"q":"Vestibular systemの受容器は?","a":"Semicircular canalsのampullaにあるcrista ampullaris(回転加速度)と、utricle・sacculeのotolith organs(直線加速度・重力)","s":1},{"q":"Vestibular nucleiの投射先は?","a":"同側flocculonodular lobe(inferior cerebellar peduncle)、両側VP thalamus → cortex、III・IV・VI核(MLF)、脊髄(lateral / medial vestibulospinal tracts)","s":1}]},{"title":"CN IX–XII","cards":[{"q":"CN IXの成分と核は?","a":"Nucleus ambiguus(stylopharyngeus)、inferior salivatory n.(parotid、otic ganglion経由)、solitary n.(舌後1/3の味覚と感覚、carotid body / sinus)、spinal trigeminal n.(耳の皮膚)","s":0},{"q":"Parotid glandへの経路は?","a":"Inferior salivatory n. → IX → tympanic nerve → lesser petrosal nerve → otic ganglion → auriculotemporal nerve → parotid","s":0},{"q":"Carotid body / sinusからの経路は?","a":"Carotid sinus nerve (IX) → inferior glossopharyngeal ganglion → solitary tract nucleus","s":0},{"q":"娚下の神経と核は?","a":"IXとX。運動はnucleus ambiguus(pharynx・larynxの横紋筋)","s":1},{"q":"なぜnucleus ambiguusと呼ぶ?","a":"Reticular formation内で境界が不明瞭(ambiguous)で、組織学的に同定しにくいから","s":1},{"q":"CN Xの核は?","a":"Nucleus ambiguus(branchiomotor)、dorsal motor nucleus(副交感、vagal trigone)、solitary n.(内臓感覚・味覚)、spinal trigeminal n.(耳)","s":0},{"q":"CN Xの出口とganglia、頸部の位置は?","a":"Retro-olivary sulcusから出てjugular foramenへ。superior / inferior ganglia。carotid sheath内でICAとIJVの間","s":0},{"q":"迷走神経の副交感神経節はどこ?","a":"標的臓器の壁内または近傍","s":0},{"q":"CN XIの核と支配筋は?","a":"Spinal accessory nucleus(C1–C5前角)。sternocleidomastoid(頭を対側へ回す)とtrapezius(肩をすくめる)","s":0},{"q":"CN XIIの核・出口・機能は?","a":"Hypoglossal nucleus(hypoglossal trigone)。pyramidとoliveの間のpreolivary sulcusから出てhypoglossal canalへ。genioglossusと舌内筋","s":2},{"q":"CN XII障害で舌はどちらへ偏る?","a":"障害側へ(健側genioglossusが押し出すため)","s":0},{"q":"Jugular foramenを通る神経は?","a":"IX、X、XI","s":0,"n":"日本語の定番ゴロ(脳神経12対):嗅いで視る 動く車の 三の外 顔聴く舌に 迷う副舌"}]},{"title":"Autonomic nervous system","cards":[{"q":"Sympathetic系の中枢は?","a":"脊髄T1–L2のlateral horn(intermediolateral nucleus)","s":1},{"q":"Sympathetic系の構成は?","a":"短いpreganglionic fiber → white ramus communicans → sympathetic tru 2–S4:parasympathetic preganglionic neurons","s":2},{"q":"Anterior hornのsomatotopyは?","a":"Medial group:axialとproximal muscles(全高位)。Lateral group:四肢のdistal muscles(enlargementsのみ)。腹側がextensors、背側がflexors","s":2},{"q":"Dermatomeric organizationとは?","a":"各脊髄分節が一定の皮膚帯(dermatome)と筋群(myotome)を支配すること","s":1},{"q":"代表的なdermatomeは?","a":"C6 母指、C7 中指、C8 小指、T4 乳頭、T10 臍、L4 膝、L5 母趾、S1 足外側","s":0,"n":"T4 = teat pore(乳頭)、T10 = belly butTEN(臍)"},{"q":"脊髄の血管支配は?","a":"Anterior spinal artery(前2/3)、2本のposterior spinal arteries(後1/3)、segmental medullary arteries","s":0},{"q":"Artery of Adamkiewiczとは?","a":"最大のanterior segmental medullary artery。75%で左側、T8–L1の肋間動脈から","s":0}]},{"title":"白質とtracts","cards":[{"q":"White matterの3つのfuniculiは?","a":"Dorsal、lateral、ventral funiculi","s":2},{"q":"主な上行路と位置は?","a":"Dorsal funiculus:fasciculus gracilisとcuneatus。Lateral:lateral spinothalamic、dorsal / ventral spinocerebellar。Ventral:anterior spinothalamic。後角尖端にLissauer's tract","s":2},{"q":"主な下行路と位置は?","a":"Lateral:lateral corticospinal、rubrospinal。Ventral:anterior corticospinal、vestibulospinal、reticulospinal、tectospinal","s":2},{"q":"Fasciculus gracilisとcuneatusの違いは?","a":"Gracilis:内側、T6より下(下半身)。Cuneatus:外側、T6より上(上半身)","s":0,"n":"Gracilis = graceful legs(下肢)"},{"q":"Dorsal columnsが運ぶ感覚は?","a":"Discriminative (fine) touch、pressure、vibration、position sense(conscious proprioception)","s":1},{"q":"Spinothalamic tractが運ぶ感覚は?","a":"Lateral:painとtemperature。Anterior:crude touch","s":1},{"q":"Lissauer's tractの意義は?","a":"DRG線維が上下1〜2分節に広がって後角に入る。損傷高位のdermatomeがanesthesiaでなくhypoesthesiaになる理由","s":0},{"q":"Spinothalamic tract内のsomatotopyは?","a":"Sacralが最外側(表層)、cervicalが内側。中心性病変でsacral sparing","s":0},{"q":"Spinocerebellar tractsの機能は?","a":"Unconscious proprioceptionを同側小脳へ。dorsal(Clarke's column、非交叉、inferior peduncle)とventral(二重交叉、superior peduncle)","s":2},{"q":"Lateral corticospinal tractの特徴は?","a":"Pyramidsで交叉。随意運動、特に精細運動。somatotopyは内→外にC-T-L-S","s":1},{"q":"Anterior corticospinal tractは?","a":"Pyramidsでは交叉せず let touched=false; $('chapters').addEventListener('click',e=>{if(e.target.closest('summary'))touched=true;});
window.addEventListener('neuro-sync',e=>{const ks=(e.detail&&e.detail.keys)||[];
  if(ks.indexOf(SRS_KEY)>=0){try{SRS=JSON.parse(localStorage.getItem(SRS_KEY)||'{}')||{};}catch(err){}}

// 開いたときは、前回の続きの単元を開く(その単元の印が全部ついていれば、次のまだ終わっていない単元)。
// 記録がなければ、最初のまだ終わっていない単元。下の方なら見える位置までスクロールする。
function openCurrent(scroll){
  const ds=[...document.querySelectorAll('#chapters details')]; if(!ds.length) return;
  const L=loadLast(); let i=(L&&Number.isInteger(L.ci)&&ds[L.ci])?L.ci:0;
  while(i<ds.length-1&&ds[i].classList.contains('done')) i++;
  ds.forEach((d,k)=>{d.open=k===i;});
  if(scroll){const r=ds[i].querySelector('summary').getBoundingClientRect();
    if(r.top>innerHeight*0.6) window.scrollTo({top:r.top+scrollY-12});}
}
openCurrent(true);
