視床膝状体動脈。P2 の枝"},{"q":"calcarine artery","a":"鳥距動脈。PCA の終枝、視覚野へ"}],"facts":[{"q":"MCA が入る脳溝","a":"外側溝(Sylvius 裂)"},{"q":"MCA の4区分","a":"M1 水平部・M2 島部・M3 弁蓋部・M4 皮質部"},{"q":"M1 の範囲","a":"ICA の分岐から島限まで"},{"q":"MCA が上下の幹に分かれる場所","a":"島限"},{"q":"MCA が養う皮質","a":"半球の外側面の大部分と島"},{"q":"MCA が養う運動野の部分","a":"顔と手(上肢)"},{"q":"外側レンズ核線条体動脈の起始","a":"M1"},{"q":"外側レンズ核線条体動脈が養うもの","a":"被殻・淡蒼球外側・尾状核・内包"},{"q":"高血圧性脳出血が多い血管","a":"外側レンズ核線条体動脈"},{"q":"MCA 梗塞の主な症状","a":"反対側の顔と腕の麻痺、優位側なら失語"},{"q":"前有孔質の前の境界","a":"嗅三角(内側・外側嗅条)"},{"q":"前有孔質の後ろの境界","a":"視索"},{"q":"前有孔質の外側の縁","a":"島限"},{"q":"前有孔質を貫く ACA の枝","a":"Heubner 反回動脈"},{"q":"前有孔質を貫く MCA の枝","a":"外側・中間レンズ核線条体動脈"},{"q":"椎骨動脈の起始","a":"鎖骨下動脈"},{"q":"椎骨動脈が通る横突孔の範囲","a":"C6〜C1"},{"q":"左右の椎骨動脈が合流する場所","a":"橋の下縁"},{"q":"前脊髄動脈の起始","a":"椎骨動脈"},{"q":"小脳を養う3動脈を下から","a":"PICA → AICA → SCA"},{"q":"PICA の起始","a":"椎骨動脈"},{"q":"AICA の起始","a":"脳底動脈の下部"},{"q":"SCA の起始","a":"脳底動脈の先端の手前"},{"q":"延髄を養う小脳動脈","a":"PICA"},{"q":"PICA が養う小脳の部分","a":"下面・扁桃・下虫部"},{"q":"PICA が養う脈絡叢","a":"第四脳室の脈絡叢"},{"q":"内耳を養う動脈","a":"迷路動脈(AICA の枝)"},{"q":"AICA が養う小脳脚","a":"中小脳脚"},{"q":"小脳の上面を養う動脈","a":"SCA"},{"q":"歯状核を養う動脈","a":"SCA"},{"q":"CN III が通る2本の動脈の間","a":"上の PCA と下の SCA"},{"q":"PICA の区分の数","a":"5つ"},{"q":"PICA の caudal loop がある場所","a":"扁桃の下端"},{"q":"PICA の cranial loop がある場所","a":"下髄帆の上"},{"q":"外側延髄の梗塞の名前","a":"Wallenberg 症候群"},{"q":"PCA の起始","a":"脳底動脈の先端"},{"q":"胎児型 PCA の頻度","a":"約15%"},{"q":"P1 の範囲","a":"脳底動脈から PCoA まで"},{"q":"P2 が通る脳槽","a":"大脳脚槽(前半)と迂回槽(後半)"},{"q":"P3 が通る脳槽","a":"四丘体槽"},{"q":"PCA が養う皮質","a":"後頭葉と側頭葉の下内側面"},{"q":"P1 から視床へ行く枝","a":"視床穿通動脈"},{"q":"視床穿通動脈が通る場所","a":"後有孔質"},{"q":"PCA の終枝","a":"鳥距動脈と頭頂後頭動脈"},{"q":"PCA 梗塞の主な症状","a":"反対側の同名半盲"}]},{"title":"18 硬膜・脳槽・静脈、頸神経叢・腕神経叢","secs":[{"title":"静脈と硬膜静脈洞","cards":[{"q":"Dural sinusはどこにある? 弁は?","a":"Duraのperiosteal layerとmeningeal layerの間。弁はない。最終的にinternal jugular veinへ","s":0},{"q":"静脈洞の流れは?","a":"Superior sagittal sinus → confluence (torcular Herophili)。Inferior sagittal sinus + great vein of Galen → straight sinus → confluence。そこからtransverse → sigmoid → IJV","s":1},{"q":"Cavernous sinusの流出路は?","a":"Superior petrosal sinus(→ transverse)とinferior petrosal sinus(→ sigmoid / IJV)","s":0},{"q":"Superficial veinsの主な3つは?","a":"Superficial Sylvian (middle cerebral) vein、vein of Trolard(→ superior sagittal sinus)、vein of Labbé(→ transverse sinus)","s":0},{"q":"Deep veinsは?","a":"Internal cerebral veins(thalamostriate・anterior septal・choroidal veinsが合流、第三脳室の屋根を走る)とbasal veins of Rosenthal → great cerebral vein of Galen → straight sinus","s":1},{"q":"Cavernous sinusのParkinson's triangleとは?","a":"Infratrochlear triangle:CN IV下縁とV1上縁の間。meningohypophyseal trunkの起始がある","s":0}]},{"title":"Meningesとcisterns","cards":[{"q":"3層のmeningesと腔は?","a":"Dura mater、arachnoid mater、pia mater。epidural、subdural、subarachnoid space(CSFと主要血管)","s":0,"n":"PAD(内→外):Pia, Arachnoid, Dura"},{"q":"Duraの2層は?","a":"Periosteal layerとmeningeal layer。間にdural venous sinuses","s":0},{"q":"Duraが作る構造は?","a":"Falx cerebri、tentorium cerebelli、falx cerebelli、diaphragma sellae、dural venous sinuses、Meckel's cave","s":2},{"q":"Tentoriumの付着は?","a":"後外側:occipital bone(transverse sinusの溝)とpetrous ridge。free borderは前方でanterior clinoid processへ、attached borderはposterior clinoid processへ","s":1},{"q":"Tentoriumのfree borderの中にある構造は?","a":"Tentorial notch (incisura)をmidbrain(brainstem)が通る","s":1},{"q":"Tentoriumに関係するsinusは?","a":"Straight sinus(falxとの接合部)、transverse sinus、superior petrosal sinus","s":0},{"q":"Spinal duraの下端とspinal cordの下端は?","a":"Duraとsubarachnoid spaceはS2。spinal cordはL1–L2","s":0},{"q":"Piaが作る脊髄の構造は?","a":"Denticulate ligamentsとfilum terminale","s":0},{"q":"Midbrain周囲のcisternsは?","a":"前:interpeduncular cistern。外側:cruralとambient cisterns。後:quadrigeminal cistern","s":1},{"q":"Ambient cisternの内容(動脈・神経・静脈)は?","a":"動脈:PCA (P2)とSCA。神経:CN IV。静脈:basal vein of Rosenthal","s":1},{"q":"Interpeduncular cisternの内容は?","a":"Basilar bifurcation、P1、thalamoperforating arteries、CN III","s":0},{"q":"最大のcisternは?","a":"Cisterna magna(cerebellomedullary cistern)","s":0},{"q":"Quadrigeminal cisternの内容は?","a":"Great vein of Galen、P3、pineal gland","s":0}]},{"title":"Cervical plexusとbrachial plexus","cards":[{"q":"Cervical plexusの根と位置は?","a":"C1–C4。sternocleidomastoidの深部。C1は運動のみ","s":0},{"q":"Cervical plexusの浅枝(感覚)は?","a":"Lesser occipital、great auricular、transverse cervical、supraclavicular nerves","s":0},{"q":"深枝(運動)は?","a":"Ansa cervicalis(infrahyoid muscles)、phrenic nerve、XIへの枝(SCM・trapezius)、頸部深筋への枝","s":0},{"q":"Phrenic nerveの根と経路は?","a":"C3–C5。anterior scaleneの前面を下行し、subclavian arteryとveinの間から胸腔へ入りdiaphragmへ","s":1,"n":"C3, 4, 5 keeps the diaphragm alive"},{"q":"Brachial plexusの根と位置は?","a":"C5–T1のventral rami。posterior triangle of the neck、anteriorとmiddle scaleneの間","s":2},{"q":"5つの構成段階は?","a":"5 roots → 3 trunks → 6 divisions → 3 cords → 5 terminal branches","s":2,"n":"Randy Travis Drinks Cold Beer:Roots, Trunks, Divisions, Cords, Branches"},{"q":"Trunksのでき方は?","a":"C5 + C6 = upper。C7 = middle。C8 + T1 = lower","s":2},{"q":"Cordsのでき方は?","a":"3つのposterior divisions = posterior cord。upperとmiddleのanterior divisions = lateral cord。lowerのanterior division = medial cord。axillary arteryに対する位置で命名","s":2},{"q":"5つの終枝と由来は?","a":"Musculocutaneous(lateral cord)、median(lateral + medial)、ulnar(medial)、axillaryとradial(posterior)","s":2},{"q":"Rootsから出る枝は?","a":"Dorsal scapular n.(C5)、long thoracic n.(C5–C7、serratus anterior)","s":0,"n":"C5, 6, 7 raise your wings to heaven(long thoracic nerve麻痺でwinged scapula)"},{"q":"Upper trunkから出る枝は?","a":"Suprascapular n.、nerve to subclavius","s":0},{"q":"Lateral cordの枝は?","a":"Lateral pectoral n.、musculocutaneous n.、medianのlateral root","s":0,"n":"LML:Lateral pectoral, Musculocutaneous, Lateral root of median"},{"q":"Medial cordの枝は?","a":"Medial pectoral n.、medial cutaneous nn. of arm / forearm、ulnar n.、medianのmedial root","s":0,"n":"MMMUM / 4 Ms and a U:Medial pectoral, Medial cutaneous of arm, Medial cutaneous of forearm, Ulnar, Median(medial root)"},{"q":"Posterior cordの枝は?","a":"Upper / lower subscapular nn.、thoracodorsal n.、axillary n.、radial n.","s":0,"n":"ULTRA / STAR(S):Upper subscapular, Lower subscapular, Thoracodorsal, Radial, Axillary"},{"q":"Thoracic outletの3つの隙間は?","a":"Interscalene triangle、costoclavicular space、retropectoralis minor space","s":1},{"q":"Thoracic outlet syndromeの3型は?","a":"Vascular(subclavian artery / vein)、neurogenic 1(medial cord C8–T1、多い)、neurogenic 2(lateral cord C5–C7)","s":0},{"q":"Upper / lower plexus syndromeは?","a":"Upper (Erb、C5–C6):肩外転・肘屈曲の麻痺。Lower (Klumpke、C8–T1):手内筋の麻痺とclaw hand","s":0,"n":"Erb麻痺の肢位 = waiter's tip"},{"q":"Pancoast tumorが侵すのは?","a":"Lower brachial plexus(+ 交感神経幹でHorner)","s":0}]}],"rev":[16,10,3],"lesson":[{"h":"脳を包む3枚の膜","b":["外から dura mater(硬膜)、arachnoid mater(くも膜)、pia mater(軟膜、脳の表面に密着)。内から PAD(Pia・Arachnoid・Dura)と覚える。","すき間:頭蓋骨と硬膜の間が epidural space(硬膜外腔)、硬膜とくも膜の間が subdural space、くも膜と軟膜の間が subarachnoid space(くも膜下腔:CSF と太い血管が通る)。"]},{"h":"硬膜は2枚重ね","b":["頭の硬膜は外側の periosteal layer(骨膜層)と内側の meningeal layer(髄膜層)の2枚。ところどころで2枚が離れて、間に dural venous sinuses(硬膜静脈洞)ができる。","髄膜層は内側へ折れ込んで仕切りを作る:","- falx cerebri(大脳鎌):左右の大脳半球の間。","- tentorium cerebelli(小脳テント):大脳と小脳の間の水平な板。","- falx cerebelli(小脳鎌):左右の小脳半球の間。","- diaphragma sellae(鞍隔膜):下垂体の上の蓋。","他に Meckel's cave(三叉神経節を包む)。"]},{"h":"小脳テント","b":["後ろと外側は後頭骨(横静脈洞の溝)と錐体の稜につく。前の内側の縁は自由縁で、前床突起へ向かう。","自由縁で囲まれた穴が tentorial notch(テント切痕)で、ここを中脳(脳幹)が通る。鉤や海馬傍回がこの縁に押されるのがテント切痕ヘルニア。","テントと大脳鎌のつなぎ目に straight sinus(直静脈洞)。"]},{"h":"脳槽:くも膜下腔の広い所","b":["くも膜下腔が広くなった場所を cistern(脳槽)という。","- cisterna magna(大槽):小脳と延髄の間、最大。","- prepontine cistern(橋前槽):橋の前、脳底動脈。","- interpeduncular cistern(脚間槽):中脳の前。脳底動脈の先端、P1、視床穿通動脈、CN III。","- crural と ambient cistern(大脳脚槽・迂回槽):中脳の外側。PCA(P2)と SCA、CN IV、basal vein of Rosenthal(脳底静脈)。","- quadrigeminal cistern(四丘体槽):中脳の後ろ。大大脳静脈(Galen)、P3、松果体。"]},{"h":"静脈と静脈洞の流れ","b":["硬膜静脈洞には弁がなく、最後は internal jugular vein(内頸静脈)へ。","- superior sagittal sinus(上矢状静脈洞)→ confluence of sinuses(静脈洞交会)。","- inferior sagittal sinus(下矢状静脈洞)+ great cerebral vein of Galen(大大脳静脈)→ straight sinus(直静脈洞)→ 静脈洞交会。","- 静脈洞交会 → transverse sinus(横静脈洞)→ sigmoid sinus(S状静脈洞)→ 内頸静脈。","- cavernous sinus(海綿静脈洞)→ superior / inferior petrosal sinus(上・下錐体静脈洞)→ 横静脈洞・S状静脈洞・内頸静脈。","表面の静脈:superficial middle cerebral vein(浅中大脳静脈)、vein of Trolard(上矢状静脈洞へ)、vein of Labbé(横静脈洞へ)。","深部の静脈:internal cerebral veins(内大脳静脈、第三脳室の天井を後ろへ)と basal veins of Rosenthal(脳底静脈)→ vein of Galen → 直静脈洞。"]},{"h":"頸神経叢","b":["C1〜C4 の前枝。胸鎖乳突筋の深くにある。","- 感覚の枝:lesser occipital・great auricular・transverse cervical・supraclavicular nerves。","- 運動の枝:ansa cervicalis(頸神経ワナ、舌骨下筋群)、phrenic nerve(横隔神経、C3〜C5)。「C3, 4, 5 keeps the diaphragm alive」。","横隔神経は前斜角筋の前を下り、鎖骨下動脈と静脈の間から胸へ入る。"]},{"h":"腕神経叢","b":["C5〜T1 の前枝。首の後頸三角、前斜角筋と中斜角筋の間から出る。","5段階:roots(根 5)→ trunks(幹 3)→ divisions(部 6)→ cords(束 3)→ branches(終枝 5)。ゴロは Randy Travis Drinks Cold Beer。","- 幹:C5+C6 = upper、C7 = middle、C8+T1 = lower。","- 部:各幹が anterior と posterior に分かれる(3×2 = 6)。","- 束(腋窩動脈との位置で名前):3つの posterior divisions → posterior cord。上と中の anterior → lateral cord。下の anterior → medial cord。","- 終枝:lateral cord → musculocutaneous、medial cord → ulnar、lateral と medial から median、posterior cord → axillary と radial。","根から:long thoracic nerve(C5〜C7、前鋸筋)、dorsal scapular nerve。上神経幹から:suprascapular nerve。","thoracic outlet(胸郭出口)の3か所(斜角筋三角・肋鎖間隙・小胸筋の裏)で圧迫されると胸郭出口症候群。Erb 麻痺(C5〜C6)は肩と肘、Klumpke 麻痺(C8〜T1)は手の筋。"]}],"terms":[{"q":"dura mater","a":"硬膜"},{"q":"arachnoid mater","a":"くも膜"},{"q":"pia mater","a":"軟膜"},{"q":"epidural space","a":"硬膜外腔"},{"q":"subarachnoid space","a":"くも膜下腔。CSF と血管"},{"q":"periosteal layer","a":"硬膜の骨膜層"},{"q":"meningeal layer","a":"硬膜の髄膜層"},{"q":"dural venous sinuses","a":"硬膜静脈洞。2層の硬膜の間"},{"q":"falx cerebri","a":"大脳鎌"},{"q":"tentorium cerebelli","a":"小脳テント"},{"q":"falx cerebelli","a":"小脳鎌"},{"q":"diaphragma sellae","a":"鞍隔膜"},{"q":"tentorial notch","a":"テント切痕。中脳が通る"},{"q":"cistern","a":"脳槽。くも膜下腔の広い所"},{"q":"cisterna magna","a":"大槽。最大の脳槽"},{"q":"interpeduncular cistern","a":"脚間槽"},{"q":"ambient cistern","a":"迂回槽。中脳の外側"},{"q":"quadrigeminal cistern","a":"四丘体槽。中脳の後ろ"},{"q":"superior sagittal sinus","a":"上矢状静脈洞"},{"q":"straight sinus","a":"直静脈洞"},{"q":"confluence of sinuses","a":"静脈洞交会(torcular Herophili)"},{"q":"transverse / sigmoid sinus","a":"横静脈洞 / S状静脈洞"},{"q":"internal jugular vein","a":"内頸静脈"},{"q":"great cerebral vein of Galen","a":"大大脳静脈"},{"q":"internal cerebral veins","a":"内大脳静脈"},{"q":"basal vein of Rosenthal","a":"脳底静脈"},{"q":"vein of Labbé","a":"ラベ静脈。横静脈洞へ"},{"q":"cervical plexus","a":"頸神経叢。C1〜C4"},{"q":"ansa cervicalis","a":"頸神経ワナ。舌骨下筋群"},{"q":"phrenic nerve","a":"横隔神経。C3〜C5"},{"q":"brachial plexus","a":"腕神経叢。C5〜T1"},{"q":"trunk / division / cord","a":"幹 / 部 / 束"},{"q":"long thoracic nerve","a":"長胸神経。前鋸筋"},{"q":"thoracic outlet","a":"胸郭出口"}],"facts":[{"q":"髄膜を内側から","a":"軟膜 → くも膜 → 硬膜"},{"q":"CSF が流れる腔","a":"くも膜下腔"},{"q":"硬膜の2層","a":"骨膜層と髄膜層"},{"q":"硬膜静脈洞がある場所","a":"硬膜の2層の間"},{"q":"左右の大脳半球の間の仕切り","a":"大脳鎌"},{"q":"大脳と小脳の間の仕切り","a":"小脳テント"},{"q":"下垂体の上の蓋","a":"鞍隔膜"},{"q":"三叉神経節を包む硬膜のくぼみ","a":"Meckel's cave"},{"q":"小脳テントの後外側のつく場所","a":"後頭骨(横静脈洞の溝)と錐体の稜"},{"q":"テント自由縁の前のつく場所","a":"前床突起"},{"q":"テント切痕を通る構造","a":"中脳"},{"q":"大脳鎌とテントのつなぎ目の静脈洞","a":"直静脈洞"},{"q":"最大の脳槽","a":"大槽(小脳延髄槽)"},{"q":"中脳の前の脳槽","a":"脚間槽"},{"q":"中脳の外側の脳槽","a":"大脳脚槽と迂回槽"},{"q":"中脳の後ろの脳槽","a":"四丘体槽"},{"q":"迂回槽の中の動脈","a":"PCA(P2)と SCA"},{"q":"迂回槽の中の脳神経","a":"CN IV"},{"q":"迂回槽の中の静脈","a":"脳底静脈(Rosenthal)"},{"q":"四丘体槽の中の静脈","a":"大大脳静脈(Galen)"},{"q":"脚間槽の中の脳神経","a":"CN III"},{"q":"硬膜静脈洞の弁","a":"ない"},{"q":"静脈血の最終的な出口","a":"内頸静脈"},{"q":"上矢状静脈洞が流れ込む場所","a":"静脈洞交会"},{"q":"直静脈洞に流れ込む2本","a":"下矢状静脈洞と大大脳静脈"},{"q":"静脈洞交会から内頸静脈まで","a":"横静脈洞 → S状静脈洞 → 内頸静脈"},{"q":"海綿静脈洞の流出路","a":"上・下錐体静脈洞"},{"q":"上矢状静脈洞へつながる表面の静脈","a":"Trolard 静脈"},{"q":"横静脈洞へつながる表面の静脈","a":"Labbé 静脈"},{"q":"内大脳静脈が走る場所","a":"第三脳室の天井"},{"q":"深部の静脈が集まる血管","a":"大大脳静脈(Galen)"},{"q":"頸神経叢の根","a":"C1〜C4"},{"q":"横隔神経の根","a":"C3〜C5"},{"q":"舌骨下筋群を支配する枝","a":"頸神経ワナ"},{"q":"腕神経叢の根","a":"C5〜T1"},{"q":"腕神経叢が出る2筋の間","a":"前斜角筋と中斜角筋"},{"q":"腕神経叢の5段階","a":"根 → 幹 → 部 → 束 → 終枝"},{"q":"上神経幹を作る根","a":"C5 と C6"},{"q":"中神経幹を作る根","a":"C7"},{"q":"下神経幹を作る根","a":"C8 と T1"},{"q":"部の数","a":"6(各幹に前と後ろ)"},{"q":"後神経束を作るもの","a":"3つの後部(posterior divisions)すべて"},{"q":"外側神経束を作るもの","a":"上と中の神経幹の前部"},{"q":"内側神経束を作るもの","a":"下神経幹の前部"},{"q":"束の名前の基準","a":"腋窩動脈との位置関係"},{"q":"外側神経束の終枝","a":"筋皮神経(と正中神経の外側根)"},{"q":"内側神経束の終枝","a":"尺骨神経(と正中神経の内側根)"},{"q":"後神経束の終枝","a":"腋窩神経と橈骨神経"},{"q":"2つの束からできる神経","a":"正中神経"},{"q":"前鋸筋を支配する神経","a":"長胸神経(C5〜C7)"},{"q":"上神経幹から出る枝","a":"肩甲上神経"},{"q":"胸郭出口の3か所","a":"斜角筋三角・肋鎖間隙・小胸筋の裏"},{"q":"Erb 麻痺の根","a":"C5〜C6"},{"q":"Klumpke 麻痺の根","a":"C8〜T1"}]},{"title":"19 上肢の末梢神経、腰仙骨神経叢","secs":[{"title":"上肢の神経","cards":[{"q":"Musculocutaneous nerveの運動と感覚は?","a":"運動:coracobrachialis、biceps、brachialis。感覚:lateral cutaneous nerve of forearm(前腕外側)","s":1},{"q":"Axillary nerveの機能と支配は?","a":"Deltoidとteres minor。感覚は肩外側(regimental badge area)。surgical neck of humerusを回る","s":1},{"q":"Radial nerveの経路は?","a":"Posterior cord (C5–C8) → humerusのspiral groove(triceps)→ 外側へ出てbrachioradialisとextensor carpi radialis → 肘でsuperficial(感覚)とdeep(運動)に分岐 → deepはarcade of Frohseを通りposterior interosseous n.","s":2},{"q":"Radial nerveの運動支配は?","a":"肘・手関節・指の伸筋すべて、supinator、abductor pollicis longus。麻痺でwrist drop(Saturday night palsy)","s":1,"n":"BEST:Brachioradialis, Extensors, Supinator, Triceps"},{"q":"Radialとulnarの感覚支配の違いは?","a":"Radial:手背の橈側と第1〜4指の背側。固有領域は第1背側骨間部。Ulnar:手の尺側(掌側と背側)、第5指と第4指の尺側半分","s":2},{"q":"Median nerveの支配筋は?","a":"前腕屈筋の大部分とpronators。anterior interosseous n.(FPL、pronator quadratus、FDP I・II)。手ではLOAF(lumbricals I・II、opponens pollicis、abductor pollicis brevis、flexor pollicis brevis)","s":0,"n":"手内筋はLOAF:Lumbricals I・II, Opponens pollicis, Abductor pollicis brevis, Flexor pollicis brevis"},{"q":"Median nerveの感覚は?","a":"掌の橈側と第1〜第4指橈側半分の掌側","s":0},{"q":"Median nerveの絞扼部位は?","a":"Pronator teresの2頭間、carpal tunnel","s":0},{"q":"Ulnar nerveの経路と絞扼部位は?","a":"Cubital tunnel(medial epicondyleとolecranonの間)→ flexor carpi ulnarisの2頭間 → Guyon's canal(pisiformとhook of hamateの間)","s":0},{"q":"Ulnar nerveの支配筋は?","a":"Flexor carpi ulnaris、FDP(尺側2指)、hypothenar、全interossei、lumbricals III・IV、adductor pollicis","s":0},{"q":"Claw handとFroment's signは?","a":"Claw:interossei麻痺でMP過伸展とIP屈曲。Froment:adductor pollicisの弱さを母指IP屈曲で代償","s":0}]},{"title":"Lumbar・sacral plexus","cards":[{"q":"Lumbar plexusの根と位置は?","a":"(T12) L1–L4。psoas majorの中","s":1},{"q":"Lumbar plexusの枝は?","a":"上部(感覚):iliohypogastric、ilioinguinal、genitofemoral。下部:lateral femoral cutaneous(感覚)、femoralとobturator(混合)","s":1},{"q":"Femoral nerveの経路と支配は?","a":"Psoasとiliacusの間 → inguinal ligamentの後ろ → femoral triangle。quadriceps、sartorius、大腿前内側と下腿内側の皮膚","s":0},{"q":"Obturator nerveは?","a":"Obturator canalを通りadductorsと大腿内側の一部","s":0},{"q":"Sacral plexusの根と5神経は?","a":"L4–S4。運動:superior / inferior gluteal。感覚:posterior femoral cutaneous。混合:pudendalとsciatic","s":1},{"q":"Pudendal nerveの支配は?","a":"Perineal muscles、external anal sphincter、外陰部と肛門の皮膚","s":0},{"q":"Sciatic nerveの分岐と障害は?","a":"Common peroneal(障害でdorsiflexionとeversionの消失)とtibial(障害でplantar flexionと趾屈曲の消失)","s":0}]}],"rev":[17,15,11,4],"lesson":[{"h":"上肢の5本の終枝","b":["腕神経叢の終枝は5本。どの束から来て、何を動かし、どこの皮膚を担当し、切れたら手がどうなるか、の4点で覚える。","- musculocutaneous nerve(筋皮神経、外側束、C5〜C7)","- axillary nerve(腋窩神経、後束、C5〜C6)","- radial nerve(橈骨神経、後束、C5〜C8)","- median nerve(正中神経、外側束と内側束、C6〜T1)","- ulnar nerve(尺骨神経、内側束、C8〜T1)"]},{"h":"筋皮神経と腋窩神経","b":["筋皮神経:上腕の前の屈筋(烏口腕筋・上腕二頭筋・上腕筋)を動かす。皮膚は前腕の外側(lateral cutaneous nerve of forearm)。","腋窩神経:上腕骨の外科頸を後ろから回る。三角筋と小円筋。皮膚は肩の外側。上腕骨頸部の骨折や肩の脱臼で傷む。"]},{"h":"橈骨神経:伸ばす神経","b":["後束から出て、上腕骨の後ろの radial groove(橈骨神経溝)をらせん状に回る → 上腕三頭筋 → 外側へ出て腕橈骨筋・長短橈側手根伸筋 → 肘で2本に分かれる。","- superficial branch(浅枝、感覚):手の甲の親指側と第1〜4指の背側。固有の領域は第1指間の背側。","- deep branch(深枝、運動):Frohse のアーケードをくぐり posterior interosseous nerve(後骨間神経)となって残りの伸筋・回外筋へ。","動かすのは「伸ばす筋」全部(BEST:Brachioradialis・Extensors・Supinator・Triceps)。","上腕で切れると手首が垂れる(wrist drop、Saturday night palsy)。"]},{"h":"正中神経:つまむ神経","b":["肘から下で枝を出す(上腕では枝を出さない)。前腕の屈筋の多くと円回内筋。","anterior interosseous nerve(前骨間神経)が長母指屈筋・方形回内筋・深指屈筋(示指・中指)。","手では carpal tunnel(手根管)を通り、LOAF:第1・2虫様筋、母指対立筋、短母指外転筋、短母指屈筋。","皮膚:手のひらの親指側と、親指〜薬指の親指側半分の掌側。","手根管で圧迫されると親指の付け根(母指球)がやせ、しびれる(手根管症候群)。"]},{"h":"尺骨神経:手の中の細かい筋","b":["内側上顆の後ろの cubital tunnel(肘部管)を通り(肘をぶつけてしびれる所)、尺側手根屈筋の2頭の間 → 前腕 → 手首の Guyon's canal(豆状骨と有鈎骨鈎の間)。","動かす筋:尺側手根屈筋、深指屈筋(薬指・小指)、小指球の筋、すべての骨間筋、第3・4虫様筋、母指内転筋。","皮膚:小指と薬指の小指側半分(手のひら側も甲側も)、手の小指側。","切れると claw hand(鷲手:骨間筋が働かず、指の付け根が反り先が曲がる)。母指内転筋が弱く、紙をつまむと親指の先を曲げて代わりにする(Froment 徴候)。"]},{"h":"3本の神経の手の皮膚の地図","b":["手のひら側:親指〜薬指の半分は正中、残りは尺骨。","手の甲側:親指側半分は橈骨(固有は第1指間)、小指側は尺骨。","試験では「橈骨と尺骨の感覚支配の違い」がよく聞かれる。"]},{"h":"腰神経叢","b":["(T12)L1〜L4。大腰筋の中にできる。","- 上の部分(T12〜L2、感覚):iliohypogastric・ilioinguinal・genitofemoral nerves。","- 下の部分(L2〜L4):lateral femoral cutaneous nerve(感覚、大腿外側)、femoral nerve(大腿神経:大腰筋と腸骨筋の間 → 鼠径靱帯の後ろ → 大腿三角。大腿四頭筋・縫工筋、大腿前面と下腿内側の皮膚)、obturator nerve(閉鎖神経:閉鎖管を通り内転筋群)。"]},{"h":"仙骨神経叢","b":["L4〜S4。骨盤の中にできる。5本:","- 運動だけ:superior gluteal・inferior gluteal nerves(殿筋)。","- 感覚だけ:posterior femoral cutaneous nerve(大腿後面)。","- 混合:pudendal nerve(陰部神経:会陰の筋と外肛門括約筋、外陰部の皮膚。Onuf 核から)と sciatic nerve(坐骨神経:最大の神経)。","坐骨神経は膝の裏で common peroneal nerve(総腓骨神経)と tibial nerve(脛骨神経)に分かれる。","- 総腓骨神経が切れる:足首を上げられない(背屈できない)、足が垂れる(drop foot)、外反できない。","- 脛骨神経が切れる:つま先立ちできない(底屈できない)、足指を曲げられない。"]}],"terms":[{"q":"musculocutaneous nerve","a":"筋皮神経。外側束"},{"q":"axillary nerve","a":"腋窩神経。後束"},{"q":"radial nerve","a":"橈骨神経。後束"},{"q":"median nerve","a":"正中神経。外側束と内側束"},{"q":"ulnar nerve","a":"尺骨神経。内側束"},{"q":"surgical neck of humerus","a":"上腕骨外科頸。腋窩神経が回る"},{"q":"radial groove","a":"橈骨神経溝。上腕骨の後ろのらせんの溝"},{"q":"posterior interosseous nerve","a":"後骨間神経。橈骨神経の深枝"},{"q":"arcade of Frohse","a":"Frohse のアーケード。回外筋の入口"},{"q":"wrist drop","a":"下垂手。橈骨神経麻痺"},{"q":"anterior interosseous nerve","a":"前骨間神経。正中神経の運動枝"},{"q":"carpal tunnel","a":"手根管"},{"q":"thenar eminence","a":"母指球"},{"q":"cubital tunnel","a":"肘部管。内側上顆の後ろ"},{"q":"Guyon's canal","a":"ギヨン管。豆状骨と有鈎骨鈎の間"},{"q":"hypothenar eminence","a":"小指球"},{"q":"claw hand","a":"鷲手。尺骨神経麻痺"},{"q":"Froment's sign","a": const $=id=>document.getElementById(id);
let starOnly=false, shuffle=false;

function own(ci,si){const out=[];DECKS[ci].secs.forEach((s,i)=>{ if(si==null||si===i) s.cards.forEach(c=>out.push({...c,sec:s.title})); });return out;}
function stepCards(ci,kind){const d=DECKS[ci];
  if(kind==='term') return (d.terms||[]).map(c=>({q:c.q,a:c.a,s:0,sec:'② 用語'}));
  if(kind==='fact') return (d.facts||[]).map(c=>({q:c.q,a:c.a,s:0,sec:'③ 部品'}));
  return own(ci,null);}
function revCards(r){return (DECKS[r].facts&&DECKS[r].facts.length)?stepCards(r,'fact'):own(r,null);}
function cardsOf(ci,si){
  const d=DECKS[ci]; let out=[];
  if(si==='term'||si==='fact'||si==='sum'){out=stepCards(ci,si);return starOnly&&si==='sum'?out.filter(c=>c.s>0):out;}
  if(si==='rev'){d.rev.forEach(r=>{out=out.concat(revCards(r).map(c=>({...c,sec:'Day '+(r+1)+' ・ '+c.sec})));});return starOnly?out.filter(c=>c.s>0||!c.s&&false):out;}
  if(si==='rev_old') d.rev.forEach(r=>{out=out.concat(own(r,null).map(c=>({...c,sec:'Day '+(r+1)+' ・ '+c.sec})));});
  else{
    if(d.from&&si==null){ d.from.forEach(r=>{out=out.concat(own(r,null).map(c=>({...c,sec:'Day '+(r+1)+' ・ '+c.sec})));}); if(d.star) out=out.filter(c=>c.s>0); }
    out=out.concat(own(ci,si));
  }
  return starOnly?out.filter(c=>c.s>0):out;
}
function split(t){const m=t.match(/^(\d+)\s+([^(\uFF08]+)[(\uFF08]?([^)\uFF09]*)/);return m?{n:m[1],en:m[2].trim(),ja:m[3]||''}:{n:'',en:t,ja:''};}
function renderHome(){

      l.append(sn,tx);const c=document.createElement('span');c.className='count';c.textContent=cnt;b.append(l,c);b.disabled=!cnt||cnt==='0 枚';b.addEventListener('click',fn);units.appendChild(b);};

function start(ci,si){
  full=cardsOf(ci,si); if(!full.length) return;
  const t=split(DECKS[ci].title);
  $('uTitle').textContent='Day '+t.n+' '+t.en;
  $('uSub').textContent=({term:'② 用語',fact:'③ 部品',sum:'④ まとめ',rev:'復習'}[si]||(si==null?(DECKS[ci].from?'通し':'まとめ'):DECKS[ci].secs[si].title))+(starOnly?' ・★のみ':'');
  round=1; refill(); $('toast').hidden=true;
  $('home').hidden=true; $('study').hidden=false; show(); window.scrollTo(0,0);
}
function refill(){queue=full.slice(); if(shuffle) mix(queue);}
function show(){
  flipped=false; const c=queue[0];
  $('cSec').textContent=c.sec||''; $('cStar').textContent='★'.repeat(c.s);
  $('q').textContent=c.q;
  renderAnswer($('a'),c.a);
  $('noteText').textContent=c.n||'';
  paint();
  const done=full.length-queue.length;
  $('left').textContent='残り '+queue.length+' / '+full.length+' 枚';
  $('round').textContent=round+' 周目';
  $('fill').style.width=(done/full.length*100)+'%';
}
function splitTop(t,sep){const out=[];let d=0,cur='';for(const ch of t){if(ch==='('||ch==='(')d++;else if(ch===')'||ch===')')d=Math.max(0,d-1);if(d===0&&ch===sep){if(cur.trim())out.push(cur.trim());cur='';}else cur+=ch;}if(cur.trim())out.push(cur.trim());return out;}
function splitArrows(t){const out=[];let d=0,cur='';for(const ch of t){if(ch==='('||ch==='(')d++;else if(ch===')'||ch===')')d=Math.max(0,d-1);if(ch==='→'&&(d===0||/^[((][^))]*$/.test(cur.trim())===false&&d===0)){out.push(cur.trim());cur='';}else cur+=ch;}out.push(cur.trim());return out.filter(x=>x);}
function inline(el,t){const re=/([((][^(())]*[))])/g;let last=0,m;while((m=re.exec(t))){if(m.index>last)el.append(t.slice(last,m.index));const s=document.createElement('span');s.className='paren';s.textContent=m[1];el.append(s);last=m.index+m[1].length;}if(last<t.length)el.append(t.slice(last));}
function body(parent,t){
  const parts=splitArrows(t);
  if(parts.length<3){
    let items=splitTop(t,'、'); if(items.length<3){const alt=t.split(/,\s+(?![^((]*[))])/); if(alt.length>=4) items=alt;}
    if(items.length>=3&&items.every(x=>x.length<=60)){const ul=document.createElement('ul');ul.className='items';items.forEach(x=>{const li=document.createElement('li');inline(li,x);ul.append(li);});parent.append(ul);return;}
    const p=document.createElement('div');inline(p,t);parent.append(p);return;}
  const ol=document.createElement('ol');ol.className='steps';let via='';
  parts.forEach(p=>{
    if(/^[((][^(())]*[))]$/.test(p)){via=p.slice(1,-1);return;}
    const li=document.createElement('li');
    if(via){const v=document.createElement('span');v.className='via';v.textContent=via;li.append(v);via='';}
    inline(li,p);ol.append(li);
  });
  parent.append(ol);
}
function topLabel(seg){let d=0;for(let i=0;i<seg.length&&i<=26;i++){const ch=seg[i];if(ch==='('||ch==='(')d++;else if(ch===')'||ch===')')d=Math.max(0,d-1);else if(ch==='→'||ch==='。')return null;else if(ch===':'&&d===0)return i>0&&i<seg.length-1?[seg,seg.slice(0,i),seg.slice(i+1)]:null;}return null;}
function renderAnswer(box,t){
  box.textContent='';
  splitTop(t,'。').forEach(seg=>{
    const d=document.createElement('div');d.className='seg';
    const m=topLabel(seg);
    if(m){const l=document.createElement('span');l.className='lab';l.textContent=m[1].trim();d.append(l);body(d,m[2].trim());}
    else{d.classList.add('plain');body(d,seg);}
    box.append(d);
  });
}
function paint(){
  const c=queue[0];
  $('card').classList.toggle('flipped',flipped); $('rule').hidden=$('a').hidden=!flipped; $('note').hidden=!flipped||!c.n; $('hint').hidden=flipped;
  $('btnShow').hidden=flipped; $('btnAgain').hidden=$('btnOk').hidden=!flipped;
}
function flip(){ if(!flipped){flipped=true; paint(); $('toast').hidden=true;} }
function verdict(known){
  if(!flipped) return;
  const c=queue.shift();
  if(!known) queue.push(c);
  if(!queue.length){ round++; refill(); $('toast').hidden=false; }
  show();
}
let rd={ci:0,p:0};
function openReader(ci){rd={ci,p:0};const t=split(DECKS[ci].title);$('rTitle').textContent='Day '+t.n+' '+t.en;$('rSub').textContent='① 読む';
  $('home').hidden=true;$('read').hidden=false;renderPage();}
function renderPage(){const L=DECKS[rd.ci].lesson,pg=L[rd.p],box=$('reader');box.textContent='';
  const h2=document.createElement('h2');h2.textContent=pg.h;box.append(h2);let list=null,kind='';
  pg.b.forEach(line=>{let m;
    if((m=line.match(/^-\s+(.*)$/))){if(kind!=='ul'){list=document.createElement('ul');box.append(list);kind='ul';}const li=document.createElement('li');li.textContent=m[1];list.append(li);}
    else if((m=line.match(/^\d+\.\s+(.*)$/))){if(kind!=='ol'){list=document.createElement('ol');box.append(list);kind='ol';}const li=document.createElement('li');li.textContent=m[1];list.append(li);}
    else{kind='';const p=document.createElement('p');p.textContent=line;box.append(p);}});
  $('rPage').textContent=(rd.p+1)+' / '+L.length+' ページ';$('rFill').style.width=((rd.p+1)/L.length*100)+'%';
  $('rPrev').disabled=rd.p===0;$('rNext').textContent=rd.p===L.length-1?'② 用語へ進む →':'次へ →';window.scrollTo(0,0);}
$('rPrev').addEventListener('click',()=>{if(rd.p>0){rd.p--;renderPage();}});
$('rNext').addEventListener('click',()=>{const L=DECKS[rd.ci].lesson;if(rd.p<L.length-1){rd.p++;renderPage();}else{$('read').hidden=true;start(rd.ci,'term');}});
$('rBack').addEventListener('click',()=>{$('read').hidden=true;$('home').hidden=false;});
$('card').addEventListener('click',flip);
$('btnShow').addEventListener('click',flip);
$('btnAgain').addEventListener('click',()=>verdict(false));
$('btnOk').addEventListener('click',()=>verdict(true));
$('back').addEventListener('click',()=>{$('study').hidden=true;$('home').hidden=false;});
$('optStar').addEventListener('click',e=>{starOnly=!starOnly;e.currentTarget.setAttribute('aria-pressed',starOnly);renderHome();});
$('optShuffle').addEventListener('click',e=>{shuffle=!shuffle;e.currentTarget.setAttribute('aria-pressed',shuffle);});
document.addEventListener('keydown',e=>{
  if($('study').hidden) return;
  if(e.key===' '||e.key==='Enter'){ if(document.activeElement.tagName==='BUTTON') return; e.preventDefault(); flip(); }
  else if(e.key==='ArrowRight') verdict(true);
  else if(e.key==='ArrowLeft') verdict(false);
});
renderHome();
document.querySelector('details').open=true;
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('../sw.js',{scope:'../'}).catch(()=>{});</script>
