<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>脳解剖学 単語帳 Day別</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#5b3fa0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="../icons/apple-day-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* layout: one column, phone first; home = chapter list, study = one card + two verdict buttons pinned low */
:root{
  --paper:#f3f2f7; --surface:#ffffff; --ink:#1d1a2b; --muted:#6a6680; --line:#dcd9e6;
  --violet:#5b3fa0; --violet-soft:#ebe5f7;
  --ok:#1f7a55; --ok-soft:#e1f2ea; --again:#a8611a; --again-soft:#f8ecdc;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#15131d; --surface:#201d2c; --ink:#ece9f5; --muted:#a29db8; --line:#353148;
    --violet:#b79bf0; --violet-soft:#2d2644;
    --ok:#6fcca2; --ok-soft:#1c3329; --again:#e2a763; --again-soft:#3a2c1b;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#15131d; --surface:#201d2c; --ink:#ece9f5; --muted:#a29db8; --line:#353148;
  --violet:#b79bf0; --violet-soft:#2d2644;
  --ok:#6fcca2; --ok-soft:#1c3329; --again:#e2a763; --again-soft:#3a2c1b;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.65;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,summary:focus-visible,.card:focus-visible{outline:3px solid var(--violet);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:20px 16px 32px;min-height:100%;display:flex;flex-direction:column;gap:16px}
[hidden]{display:none!important}
h1{font-family:var(--display);font-size:1.6rem;line-height:1.3;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;font-size:.92rem}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:.9rem;display:flex;align-items:center;gap:8px}
.toggle[aria-pressed="true"]{background:var(--violet-soft);border-color:var(--violet);color:var(--violet);font-weight:700}
.toggle .dot{width:10px;height:10px;border-radius:50%;border:2px solid currentColor}
.toggle[aria-pressed="true"] .dot{background:currentColor}
.chapters{display:flex;flex-direction:column;gap:10px}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{list-style:none;padding:14px 16px;display:flex;align-items:baseline;gap:12px;cursor:pointer;border-radius:12px}
summary::-webkit-details-marker{display:none}
.num::before{content:'DAY';display:block;font-family:var(--body);font-size:.6rem;letter-spacing:.1em;color:var(--muted);line-height:1}
.num{font-family:var(--display);font-size:1.25rem;color:var(--violet);min-width:1.6em;font-variant-numeric:tabular-nums}
.ctitle{flex:1;font-weight:700;line-height:1.4}
.ctitle small{display:block;font-weight:400;color:var(--muted);font-size:.82rem}
.count{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.units{display:flex;flex-direction:column;gap:6px;padding:0 12px 12px}
.unit{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:10px 12px;width:100%}
.step{display:flex;align-items:center;gap:10px}
.step .sn{width:22px;height:22px;border-radius:50%;background:var(--violet-soft);color:var(--violet);font-size:.75rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.unit .sub{display:block;font-size:.75rem;color:var(--muted);font-weight:400}
.minor{font-size:.78rem;color:var(--muted);padding:6px 4px 0}
.unit.small{padding:7px 12px;font-size:.88rem}
.reader{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:12px;overflow-wrap:anywhere}
.reader h2{font-family:var(--display);font-size:1.25rem;line-height:1.45;margin:0;text-wrap:balance}
.reader p{margin:0;font-size:1rem;line-height:1.85}
.reader ul,.reader ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px;line-height:1.75}
.rnav{display:grid;grid-template-columns:1fr 2fr;gap:10px;position:sticky;bottom:0;background:var(--paper);padding:10px 0 12px;margin-bottom:-12px}
.rnav button{border-radius:12px;padding:14px 8px;font-weight:700;border:2px solid var(--violet);background:var(--surface);color:var(--violet)}
.rnav button.go{background:var(--violet);color:var(--surface)}
.rnav button:disabled{opacity:.35}
.unit.all{background:var(--violet);border-color:var(--violet);color:var(--surface);font-weight:700}
.unit.all .count{color:inherit;opacity:.85}
.unit:disabled{opacity:.4;cursor:default}
/* study */
.bar{display:flex;align-items:center;gap:12px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.9rem;white-space:nowrap}
.where{flex:1;min-width:0;font-size:.85rem;color:var(--muted);line-height:1.35}
.where b{display:block;color:var(--ink);font-size:.95rem;overflow-wrap:anywhere}
.stats{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--violet);width:0;transition:width .25s}
.card{flex:1;min-height:260px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;overflow-wrap:anywhere}
.tag{font-size:.75rem;letter-spacing:.08em;color:var(--muted);display:flex;gap:10px;align-items:center}
.star{color:var(--again);letter-spacing:0;font-size:.85rem}
.q{font-family:var(--display);font-size:1.3rem;line-height:1.5;margin:0;text-wrap:balance}
.card.flipped{gap:12px;padding:16px 16px 18px}
.card.flipped .q{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted);line-height:1.5;padding-bottom:10px;border-bottom:1px solid var(--line)}
.card.flipped .q::before{content:"Q ";color:var(--violet);font-weight:700}
.rule{display:none}
.a{margin:0;display:flex;flex-direction:column;gap:10px;font-size:1.05rem;line-height:1.6}
.seg{display:flex;flex-direction:column;gap:4px}
.seg.plain{font-weight:500}
.lab{align-self:flex-start;font-size:.78rem;font-weight:700;color:var(--violet);background:var(--violet-soft);border-radius:6px;padding:1px 8px;line-height:1.6}
.steps{list-style:none;margin:2px 0 0;padding:0;display:flex;flex-direction:column;counter-reset:st}
.steps li{position:relative;padding:0 0 8px 30px;counter-increment:st}
.steps li::before{content:counter(st);position:absolute;left:0;top:.15em;width:20px;height:20px;border-radius:50%;background:var(--violet-soft);color:var(--violet);font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.steps li::after{content:"";position:absolute;left:9.5px;top:calc(.15em + 22px);bottom:0;width:1px;background:var(--line)}
.steps li:last-child{padding-bottom:0}
.steps li:last-child::after{display:none}
.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.items li{position:relative;padding-left:16px}
.items li::before{content:"";position:absolute;left:3px;top:.72em;width:5px;height:5px;border-radius:50%;background:var(--violet)}
.via{display:inline-block;font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 6px;margin-right:6px}
.paren{color:var(--muted);font-size:.9em}
.note{background:var(--violet-soft);border-left:3px solid var(--violet);border-radius:0 8px 8px 0;padding:10px 12px;font-size:.92rem}
.note b{display:block;font-size:.75rem;color:var(--violet);letter-spacing:.08em}
.hint{margin-top:auto;color:var(--muted);font-size:.85rem;text-align:center}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;position:sticky;bottom:0;background:var(--paper);padding:10px 0 12px;margin-bottom:-12px}
.acts button{border-radius:12px;padding:14px 8px;font-weight:700;border:2px solid;line-height:1.3}
.acts small{display:block;font-weight:400;font-size:.75rem}
.again{background:var(--again-soft);border-color:var(--again);color:var(--again)}
.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.show{grid-column:1/-1;background:var(--violet);border-color:var(--violet)!important;color:var(--surface)}
.toast{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok);border-radius:10px;padding:10px 14px;font-size:.92rem;font-weight:700}
@media (prefers-reduced-motion: reduce){.fill{transition:none}}
</style>
</head>
<body>
<main class="wrap" id="home">
  <h1>脳解剖学 単語帳 Day別</h1>
  <p class="lede">Signorelli 口頭試験の一問一答 <span id="total"></span> 枚。21日の学習ルートの順です。各Dayは「① 読む → ② 用語 → ③ 部品 → ④ まとめ」の順に進めると、知らない答えに出会わずに積み上げられます。分かったカードは外れ、分からなかったカードは後ろへ回ります。</p>
  <div class="opts">
    <button class="toggle" id="optStar" aria-pressed="false"><span class="dot"></span>過去問に出た ★ だけ</button>
    <button class="toggle" id="optShuffle" aria-pressed="false"><span class="dot"></span>順番を混ぜる</button>
  </div>
  <div class="chapters" id="chapters"></div>
</main>
<main class="wrap" id="read" hidden>
  <div class="bar">
    <button class="back" id="rBack">← 単元一覧</button>
    <div class="where"><b id="rTitle"></b><span id="rSub"></span></div>
  </div>
  <div>
    <div class="stats"><span id="rPage"></span><span>① 読む</span></div>
    <div class="track"><div class="fill" id="rFill"></div></div>
  </div>
  <article class="reader" id="reader"></article>
  <div class="rnav"><button id="rPrev">← 前へ</button><button class="go" id="rNext">次へ →</button></div>
</main>
<main class="wrap" id="study" hidden>
  <div class="bar">
    <button class="back" id="back">← 単元一覧</button>
    <div class="where"><b id="uTitle"></b><span id="uSub"></span></div>
  </div>
  <div>
    <div class="stats"><span id="left"></span><span id="round"></span></div>
    <div class="track"><div class="fill" id="fill"></div></div>
  </div>
  <div class="toast" id="toast" hidden>全部分かりました。最初からもう一度始めます。</div>
  <div class="card" id="card" tabindex="0" role="button" aria-label="カードをめくる">
    <div class="tag"><span id="cSec"></span><span class="star" id="cStar"></span></div>
    <p class="q" id="q"></p>
    <hr class="rule" id="rule">
    <div class="a" id="a"></div>
    <div class="note" id="note"><b>備考(ゴロ合わせ)</b><span id="noteText"></span></div>
    <div class="hint" id="hint">タップして答えを見る</div>
  </div>
  <div class="acts">
    <button class="show" id="btnShow">答えを見る</button>
    <button class="again" id="btnAgain">分からなかった<small>デッキの一番後ろへ</small></button>
    <button class="ok" id="btnOk">分かった<small>このカードを外す</small></button>
  </div>
</main>
<script>
const DECKS=[{"title":"1 脳幹の構成と3つの断面","secs":[{"title":"全体構造と核の配列","cards":[{"q":"脳幹の4要素(横断面の区分)は?","a":"Base(腹側、下行路:cerebral peduncles・ventral pons・pyramids)、tegmentum(脳神経核・上行路・reticular formation)、roof(tectum、medullary vela、第四脳室の屋根)、ventricular cavity","s":2},{"q":"脳神経核の配列の原則は?","a":"縦の柱(columns)を作り、medialがmotor、lateralがsensory。境はsulcus limitans。第四脳室が開いて脊髄の背腹配列が内外配列になった","s":2,"n":"Rule of 4:正中寄りのmotor核は12の約数(III, IV, VI, XII)。medullaにIX–XII、ponsにV–VIII、その上にI–IV"},{"q":"Somatic motor nucleiは?","a":"Oculomotor(midbrain、superior colliculusレベル)、trochlear(inferior colliculusレベル)、abducens(pons、facial colliculus)、hypoglossal(medulla、hypoglossal trigone)","s":0,"n":"12の約数で覚える:3, 4, 6, 12(Rule of 4)"},{"q":"Special visceral efferent (branchiomotor) nucleiは?","a":"Trigeminal motor n.(pons)、facial motor n.(pons)、nucleus ambiguus(medulla)、spinal accessory n.","s":0},{"q":"General visceral efferent(副交感)nucleiは?","a":"Edinger-Westphal、superior salivatory、inferior salivatory、dorsal motor nucleus of vagus","s":0,"n":"副交感を運ぶ脳神経は 1973:X, IX, VII, III"},{"q":"Sensory nuclei(lateral column)は?","a":"Trigeminal sensory nuclei(mesencephalic・main・spinal)、vestibularとcochlear nuclei、solitary nucleus","s":0},{"q":"Medullaの脳神経核を内→外に","a":"Hypoglossal n. → dorsal motor n. of vagus(+ inferior salivatory)→ solitary n. → vestibular nn. → spinal trigeminal n.。nucleus ambiguusは腹外側のreticular formation内","s":1},{"q":"脳幹を通るlong tractsは?","a":"上行:spinothalamic tract(lateral tegmentum)とmedial lemniscus。下行:corticospinalとcorticobulbar tract(base)","s":0}]},{"title":"断面(midbrain・pons・medulla)","cards":[{"q":"Midbrainの断面を前→後に","a":"Interpeduncular fossaとcrus cerebri → substantia nigra → tegmentum(red nucleus、medial lemniscus、spinothalamic tract、reticular formation、MLF、CN III / IV核)→ periaqueductal grayとcerebral aqueduct → tectum(superior / inferior colliculi)","s":2},{"q":"Crus cerebriの線維配列は?","a":"内側1/5:frontopontine。中央3/5:corticospinalとcorticobulbar。外側1/5:parieto-temporo-occipitopontine","s":0},{"q":"Sylvian aqueductとは? 周囲の構造は?","a":"Cerebral aqueduct。第三脳室と第四脳室をつなぐ。周囲はperiaqueductal gray matter","s":1},{"q":"Red nucleusの機能と連絡は?","a":"運動の協調。入力:cerebellum(superior cerebellar peduncle経由)とcortex。出力:rubrospinal tract(上肢屈筋)とinferior olive(central tegmental tract)","s":1},{"q":"Superior / inferior colliculusの機能は?","a":"Superior:視覚反射。Inferior:聴覚路の中継","s":0},{"q":"Midbrain下部(inferior colliculusレベル)の特徴は?","a":"Trochlear nucleus、decussation of superior cerebellar peduncles、lateral lemniscus","s":0},{"q":"Ponsの構造は?","a":"Basilar part:pontine nuclei、横走するpontocerebellar fibers(→ middle cerebellar peduncle)、corticospinal・corticobulbar線維。Tegmentum:CN V–VIIIの核、medial lemniscus、trapezoid body、MLF、reticular formation","s":1},{"q":"Medullaの腹側面の構造は?","a":"Anterior median fissure、pyramid、preolivary sulcus(XIIが出る)、olive、retro-olivary sulcus(IX・X・XIが出る)","s":0},{"q":"Pyramidal decussationの位置と割合は?","a":"Medulla下端。約85〜90%が交叉しlateral corticospinal tractになる","s":0},{"q":"Bulbopontine sulcusから出る神経は(内→外)?","a":"VI、VII(+ nervus intermedius)、VIII","s":0}]}],"rev":[],"lesson":[{"h":"脳幹はどこにあるか","b":["脳を下から見ると、左右の大脳半球の間から、太い茎が下へ伸びている。これが brainstem(脳幹)。上は大脳(正確には間脳)に、下は脊髄につながる。","脳幹は上から3つに分かれる。","1. midbrain(中脳):いちばん短い。前から見ると、左右に太い柱が2本ハの字に開いている。これが cerebral peduncle(大脳脚)。","2. pons(橋):前に丸くふくらんでいる。左右の小脳を橋渡しするように見えるので「橋」。","3. medulla oblongata(延髄):下へ細くなり、脊髄に続く。前面に縦長のふくらみ pyramid(錐体)と、その外側に楕円形の olive(オリーブ)がある。","脳幹の後ろには cerebellum(小脳)が乗っている。脳幹と小脳の間にあるすき間が fourth ventricle(第四脳室)。"]},{"h":"脳幹の中身は2種類","b":["脳幹の中には、性質の違う2種類のものが詰まっている。","1つ目は、通り抜ける線維。大脳と脊髄は直接つながっていないので、行き来する信号はすべて脳幹の中を通る。手足を動かす命令は大脳から下り、手足の感覚は脊髄から上ってくる。これらの長い線維の束を long tracts(長経路)という。","2つ目は、脳幹自身の神経核。nucleus(神経核)とは、神経細胞の細胞体が集まったかたまりのこと。脳幹には脳神経 III〜XII の核があり、顔・目・口・のど・内臓を担当している。","例えるなら、脳幹は「大脳と脊髄を結ぶ幹線道路」であり、同時に「頭と顔を担当する役所が並ぶ町」でもある。"]},{"h":"輪切りにすると、前から4つの層","b":["脳幹をどの高さで横に切っても、前(腹側、顔の側)から後ろ(背側、後頭部の側)へ、同じ順で4つの層が並ぶ。","1. base(底部):いちばん前。大脳から下りてくる運動の線維の束が通る。","2. tegmentum(被蓋):base の後ろで、いちばん厚い層。脳神経の核、上ってくる感覚の線維、reticular formation(網様体:覚醒や呼吸に関わる神経細胞の網)が入る。","3. ventricular cavity(脳室腔):被蓋の後ろにある、液体(脳脊髄液)が入った空間。","4. roof(蓋):いちばん後ろで、脳室腔に天井のようにかぶさる。","覚え方:前は運動の通り道、真ん中は核と感覚、その後ろに脳室、いちばん後ろが天井。"]},{"h":"高さによって層の名前が変わる","b":["4つの層の並び順はどの高さでも同じだが、中脳・橋・延髄で見た目が違うので、それぞれ別の名前がついている。","base は、中脳では crus cerebri(大脳脚)、橋では basilar pons(橋底部:前の丸いふくらみ)、延髄では pyramid(錐体)と呼ぶ。名前は違っても、中を通っているのは同じ運動の線維。","脳室腔は、中脳では cerebral aqueduct(中脳水道)という鉛筆の芯ほどの細い管。これが橋と延髄の高さで横に大きく広がったものが第四脳室。","roof は、中脳では tectum(蓋板)と呼ばれ、4つの小さな丘が並ぶ。上の2つが superior colliculus(上丘)、下の2つが inferior colliculus(下丘)。橋と延髄の roof には神経細胞がほとんどなく、第四脳室を覆う薄い膜(上髄帆と下髄帆)になっている。"]},{"h":"前提:神経は「管」から作られる","b":["核の並び方を理解するには、胎児のときの形を知る必要がある。","脳と脊髄は、胎児のときは1本の細い管だった。これを neural tube(神経管)という。管の壁が厚くなって神経組織になり、管の中の空間は、のちに脳室と脊髄の中心管になる。","管の壁を輪切りで見ると、左の壁と右の壁がある。それぞれの壁は、前半分と後ろ半分に分かれて育つ。","前半分は basal plate(基板)と呼ばれ、ここから運動の神経細胞ができる。","後ろ半分は alar plate(翼板)と呼ばれ、ここから感覚の神経細胞ができる。","基板と翼板の境目では、管の内側の壁に浅い溝が縦に走る。これが sulcus limitans(境界溝)。","脊髄はこの形のまま大人になる。だから脊髄の灰白質では、前の部分(前角)が運動、後ろの部分(後角)が感覚、という前後の並びになる(脊髄は Day 5 で詳しく扱う)。"]},{"h":"脳幹では管が後ろで開く","b":["脳幹の高さでは、管の後ろの壁(天井の部分)だけが薄く引き伸ばされる。すると、管は後ろで裂けたように左右へ開いていく。","本で例えると、背表紙を前にして立てた本を、ページの側(後ろ)から左右に開いていくような動き。背表紙にあたる前の正中部は動かず、左右の壁が外側へ倒れていく。","左右の壁がそれぞれ外側へ倒れると、壁の中の並びがどう変わるかを考える。倒れる前は、壁の前半分に基板(運動)、後ろ半分に翼板(感覚)があった。壁が外側へ倒れると、前半分だった基板は正中に近い側に、後ろ半分だった翼板は外側に来る。","こうして開いた管の内面が、第四脳室の床になる。床の上では、正中に近いほど運動、外側へ行くほど感覚、という並びになる。境界溝も床の上に縦の溝として残り、運動と感覚の境目を示している。","脳幹の核の配置の大原則:内側が運動、外側が感覚。脊髄の「前が運動、後ろが感覚」が、管が開いたことで「内が運動、外が感覚」に変わった。"]},{"h":"運動の核は、動かす相手で3種類","b":["運動の核は、何を動かすかで3種類に分かれる。同じ種類の核は、脳幹の上下に縦の列(column、柱)を作って並ぶ。","1つ目は somatic motor(体性運動)。somite(体節)から生まれた筋を動かす。体節とは、胎児の背骨の両側に並ぶ細胞のかたまりで、手足や体幹の筋のもとになる。頭では、目を動かす筋と舌の筋が体節から生まれる。","2つ目は special visceral efferent、略して SVE(鰓弓運動)。pharyngeal arch(咽頭弓、鰓弓)から生まれた筋を動かす。咽頭弓とは、胎児の首の両側にできる数本のひだで、魚ではエラになる部分。ヒトでは顎・顔・のどの筋になる。だから SVE が動かすのは、噛む筋・表情の筋・咽頭と喉頭の筋。どれも体節由来の筋と同じ横紋筋だが、生まれが違うので別の列に分ける。","3つ目は general visceral efferent、略して GVE(一般内臓運動)。こちらは骨格筋ではなく、腺(涙や唾液を出す器官)と、内臓や瞳孔の中にある平滑筋を動かす。自分の意思とは関係なく働く、自律神経の仕組みの一部。詳しくは少し後のページで説明する。","並び方は、正中にいちばん近い列が体性運動、その外が鰓弓運動、さらにその外(境界溝寄り)が内臓運動。ただし鰓弓運動の核は、発生の途中で前の深い所へ移動するので、床の表面から離れた位置にある。"]},{"h":"核と脳神経の関係","b":["ここから核の名前がたくさん出てくるので、先に核と神経の関係を整理しておく。","核は脳幹の中にある細胞体のかたまりで、その細胞体から軸索(長い突起)が伸びる。軸索がたくさん集まって脳幹の外へ出たものが、脳神経になる。","たとえば「動眼神経核」は、その軸索が集まって CN III(動眼神経)になる核、という意味。核の名前は、多くの場合、その軸索がどの神経になるかで決まっている。","大事なのは、1本の脳神経は1種類の線維だけでできているとは限らないこと。電線の束のように、役割の違う何種類かの線維が1本の神経の中にまとめられていることが多い。","たとえば CN III には、目を動かす筋への線維と、瞳孔を小さくする筋への線維の2種類が入っている。この2種類は、脳幹の中では別々の核から出発し、脳幹を出るところで合流して1本の CN III になる。","だから「CN III の核」は1つではなく、目を動かす線維の核と、瞳孔の線維の核の2つがある。"]},{"h":"体性運動の核(目と舌)","b":["動眼神経核:CN III の核。中脳の上丘の高さ、中脳水道のすぐ前の正中。目を動かす筋の大部分を担当する。","滑車神経核:CN IV の核。中脳の下丘の高さ。上斜筋(目を下外側へ向ける)を担当する。","外転神経核:CN VI の核。橋の第四脳室の床。外側直筋(目を外へ向ける)を担当する。","舌下神経核:CN XII の核。延髄の第四脳室の床、正中のすぐ横。舌の筋を担当する。","覚え方:体性運動の核の番号は 3・4・6・12。すべて12の約数になっている。"]},{"h":"鰓弓運動の核(顎・顔・のど)","b":["三叉神経運動核:CN V の運動の核。橋。咀嚼筋(噛む筋)を担当する。","顔面神経核:CN VII の運動の核。橋の下部。表情筋を担当する。","nucleus ambiguus(疑核):CN IX と CN X の運動の核。延髄。咽頭と喉頭の筋を動かし、飲み込み(嚥下)と声を出すこと(発声)を担当する。網様体の中に埋もれて輪郭がはっきりしないので「あいまいな核」と名づけられた。","副神経核:CN XI の核。延髄の下部から上部頸髄。胸鎖乳突筋と僧帽筋を担当する。"]},{"h":"自律神経と副交感神経","b":["内臓運動の核を理解するために、自律神経を先に説明する。","心臓の拍動、腸の動き、唾液や涙の分泌、瞳孔の大きさは、自分の意思では変えられない。これらを自動で調節している神経を autonomic nervous system(自律神経系)という。","自律神経には、正反対の働きをする2つの系統がある。","sympathetic(交感神経):戦う・逃げるときの体の状態を作る。心臓を速くし、瞳孔を大きくし、消化を止める。脊髄の胸と腰の高さから出る。","parasympathetic(副交感神経):休む・食べるときの体の状態を作る。心臓をゆっくりにし、瞳孔を小さくし、涙や唾液を出し、腸を動かす。出発点は脳幹と、脊髄のいちばん下(仙髄)。","自律神経には、骨格筋への神経とは違う特徴がもう1つある。骨格筋へは、脳幹や脊髄の神経細胞が1本の軸索で直接届く。自律神経は途中で1回乗り換える。","1. 脳幹の核の神経細胞(1本目)が軸索を伸ばす。","2. その軸索は、目的の臓器の近くにある ganglion(神経節:神経細胞が集まった乗り換え駅)で終わる。","3. 神経節の神経細胞(2本目)が、残りの短い距離を伸びて臓器に届く。","脳幹の内臓運動の核は、この副交感神経の1本目の神経細胞の集まり。"]},{"h":"副交感の4つの核","b":["頭と内臓の副交感神経は、脳幹の4つの核から出発する。それぞれの核の軸索は、脳幹を出るときに、目を動かす神経や顔の神経などの束の中に混ざって一緒に走り、目的地の近くの神経節まで行く。","目への命令:瞳孔を小さくし、近くのものにピントを合わせる。出発点は中脳の Edinger-Westphal 核(エディンガー・ウェストファル核。発見した2人の名前)。動眼神経核のすぐ隣にあり、軸索は CN III の束の中に入って眼窩まで行く。","涙と唾液への命令(一部):涙腺と、顎の下と舌の下の唾液腺(顎下腺と舌下腺)から分泌させる。出発点は橋の superior salivatory nucleus(上唾液核)。salivatory は「唾液の」という意味で、唾液の核が2つあるうちの上のほう。軸索は CN VII(顔面神経)の束の中に入って進む。","もう1つの唾液腺への命令:耳の前にある大きな唾液腺(耳下腺)から分泌させる。出発点は延髄の inferior salivatory nucleus(下唾液核)。唾液の核の下のほう。軸索は CN IX(舌咽神経)の束の中に入って進む。","内臓への命令:心臓をゆっくりにし、気管支を狭め、胃腸を動かす。出発点は延髄の dorsal motor nucleus of vagus(迷走神経背側核)。迷走神経(CN X)の運動の核のうち、背側(第四脳室の床に近い側)にあるもの。軸索は CN X の束の中に入って、首から胸、腹の内臓まで下りていく。","まとめると、副交感の線維を含む脳神経は III・VII・IX・X の4本。"]},{"h":"感覚の核も3種類","b":["感覚の核は外側に並ぶ。何を感じるかで3種類に分かれる。","1つ目は、顔の皮膚などの一般的な感覚(触る、痛い、熱い・冷たい、顎の位置)。担当するのは三叉神経(CN V)の感覚の核。この核は脳幹の上から下まで細長く伸びていて、高さごとに担当する感覚が違う。","- mesencephalic nucleus(中脳路核):中脳にあるのでこの名前。噛む筋がどれだけ伸びているか(顎の位置の感覚)を受ける。","- main sensory nucleus(主感覚核):橋にある。顔の触覚を受ける。","- spinal trigeminal nucleus(脊髄路核):延髄から脊髄の上の方まで下に伸びているのでこの名前。顔の痛みと温度を受ける。","2つ目は、耳の奥にある器官からの特殊な感覚。耳の奥には、体のバランスを感じる vestibule(前庭)と、音を感じるカタツムリ形の cochlea(蝸牛)がある。ここからの情報は CN VIII(内耳神経)で運ばれ、脳幹の vestibular nuclei(前庭神経核)と cochlear nuclei(蝸牛神経核)に届く。橋と延髄の境あたりで、床のいちばん外側にある。","3つ目は、内臓と味の感覚。担当は延髄の solitary nucleus(孤束核)。味覚や内臓からの線維が脳幹に入ると、1本の細い束にまとまって縦に走る。他の束から離れてぽつんと走るので solitary tract(孤束)と呼び、その周りを囲む核が孤束核。味覚(CN VII・IX・X が運ぶ)と、心臓・血管・消化管からの情報(CN IX・X が運ぶ)がここに集まる。","床の上では、内側から外側へ、内臓と味(孤束核)、耳(前庭神経核)、顔の皮膚(三叉神経の核)の順に並ぶ。"]},{"h":"延髄の床で、全部の並びを確かめる","b":["延髄の高さで第四脳室の床を正中から外側へたどると、ここまでの原則がそのまま見える。","1. 舌下神経核(CN XII):体性運動。正中のすぐ横。","2. 迷走神経背側核(CN X):内臓運動。","3. ここで境界溝を越える。ここから外側は感覚。","4. 孤束核:内臓と味の感覚。","5. 前庭神経核:耳の感覚。","6. 三叉神経脊髄路核:顔の皮膚の感覚。いちばん外側。","鰓弓運動の疑核(CN IX・X)は、この列には入らない。床から離れた前方の網様体の中に埋もれている。"]},{"h":"脳幹を通る長経路は4本","b":["脳幹を通る長い線維はたくさんあるが、まず次の4本を覚える。","上りの経路は2本で、どちらも被蓋を通って視床へ向かう。","1. spinothalamic tract(脊髄視床路):痛みと温度を運ぶ。被蓋の外側寄りを通る。","2. medial lemniscus(内側毛帯):触覚・振動・手足の位置の感覚を運ぶ。被蓋を通る。","下りの経路も2本で、どちらも大脳皮質から出て base を通る。","3. corticospinal tract(皮質脊髄路):手足を動かす命令。延髄の錐体を通って脊髄へ行く。","4. corticobulbar tract(皮質核路):顔やのどを動かす命令。脳幹の中で、運動の脳神経核へ枝を出して終わる。","経路の全体は Day 6 で、起始から終点まで通して学ぶ。"]},{"h":"中脳の断面を前から後ろへ","b":["上丘の高さで中脳を横に切り、前から後ろへ順にたどる。","1. crus cerebri(大脳脚):いちばん前で、左右にハの字に張り出す太い線維の束。大脳皮質から下りる運動の線維で、これが中脳の base。左右の大脳脚の間のくぼみを interpeduncular fossa(脚間窩)という。","2. substantia nigra(黒質):大脳脚のすぐ後ろにある、三日月形の黒い帯。メラニンを含む神経細胞が並んでいるので黒く見える。動きの開始に関わり、ここが変性するとパーキンソン病になる(Day 11)。","3. red nucleus(赤核):黒質の後ろ、被蓋の中にある丸い核で、左右に1つずつ。血管が多く赤みがかって見える。小脳からの情報を受けて運動を協調させる。","4. 被蓋のその他の構造:赤核の外側を、上りの内側毛帯と脊髄視床路が通る。網様体もこの層に散らばる。","5. oculomotor nucleus(動眼神経核):正中、中脳水道のすぐ前。ここから出た線維は前へ進み、赤核を貫いて、脚間窩から脳の外へ出る。これが CN III。","6. cerebral aqueduct(中脳水道):断面の後ろ寄りの中央にある細い穴。その周りを periaqueductal gray(中心灰白質:痛みを抑える働きがある)が囲む。","7. superior colliculus(上丘):いちばん後ろの roof。目の動きの反射に関わる。","下丘の高さで切ると、動眼神経核の代わりに滑車神経核(CN IV)、上丘の代わりに下丘(聴覚の中継所)が見える。"]},{"h":"橋の断面","b":["橋を横に切ると、前半分と後ろ半分で見た目がまったく違う。","前半分は大きな basilar pons(橋底部)。ここには pontine nuclei(橋核)という神経細胞の集まりが散らばっている。橋核は大脳皮質からの線維を受け取り、横に走る線維を出して反対側の小脳へ送る。この横に走る線維が左右で集まって、小脳へつながる太い束(中小脳脚)になる。皮質脊髄路は、橋核の間を縦に通り抜けて下へ向かう。","後ろ半分は被蓋で、CN V・VI・VII・VIII の核と、上りの内側毛帯がある。その後ろが第四脳室。"]},{"h":"延髄の断面と脳神経の出口","b":["延髄を横に切ると、前の正中の両側に錐体があり、中を皮質脊髄路が通る。錐体の外側のオリーブの中には、波打った形の inferior olivary nucleus(下オリーブ核)があり、小脳へ線維を送っている。後ろには第四脳室の床と、前のページで見た核の列がある。","延髄の下端では、皮質脊髄路の大部分(85〜90%)が左右に交叉する。これを pyramidal decussation(錐体交叉)という。大脳の左半分が体の右半分を動かすのは、ここで交叉するから。","最後に、脳神経が脳幹のどこから外へ出るかをまとめる。","- CN III:中脳の前、脚間窩から。","- CN IV:中脳の後ろ、下丘のすぐ下から。後ろから出る脳神経はこれだけ。","- CN V:橋の外側面から。","- CN VI・VII・VIII:橋と延髄の境の溝から。内側から VI、VII、VIII の順。","- CN XII:延髄の錐体とオリーブの間の溝から。","- CN IX・X・XI:延髄のオリーブの後ろの溝から。"]}],"terms":[{"q":"autonomic nervous system","a":"自律神経系。内臓・腺・瞳孔を自動で調節"},{"q":"sympathetic","a":"交感神経。戦う・逃げる状態を作る"},{"q":"parasympathetic","a":"副交感神経。休む・食べる状態を作る"},{"q":"ganglion","a":"神経節。自律神経の乗り換え駅(神経細胞の集まり)"},{"q":"solitary tract","a":"孤束。味と内臓の線維が作る1本の束"},{"q":"nucleus(神経核)","a":"神経細胞の細胞体が集まったかたまり"},{"q":"neural tube","a":"神経管。胎児の脳と脊髄のもとになる管"},{"q":"basal plate","a":"基板。神経管の壁の前半分、運動の神経細胞ができる"},{"q":"alar plate","a":"翼板。神経管の壁の後ろ半分、感覚の神経細胞ができる"},{"q":"somite","a":"体節。胎児の背骨の両側の細胞塊、眼筋・舌筋・体幹と手足の筋のもと"},{"q":"pharyngeal arch","a":"咽頭弓(鰓弓)。胎児の首のひだ、顎・顔・のどの筋のもと"},{"q":"brainstem","a":"脳幹。中脳・橋・延髄の3つ"},{"q":"midbrain","a":"中脳。脳幹の最上部"},{"q":"pons","a":"橋。中脳と延髄の間、前にふくらむ"},{"q":"medulla oblongata","a":"延髄。脳幹の最下部、脊髄に続く"},{"q":"base(脳幹の)","a":"底部。最も腹側、下行する運動線維の通り道"},{"q":"tegmentum","a":"被蓋。base と脳室の間。脳神経核・上行路・網様体"},{"q":"tectum","a":"中脳の蓋。上丘と下丘(四丘体)"},{"q":"crus cerebri","a":"大脳脚。中脳の base、皮質からの下行線維の束"},{"q":"cerebral peduncle","a":"中脳の腹側半分の総称(大脳脚+黒質+被蓋)。狭義に crus cerebri と同じ意味でも使う"},{"q":"pyramid","a":"錐体。延髄前面の隆起、corticospinal tract が通る"},{"q":"olive","a":"オリーブ。延髄外側の隆起、下オリーブ核が入る"},{"q":"cerebral aqueduct","a":"中脳水道(Sylvius 水道)。第三脳室と第四脳室をつなぐ"},{"q":"periaqueductal gray","a":"中心灰白質。中脳水道を囲む灰白質"},{"q":"red nucleus","a":"赤核。中脳被蓋の丸い核、運動の協調"},{"q":"substantia nigra","a":"黒質。大脳脚の背側、メラニンで黒い"},{"q":"sulcus limitans","a":"境界溝。脳幹で運動の柱と感覚の柱を分ける"},{"q":"somatic motor","a":"体性運動。体節由来の骨格筋(眼筋・舌筋)へ"},{"q":"special visceral efferent","a":"鰓弓運動(SVE)。鰓弓由来の横紋筋へ"},{"q":"general visceral efferent","a":"一般内臓運動(GVE)。副交感の節前ニューロン"},{"q":"reticular formation","a":"網様体。被蓋に散らばるニューロン網、覚醒・自律"},{"q":"interpeduncular fossa","a":"脚間窩。左右の大脳脚の間、CN III が出る"}],"facts":[{"q":"核の名前は多くの場合何で決まる","a":"その軸索がどの神経になるか"},{"q":"CN III に入っている2種類の線維","a":"目を動かす筋への線維と、瞳孔を小さくする筋への線維"},{"q":"副交感神経が作る体の状態","a":"休む・食べる状態(心拍を遅く、瞳孔を小さく、分泌、腸を動かす)"},{"q":"交感神経が作る体の状態","a":"戦う・逃げる状態"},{"q":"副交感神経の出発点2か所","a":"脳幹と仙髄"},{"q":"自律神経が骨格筋への神経と違う点","a":"途中の神経節で1回乗り換える"},{"q":"Edinger-Westphal 核の名前の由来","a":"発見した2人の名前"},{"q":"salivatory の意味","a":"唾液の"},{"q":"中脳路核の名前の由来","a":"中脳にあるから"},{"q":"脊髄路核の名前の由来","a":"脊髄の上の方まで下に伸びているから"},{"q":"孤束の名前の由来","a":"他の束から離れてぽつんと走るから"},{"q":"基板からできる神経細胞","a":"運動の神経細胞"},{"q":"翼板からできる神経細胞","a":"感覚の神経細胞"},{"q":"脳幹で神経管はどう変形する","a":"後ろの壁が薄く伸び、管が後ろで左右に開く"},{"q":"管が開いたとき基板が来る位置","a":"正中に近い側(内側)"},{"q":"管が開いたとき翼板が来る位置","a":"外側"},{"q":"開いた神経管の内面が作るもの","a":"第四脳室の床"},{"q":"体節由来の頭の筋","a":"目を動かす筋と舌の筋"},{"q":"咽頭弓由来の筋","a":"咀嚼筋・表情筋・咽頭と喉頭の筋"},{"q":"最も正中寄りの運動の列","a":"体性運動"},{"q":"床の表面から離れて前方にある運動核の種類","a":"鰓弓運動(疑核など)"},{"q":"副交感の線維を含む脳神経","a":"III・VII・IX・X"},{"q":"上唾液核の軸索が通る脳神経","a":"CN VII"},{"q":"下唾液核の軸索が通る脳神経","a":"CN IX"},{"q":"疑核の軸索が通る脳神経","a":"CN IX と CN X"},{"q":"感覚の核を床の内側から外側へ","a":"孤束核 → 前庭神経核 → 三叉神経の核"},{"q":"延髄の床を正中から外側へ","a":"舌下神経核 → 迷走神経背側核 → 境界溝 → 孤束核 → 前庭神経核 → 三叉神経脊髄路核"},{"q":"橋底部にある神経細胞の集まり","a":"橋核(pontine nuclei)"},{"q":"橋核の線維が集まってできる束","a":"中小脳脚"},{"q":"脳幹の後ろから出る唯一の脳神経","a":"CN IV"},{"q":"CN V が出る場所","a":"橋の外側面"},{"q":"橋と延髄の境から出る神経を内側から","a":"VI → VII → VIII"},{"q":"脳幹の3部を上から","a":"midbrain → pons → medulla"},{"q":"脳幹の後ろに乗っている構造は","a":"Cerebellum(間に第四脳室)"},{"q":"脳幹の4層を前から","a":"base → tegmentum → ventricular cavity → roof"},{"q":"下行する運動線維が通る層は","a":"Base"},{"q":"脳神経の核が入る層は","a":"Tegmentum"},{"q":"中脳の roof の名前は","a":"Tectum(上丘・下丘)"},{"q":"中脳の base の名前は","a":"Crus cerebri(大脳脚)"},{"q":"橋の base の名前は","a":"Ventral (basilar) pons"},{"q":"延髄の base の名前は","a":"Pyramid"},{"q":"中脳の脳室腔は","a":"Cerebral aqueduct"},{"q":"橋と延髄の脳室腔は","a":"Fourth ventricle"},{"q":"脳幹で運動核は内側・外側のどちら","a":"内側(感覚は外側)"},{"q":"運動と感覚の境の溝は","a":"Sulcus limitans"},{"q":"脊髄の前後配置が脳幹で内外配置になる理由","a":"第四脳室が背側で開いて左右に広がったから"},{"q":"Somatic motor の核を4つ","a":"III・IV・VI・XII"},{"q":"SVE の核を4つ","a":"V運動核・VII運動核・nucleus ambiguus・XI核"},{"q":"GVE(副交感)の核を4つ","a":"Edinger-Westphal・上唾液核・下唾液核・迷走神経背側核"},{"q":"味覚と内臓感覚の核は","a":"Solitary nucleus(孤束核)"},{"q":"上行する長経路2本","a":"Spinothalamic tract と medial lemniscus"},{"q":"下行する長経路2本","a":"Corticospinal tract と corticobulbar tract"},{"q":"上行路は脳幹のどの層を通る","a":"Tegmentum"},{"q":"中脳断面で大脳脚のすぐ背側の構造","a":"Substantia nigra"},{"q":"中脳断面で被蓋の中心にある丸い核","a":"Red nucleus"},{"q":"中脳水道を囲む灰白質","a":"Periaqueductal gray"},{"q":"上丘レベルの中脳にある脳神経核","a":"Oculomotor nucleus(CN III)"},{"q":"下丘レベルの中脳にある脳神経核","a":"Trochlear nucleus(CN IV)"},{"q":"CN III が出る場所","a":"Interpeduncular fossa"},{"q":"延髄で錐体の外側にある隆起","a":"Olive"},{"q":"CN XII が出る溝","a":"錐体とオリーブの間(preolivary sulcus)"},{"q":"CN IX・X・XI が出る溝","a":"オリーブの後ろ(retro-olivary sulcus)"}]},{"title":"2 動眼・滑車・外転神経、瞳孔、注視","secs":[{"title":"CN III・IV・VIと眼球運動","cards":[{"q":"III・IV・VIの核をつなぐものは?","a":"Medial longitudinal fasciculus (MLF)。vestibular nucleiとも連絡","s":1},{"q":"眼球を動かす神経と筋は?","a":"III:superior・inferior・medial rectus、inferior oblique、levator palpebrae。IV:superior oblique(down and out)。VI:lateral rectus(out)","s":2,"n":"LR6 SO4, 残りは3:Lateral Rectus = VI, Superior Oblique = IV, その他 = III"},{"q":"CN IIIの経路は?","a":"核(superior colliculusレベル)→ red nucleusを貫く → interpeduncular fossa → PCAとSCAの間 → PCoAの外側 → cavernous sinus外側壁 → superior orbital fissure","s":1},{"q":"Edinger-Westphal nucleusからの線維の運命は?","a":"Preganglionic parasympathetic線維がCN IIIの表層を走る → ciliary ganglion → short ciliary nerves → sphincter pupillaeとciliary muscle","s":2},{"q":"Pupillary light reflexの経路は?","a":"Retina → optic nerve → chiasm → optic tract → pretectal nucleus(LGBは通らない)→ 両側Edinger-Westphal → CN III → ciliary ganglion → short ciliary nerves → sphincter pupillae。directとconsensual","s":2},{"q":"Accommodation reflexの3要素は?","a":"Convergence、lensが厚くなる(ciliary muscle収縮)、miosis。visual association cortexからpretectal areaへ","s":0},{"q":"CN IVの2つの「唯一」は?","a":"唯一、完全に交叉する(superior medullary velum内)。唯一、脳幹の背側(inferior colliculusの下)から出る","s":0,"n":"SO4:Superior Oblique = CN IV"},{"q":"CN VIの核の位置と機能は?","a":"Pons、第四脳室底のfacial colliculusの深部。lateral rectusで眼球外転","s":1},{"q":"CN VIの経路は?","a":"Ponsを前方へ貫く → pontomedullary sulcusで出る → clivus上を上行 → duraを貫きDorello's canal → cavernous sinus(ICAの外側、sinusの内部)→ superior orbital fissure → lateral rectus","s":2},{"q":"Dorello's canalとは?","a":"Petrous apexとpetrosphenoidal (Gruber's) ligamentの間の管。CN VIが通り、ここで固定されるため頭蓋内圧亢進で障害されやすい","s":1},{"q":"Cavernous sinus内でCN VIはどこ?","a":"Sinusの内部でICAの外側。III・IV・V1・V2は外側壁内","s":1,"n":"O TOM CAT:外側壁を上から Oculomotor, Trochlear, Ophthalmic, Maxillary。内部に Carotid, Abducens, (T)"},{"q":"Facial colliculusとは?","a":"第四脳室底(pons部)の隆起。abducens nucleusとそれを回る顔面神経線維(internal genu)が作る","s":1},{"q":"Conjugate horizontal gazeの経路は?","a":"Frontal eye field (area 8) → internal capsule genu → ponsで交叉 → 対側PPRF → 同側abducens nucleus → MLF → 対側oculomotor nucleus。右area 8は眼を左へ向ける","s":0}]},{"title":"瞳孔の交感神経","cards":[{"q":"瞳孔散大の交感神経路は?","a":"Hypothalamus → ciliospinal center (C8–T2) → superior cervical ganglion → internal carotid plexus → long ciliary nerves → dilator pupillae","s":0},{"q":"Horner's syndromeの徴候は?","a":"Miosis、ptosis、enophthalmos、顔面のanhidrosis","s":0,"n":"PAM is horny:Ptosis, Anhidrosis, Miosis"}]}],"rev":[0],"lesson":[{"h":"今日学ぶこと","b":["今日は、目を動かす仕組みを学ぶ。目を動かす脳神経は3本ある。CN III(oculomotor nerve、動眼神経)、CN IV(trochlear nerve、滑車神経)、CN VI(abducens nerve、外転神経)。","Day 1 で、この3本の核はどれも「体性運動」の核だと学んだ。体節から生まれた筋、つまり目を動かす筋を動かすからだ。","今日の流れは、まず目を動かす筋そのものを知り、次にそれぞれの神経の核と通り道を追い、最後に瞳孔の大きさを変える仕組みと、左右の目をそろえて動かす仕組みを学ぶ。"]},{"h":"目を動かす筋は6本","b":["眼球は、眼窩(頭蓋骨の目の穴)の中で、6本の細い筋に引っぱられて向きを変える。これを extraocular muscles(外眼筋)という。","4本はまっすぐ前後に走る筋で、rectus(直筋)と呼ぶ。眼球の上・下・内側(鼻の側)・外側(耳の側)についている。","- superior rectus(上直筋):目を上へ向ける。","- inferior rectus(下直筋):目を下へ向ける。","- medial rectus(内側直筋):目を内側(鼻の側)へ向ける。","- lateral rectus(外側直筋):目を外側(耳の側)へ向ける。","残りの2本は斜めに走る筋で、oblique(斜筋)と呼ぶ。","- superior oblique(上斜筋):目を下・外側へ向ける。","- inferior oblique(下斜筋):目を上・外側へ向ける。","もう1本、まぶたを持ち上げる levator palpebrae superioris(上眼瞼挙筋)も、同じ仲間の神経が動かす。"]},{"h":"どの筋をどの神経が動かすか","b":["6本の外眼筋とまぶたの筋を、3本の神経で分担している。","- 外側直筋だけを CN VI(外転神経)が動かす。「外転」とは目を外へ向けること。神経の名前が、そのまま担当する動きになっている。","- 上斜筋だけを CN IV(滑車神経)が動かす。上斜筋の腱は、眼窩の内側上方にある「滑車」(pulley)という軟骨の輪を通って向きを変える。この筋を動かす神経なので滑車神経という。","- それ以外の筋(上直筋・下直筋・内側直筋・下斜筋・上眼瞼挙筋)は、すべて CN III(動眼神経)が動かす。「動眼」は目を動かすという意味で、ほとんどの筋を受け持つ。","覚え方:LR6 SO4、残りは3。lateral rectus は 6、superior oblique は 4、ほかは全部 3。"]},{"h":"3つの核はどこにあるか","b":["Day 1 で学んだとおり、体性運動の核は脳幹の正中近くに並ぶ。","- 動眼神経核(CN III):中脳の、上丘の高さ。中脳水道のすぐ前。","- 滑車神経核(CN IV):中脳の、少し下の下丘の高さ。","- 外転神経核(CN VI):橋の、第四脳室の床。","外転神経核のある場所では、第四脳室の床が小さく盛り上がっている。これは外転神経核そのものに加えて、顔面神経(CN VII)の運動の線維がこの核の後ろをぐるりと回り込んで通るため。この盛り上がりを facial colliculus(顔面神経丘)という。下にあるのは外転神経核なのに「顔面神経」の名がつくのは、回り込む顔面神経の線維がふくらみを作っているから。"]},{"h":"3つの核をつなぐ線維:MLF","b":["物を見るとき、左右の目は必ずそろって同じ方向を向く。右を見るときは、右目は外へ(右の外側直筋、CN VI)、左目は内へ(左の内側直筋、CN III)向く必要がある。別々の核が同じ瞬間に働かなければならない。","そのために、3つの核の間を縦につなぐ線維の束がある。medial longitudinal fasciculus、略して MLF(内側縦束)。名前のとおり、正中の近く(medial)を縦に(longitudinal)走る束(fasciculus)。","MLF は、体のバランスを感じる前庭神経核(Day 4)にもつながっている。頭が動いたときに、目が反対方向へ動いて視線を保てるのは、このつながりのおかげ。"]},{"h":"動眼神経には2種類の線維が入っている","b":["Day 1 で、1本の脳神経には何種類かの線維がまとめられていると学んだ。CN III はその代表例。","1つ目は、目を動かす筋への線維。動眼神経核から出る。","2つ目は、瞳孔を小さくする筋と、水晶体の厚さを変える筋への線維。これは副交感神経の線維で、Edinger-Westphal 核(EW 核)から出る。EW 核は動眼神経核のすぐ隣にある。","この2種類の線維は、脳幹を出るところで合流して1本の CN III になり、一緒に眼窩まで進む。"]},{"h":"瞳孔の副交感の線維は、どこで乗り換えて何を動かすか","b":["Day 1 で学んだとおり、副交感神経は途中の神経節で1回乗り換える。","1. EW 核の神経細胞が軸索を伸ばす。軸索は CN III の中を通って眼窩に入る。","2. 眼窩の奥、眼球の後ろにある ciliary ganglion(毛様体神経節)で、次の神経細胞に乗り換える。","3. 2本目の神経細胞の軸索は short ciliary nerves(短毛様体神経)となって眼球に入る。","4. 眼球の中の2つの筋に届く。","- sphincter pupillae(瞳孔括約筋):瞳孔を取り囲む輪の形の筋。縮むと瞳孔が小さくなる。瞳孔が小さくなることを miosis(縮瞳)という。","- ciliary muscle(毛様体筋):水晶体を支える筋。縮むと水晶体を引っぱる力がゆるみ、水晶体が自分の弾力で厚くなる。厚い水晶体は近くの物にピントを合わせる。"]},{"h":"動眼神経の通り道","b":["CN III は中脳の前、左右の大脳脚の間のくぼみ(脚間窩)から外へ出る。","脚間窩を出たすぐの所で、2本の動脈の間をくぐる。上にあるのが posterior cerebral artery、略して PCA(後大脳動脈)、下にあるのが superior cerebellar artery、略して SCA(上小脳動脈)。どちらも脳底動脈から分かれる動脈で、Day 17 で詳しく扱う。","その後、CN III は前へ進む。このとき、すぐ内側を posterior communicating artery、略して PCoA(後交通動脈)が並んで走る。PCoA は、脳の底で前の動脈(内頸動脈)と後ろの動脈(後大脳動脈)をつなぐ短い動脈(Day 16)。","さらに前へ進むと cavernous sinus(海綿静脈洞)に入る。海綿静脈洞は、頭蓋骨の中央、下垂体の両脇にある静脈の通り道で、その外側の壁の中を CN III が通る。","最後に superior orbital fissure(上眼窩裂:眼窩の奥にある細長いすき間)から眼窩に入る。"]},{"h":"なぜ PCoA の動脈瘤で、まず瞳孔が開くのか","b":["動脈瘤とは、動脈の壁の弱い所が風船のようにふくらんだもの。PCoA に動脈瘤ができると、すぐ外側を走る CN III を外から押す。","CN III の中で、瞳孔の副交感の線維は、神経の表面近く(内側寄り)を走っている。目を動かす線維はその内側の深い所にある。","外から押されると、表面の線維が先に傷む。だから、目の動きが悪くなるより先に、瞳孔を小さくする命令が届かなくなり、その側の瞳孔だけが開いたままになる。瞳孔が開くことを mydriasis(散瞳)という。","片側の瞳孔だけが開いたら、PCoA の動脈瘤を疑う。試験でこの話は必ず付け加える。"]},{"h":"滑車神経は2つの点で特別","b":["CN IV は、他の脳神経にはない特徴を2つ持っている。","1つ目:完全に交叉する唯一の脳神経。滑車神経核から出た線維は、後ろへ向かい、中脳の後ろの薄い膜(superior medullary velum 上髄帆)の中で左右が入れ替わる。だから右の滑車神経核は、左目の上斜筋を動かす。","2つ目:脳幹の後ろ(背側)から出る唯一の脳神経。下丘のすぐ下から出て、中脳の横を回り込んで前へ向かう。","その後は CN III と同じように、海綿静脈洞の外側の壁を通り、上眼窩裂から眼窩に入る。"]},{"h":"外転神経の長い道のり","b":["CN VI の核は橋の第四脳室の床にある。線維は橋の中を前へまっすぐ進み、橋と延髄の境の溝(pontomedullary sulcus)から外へ出る。","外へ出ると、頭蓋骨の底の斜めの面(clivus 斜台)に沿って上っていく。途中で、脳を包む硬い膜(硬膜)を貫いて、Dorello's canal(ドレロ管)という狭いトンネルを通る。ドレロ管は、側頭骨の先端(錐体尖)と靱帯の間にできたすき間。","その後、海綿静脈洞に入る。CN III・IV が洞の壁の中を通るのに対して、CN VI は洞の中(内部)を、内頸動脈のすぐ外側に沿って進む。最後に上眼窩裂から眼窩に入り、外側直筋に届く。","脳幹から眼窩までの距離が長く、途中のドレロ管で固定されているので、頭の中の圧が上がって脳が押し下げられると引っぱられて傷みやすい。そのため、頭蓋内圧が上がると、まず片目または両目が外へ向けにくくなることがある。"]},{"h":"光で瞳孔が縮む仕組み(対光反射)","b":["目に光を当てると瞳孔が縮む。これを pupillary light reflex(対光反射)という。反射とは、意識しなくても刺激に対して自動で起こる反応のこと。","光の情報は次の順に伝わる。","1. 光が網膜に当たる。","2. 網膜からの信号が optic nerve(視神経)を通る。","3. optic chiasm(視交叉)で一部の線維が反対側へ渡り、optic tract(視索)に入る。","4. 物を見るための線維は、視床の外側膝状体(Day 9)を経て大脳の視覚野へ向かう。一方、対光反射の線維は外側膝状体を通らずに、中脳の上丘の手前にある pretectal nucleus(視蓋前域核)へ行く。","5. 視蓋前域核は、左右両方の EW 核に線維を送る。","6. EW 核から CN III、毛様体神経節、短毛様体神経を経て、瞳孔括約筋が縮む。","5番で左右両方に送るので、片方の目に光を当てても両方の瞳孔が縮む。光を当てた側が縮むのを直接反射、反対側が縮むのを間接反射(共感性反射)という。"]},{"h":"近くを見るときに起こる3つのこと","b":["遠くから近くへ視線を移すと、3つのことが同時に起こる。これを accommodation reflex(近見反射、調節反射)という。","1. convergence(輻輳):両目が内側へ寄る。左右の内側直筋が縮む(CN III)。","2. 水晶体が厚くなる:毛様体筋が縮む(EW 核、副交感)。近くにピントが合う。","3. 縮瞳:瞳孔括約筋が縮む(EW 核、副交感)。瞳孔を小さくすると、ピントの合う範囲が深くなり、像がぼやけにくい。","この反射は、目で見た像がぼやけていることを大脳の視覚野が判断して始まる点が、対光反射と違う。"]},{"h":"瞳孔を開くのは交感神経","b":["瞳孔を小さくするのが副交感神経なら、大きくするのは交感神経(Day 1 で学んだ、戦う・逃げるための系統)。暗い所や驚いたときに瞳孔が開くのはこのため。","瞳孔を開く筋は dilator pupillae(瞳孔散大筋)。瞳孔から外へ放射状に伸びる筋で、縮むと瞳孔を外へ引っぱって大きくする。","交感神経の命令は、遠回りしてここまで届く。","1. 視床下部(Day 10)から出た命令が、脳幹を下って脊髄まで行く。","2. 脊髄の首から胸の境(C8〜T2)にある神経細胞が、1本目の神経細胞になる。","3. その軸索は脊髄を出て、首の上の方にある superior cervical ganglion(上頸神経節)まで上る。ここで乗り換える。","4. 2本目の神経細胞の軸索は、内頸動脈の表面にからみついて一緒に頭蓋の中へ上り、眼窩に入って瞳孔散大筋に届く。","この経路のどこかが切れると、Horner syndrome(ホルネル症候群)になる。症状は、その側の瞳孔が小さい(縮瞳)、まぶたが少し下がる(眼瞼下垂)、目が少し奥に引っ込んで見える、顔に汗が出ない、の4つ。"]},{"h":"左右の目をそろえて横を向く仕組み","b":["右を見ようと思ったとき、両目をそろえて右へ向ける命令は次の順に伝わる。","1. 前頭葉にある frontal eye field(前頭眼野、Brodmann の8野)が命令を出す。","2. 命令は脳幹へ下り、橋で反対側へ渡る。","3. 橋にある PPRF(paramedian pontine reticular formation、傍正中橋網様体)に届く。PPRF は「目を自分の側へ水平に向ける」ための中枢。","4. PPRF は、同じ側の外転神経核を動かす。その側の目が外へ向く。","5. 同時に、外転神経核から MLF を通って反対側の動眼神経核へ信号が送られ、反対側の目の内側直筋が縮む。反対側の目が内へ向く。","結果として、両目がそろって同じ方向を向く。2番で反対側に渡るので、右の前頭眼野は両目を左へ向ける。"]}],"terms":[{"q":"oculomotor nerve","a":"CN III、動眼神経"},{"q":"trochlear nerve","a":"CN IV、滑車神経"},{"q":"abducens nerve","a":"CN VI、外転神経"},{"q":"lateral rectus","a":"外側直筋。目を外へ。CN VI"},{"q":"superior oblique","a":"上斜筋。目を下・外へ。CN IV"},{"q":"levator palpebrae superioris","a":"上眼瞼挙筋。まぶたを上げる。CN III"},{"q":"MLF","a":"Medial longitudinal fasciculus、内側縦束。眼球運動核と前庭核をつなぐ"},{"q":"Edinger-Westphal nucleus","a":"EW核。CN III の副交感の核"},{"q":"ciliary ganglion","a":"毛様体神経節。眼窩内、EW核からの線維の乗り換え駅"},{"q":"short ciliary nerves","a":"短毛様体神経。毛様体神経節から眼球へ"},{"q":"sphincter pupillae","a":"瞳孔括約筋。瞳を縮める(副交感)"},{"q":"dilator pupillae","a":"瞳孔散大筋。瞳を開く(交感)"},{"q":"ciliary muscle","a":"毛様体筋。収縮で水晶体が厚くなり近くにピント"},{"q":"pretectal nucleus","a":"視蓋前域核。対光反射の中継"},{"q":"facial colliculus","a":"顔面神経丘。第四脳室床のふくらみ、下に外転神経核"},{"q":"Dorello's canal","a":"ドレロ管。CN VI が斜台で硬膜をくぐる管"},{"q":"cavernous sinus","a":"海綿静脈洞。蝶形骨の両脇、ICA と眼球運動神経が通る"},{"q":"superior orbital fissure","a":"上眼窩裂。III・IV・V1・VI が眼窩へ入る"},{"q":"PPRF","a":"Paramedian pontine reticular formation、橋の水平注視中枢"},{"q":"frontal eye field","a":"前頭眼野、Brodmann area 8"},{"q":"convergence","a":"輻輳。近くを見るとき両目が寄る"},{"q":"miosis / mydriasis","a":"縮瞳 / 散瞳"}],"facts":[{"q":"外側直筋を支配する神経","a":"CN VI"},{"q":"上斜筋を支配する神経","a":"CN IV"},{"q":"内側直筋を支配する神経","a":"CN III"},{"q":"下斜筋を支配する神経","a":"CN III"},{"q":"上眼瞼挙筋を支配する神経","a":"CN III"},{"q":"上斜筋の作用","a":"目を下・外へ(down and out)"},{"q":"CN III 核の高さ","a":"中脳、上丘レベル"},{"q":"CN IV 核の高さ","a":"中脳、下丘レベル"},{"q":"CN VI 核の場所","a":"橋、第四脳室床(facial colliculus の下)"},{"q":"facial colliculus を作るもの","a":"外転神経核と、それを回る顔面神経の線維"},{"q":"III・IV・VI 核をつなぐ線維束","a":"MLF"},{"q":"CN III の副交感の核","a":"Edinger-Westphal nucleus"},{"q":"EW核の線維が乗り換える神経節","a":"Ciliary ganglion"},{"q":"毛様体神経節から眼球へ行く神経","a":"Short ciliary nerves"},{"q":"EW核の線維の最終標的2つ","a":"瞳孔括約筋と毛様体筋"},{"q":"CN III の副交感線維は神経のどこを走る","a":"表面(内側寄り)"},{"q":"CN III が出る場所","a":"脚間窩"},{"q":"CN III が挟まれて通る2本の動脈","a":"上の PCA と下の SCA"},{"q":"CN III のすぐ内側にある交通動脈","a":"PCoA(後交通動脈)"},{"q":"PCoA 動脈瘤による CN III 圧迫で最初に出る症状","a":"散瞳(瞳孔が開く)"},{"q":"CN III が眼窩に入る孔","a":"上眼窩裂"},{"q":"CN IV が交叉する場所","a":"上髄帆(superior medullary velum)"},{"q":"CN IV が脳幹から出る場所","a":"背側、下丘のすぐ下"},{"q":"CN VI が脳幹から出る場所","a":"橋延髄溝(pontomedullary sulcus)"},{"q":"CN VI が硬膜をくぐる管","a":"Dorello's canal"},{"q":"海綿静脈洞の「内部」を通る神経","a":"CN VI(ICA の外側)"},{"q":"海綿静脈洞の外側壁を通る神経","a":"III・IV・V1・V2"},{"q":"対光反射の中継核","a":"Pretectal nucleus"},{"q":"対光反射で通らない構造","a":"外側膝状体"},{"q":"片目に光で両目が縮む理由","a":"視蓋前域核が左右両方の EW核に投射するから"},{"q":"近見反射の3要素","a":"輻輳・水晶体が厚くなる・縮瞳"},{"q":"瞳孔散大筋を支配する系","a":"交感神経"},{"q":"交感神経の瞳孔路で乗り換える神経節","a":"上頸神経節(superior cervical ganglion)"},{"q":"Horner 症候群の4徴","a":"縮瞳・眼瞼下垂・眼球陥凹・顔の無汗"},{"q":"水平注視中枢","a":"PPRF(橋)"},{"q":"右の前頭眼野は両目をどちらへ向ける","a":"左"}]},{"title":"3 三叉神経と顔面神経","secs":[{"title":"CN V","cards":[{"q":"Trigeminal nerveの4核と機能は?","a":"Mesencephalic n.(proprioception)、main (principal) sensory n.(light touch)、spinal trigeminal n.(pain・temperature)、motor n.(咀嚼筋)","s":2},{"q":"Gasser's ganglionの別名と位置は?","a":"Trigeminal (semilunar) ganglion。petrous apex上のMeckel's cave内","s":1},{"q":"3枝と頭蓋底の孔は?","a":"V1 ophthalmic:superior orbital fissure。V2 maxillary:foramen rotundum。V3 mandibular:foramen ovale","s":2,"n":"Standing Room Only:V1 Superior orbital fissure, V2 foramen Rotundum, V3 foramen Ovale"},{"q":"V1の3枝は?","a":"Frontal(最大)、nasociliary、lacrimal(最小)","s":0},{"q":"CN Vは脳幹のどこから出る?","a":"Ponsの外側面(middle cerebellar peduncleとの境)","s":0},{"q":"Motor rootが支配する筋は?","a":"Masticatory muscles、tensor veli palatini、tensor tympani、mylohyoid、anterior belly of digastric","s":0},{"q":"Proprioceptionの1st order neuronはどこ?","a":"Mesencephalic nucleus(Gasser's ganglionではない。解剖学的にはganglion)","s":0},{"q":"Trigeminal lemniscusとは?","a":"Main sensory nucleusからの2nd order fibers。交叉してmedial lemniscusに沿って上行しVPMへ。顔の触覚","s":2},{"q":"Trigeminothalamic tractとは?","a":"Spinal trigeminal nucleusからの2nd order fibers。交叉してVPMへ。顔の痛覚・温度覚","s":0},{"q":"三叉神経感覚核内のsomatotopyは?","a":"逆転している:V1(眼)が腹側、V3が背側。spinal nucleusは口周囲が吻側、顔周辺が尾側(onion-skin)","s":1},{"q":"CN Vに関連する反射は?","a":"Corneal reflex:求心V1(nasociliary)、遠心VII、両側閉眼。Jaw-jerk reflex:求心も遠心もV3、mesencephalic n. → motor n.の単シナプス","s":2}]},{"title":"CN VII","cards":[{"q":"Facial nerveの核は?","a":"Motor nucleus(caudal pons)、superior salivatory nucleus(副交感)、solitary tract nucleus(味覚)","s":2},{"q":"Facial nerveの経路(internal acoustic meatusまで)は?","a":"Motor fibersがabducens nucleusを回る(internal genu)→ bulbopontine sulcus外側部でnervus intermediusと共に出る(VIIIの内側)→ cerebellopontine angle → internal acoustic meatus(VIIIと共に、falciform crestの上前方)","s":2},{"q":"Internal acoustic meatus以降は?","a":"Facial canal:labyrinthine segment → geniculate ganglion(external genu)→ tympanic segment → mastoid segment → stylomastoid foramen → parotid gland内で5枝","s":2,"n":"耳下腺内の5枝:To Zanzibar By Motor Car(Temporal, Zygomatic, Buccal, Marginal mandibular, Cervical)"},{"q":"Facial nerveはどの孔から頭蓋を出る?","a":"Stylomastoid foramen","s":1},{"q":"Facial canal内で出る3枝は?","a":"Greater superficial petrosal nerve(geniculate ganglionから)、nerve to stapedius、chorda tympani","s":0},{"q":"顔面神経に関係するgangliaは?","a":"Geniculate(感覚)、pterygopalatineとsubmandibular(副交感)","s":1},{"q":"Lacrimal glandへの経路は?","a":"Superior salivatory n. → nervus intermedius → greater superficial petrosal n. → pterygopalatine ganglion → lacrimal gland","s":1},{"q":"Salivationの経路は?","a":"Superior salivatory n. → nervus intermedius → chorda tympani → submandibular ganglion → submandibularとsublingual glands","s":1},{"q":"味覚を運ぶ顔面神経の枝は?","a":"Chorda tympani(舌前2/3)→ geniculate ganglion → nervus intermedius → solitary tract nucleus","s":1},{"q":"顔面神経核への皮質支配は?","a":"上顔面を支配する部分は両側皮質から、下顔面の部分は対側皮質のみ","s":1},{"q":"Centralとperipheral facial palsyの違いは?","a":"Central(上位):対側の下顔面のみ麻痺、額は保たれる。Peripheral(下位):同側の顔半分全体","s":1}]}],"rev":[1],"lesson":[{"h":"今日学ぶこと","b":["今日は、顔を担当する2本の脳神経を学ぶ。","CN V(trigeminal nerve、三叉神経)は、顔の感覚と、噛む筋の運動を担当する。","CN VII(facial nerve、顔面神経)は、表情の筋の運動、涙と唾液の分泌、舌の前の方の味覚を担当する。","役割が似ていて混同しやすいので、「感覚の V、表情の VII」と大きく分けてから細部に入る。"]},{"h":"三叉神経の名前と全体の形","b":["三叉神経は脳神経の中でいちばん太い。橋の外側面から出る。","出てすぐ、太い感覚の根と、細い運動の根に分かれている。感覚の根は前へ進み、少しふくらんだ所に入る。このふくらみが trigeminal ganglion(三叉神経節)で、発見者の名前から Gasser 神経節(Gasserian ganglion)ともいう。","三叉神経節は、側頭骨の先端(錐体尖)の上にある、硬膜(脳を包む硬い膜)のくぼみの中に収まっている。このくぼみを Meckel's cave(メッケル腔)という。","三叉神経節から先は、3本の枝に分かれる。3つに分かれた神経なので「三叉」。"]},{"h":"神経節とは何か(感覚の場合)","b":["Day 1 では、副交感神経の「乗り換え駅」として神経節を学んだ。感覚の神経にも神経節があるが、役割が違う。","感覚の神経細胞は、体の表面で感じた情報を脳へ運ぶ。この神経細胞の細胞体は、脳の中ではなく、脳のすぐ外の神経の途中に集まっている。この細胞体の集まりを感覚の神経節という。","感覚の神経節では乗り換えは起こらない。細胞体から2本の突起が出て、1本は顔の皮膚へ、もう1本は脳幹の中へ伸びる。顔で感じた情報は、細胞体を素通りしてそのまま脳幹へ届く。この細胞を1次ニューロン(最初の神経細胞)という。","三叉神経節は、顔の感覚の1次ニューロンの細胞体の集まり。"]},{"h":"3本の枝と、頭蓋骨を出る穴","b":["3本の枝は、顔を上・中・下の3つの帯に分けて担当する。それぞれ頭蓋骨の別の穴を通って顔へ出る。","V1 ophthalmic nerve(眼神経):いちばん上の枝。額、上まぶた、目の表面(角膜)、鼻の背中を担当する。眼窩の奥のすき間 superior orbital fissure(上眼窩裂)を通る。眼窩の中で、frontal nerve(前頭神経、いちばん太い)、nasociliary nerve(鼻毛様体神経)、lacrimal nerve(涙腺神経、いちばん細い)の3本に分かれる。","V2 maxillary nerve(上顎神経):真ん中の枝。頬、下まぶた、上唇、上の歯を担当する。丸い穴 foramen rotundum(正円孔)を通る。","V3 mandibular nerve(下顎神経):いちばん下の枝。下顎、下唇、下の歯、舌の前の方の触覚や痛み(味覚ではない)を担当する。楕円形の穴 foramen ovale(卵円孔)を通る。運動の根は V3 に合流するので、噛む筋への運動線維は V3 にだけ含まれる。","覚え方:Standing Room Only(上から Superior orbital fissure、Rotundum、Ovale)。"]},{"h":"三叉神経の4つの核","b":["三叉神経の情報は、脳幹の4つの核で扱われる。3つが感覚の核、1つが運動の核。","感覚の核は、感覚の種類ごとに分かれていて、脳幹の上から下まで縦に細長く並ぶ(Day 1)。","- mesencephalic nucleus(中脳路核):中脳にある。噛む筋がどれだけ伸びているかの感覚、つまり顎の位置の感覚を扱う。","- main sensory nucleus(主感覚核):橋にある。顔の触覚を扱う。","- spinal trigeminal nucleus(脊髄路核):延髄から上部頸髄にかけて下に伸びる。顔の痛みと温度を扱う。","運動の核は motor nucleus(三叉神経運動核)。橋にあり、噛む筋を動かす(次のページ)。"]},{"h":"中脳路核は特別な核","b":["前のページで、感覚の1次ニューロンの細胞体は脳の外の神経節にあると学んだ。ところが、顎の位置の感覚を運ぶ1次ニューロンだけは例外で、細胞体が脳の中(中脳路核)にある。","つまり中脳路核は、核という名前だが、中身は神経節と同じ「1次ニューロンの細胞体の集まり」。脳の中に入り込んだ神経節のようなもの、と考えるとよい。","試験では「顎の位置の感覚の1次ニューロンはどこにあるか」と聞かれることがある。答えは三叉神経節ではなく中脳路核。"]},{"h":"三叉神経が動かす筋","b":["三叉神経運動核から出た線維は、運動の根を通って V3 に合流し、次の筋を動かす。Day 1 で学んだ鰓弓運動の筋(咽頭弓から生まれた筋)。","- 噛む筋(masticatory muscles、咀嚼筋):咬筋、側頭筋、内側翼突筋、外側翼突筋。顎を閉じたり、横にずらしたりする。","- tensor tympani(鼓膜張筋):中耳にあり、鼓膜を張る。","- tensor veli palatini(口蓋帆張筋):のどの奥の柔らかい天井(軟口蓋)を張り、耳管を開く。あくびで耳が抜けるのはこの筋の働き。"]},{"h":"顔の感覚が大脳に届くまで","b":["顔で感じた情報が大脳まで届く道を、感覚の種類ごとに追う。","触覚の場合:","1. 顔の皮膚で触れる。","2. 1次ニューロン(細胞体は三叉神経節)が、橋の主感覚核まで情報を運ぶ。","3. 主感覚核の神経細胞(2次ニューロン)が軸索を伸ばす。軸索は正中を越えて反対側へ渡り、上へ向かう。この線維の束を trigeminal lemniscus(三叉毛帯)という。毛帯(lemniscus)はリボンの意味で、平たい線維の束を指す。","4. 視床の VPM(ventral posteromedial nucleus、後内側腹側核)に届く。視床は、ほとんどの感覚が大脳へ行く前に必ず立ち寄る中継所(Day 9)。","5. 視床の神経細胞(3次ニューロン)が、大脳の中心後回の、顔を担当する場所へ情報を送る。","痛みと温度の場合は、2番で届く核が延髄の脊髄路核になり、3番の線維の束を trigeminothalamic tract(三叉神経視床路)と呼ぶ。それ以外は同じ。","体(首から下)の感覚は視床の VPL に行き、顔の感覚は VPM に行く。覚え方:VPM の M は Mouth(口、つまり顔)。"]},{"h":"三叉神経が関わる2つの反射","b":["角膜反射(corneal reflex):片方の目の表面(角膜)に綿などで軽く触れると、両方の目が閉じる。","1. 角膜で感じた情報は V1(鼻毛様体神経)で橋へ運ばれる。","2. 橋で、左右両方の顔面神経核に信号が送られる。","3. 顔面神経(CN VII)が、目を閉じる筋(眼輪筋)を動かす。","感覚の入り口は V、命令の出口は VII。左右両方の顔面神経核に送られるので、触った側だけでなく反対の目も閉じる。","下顎反射(jaw-jerk reflex):口を軽く開けて下顎を上からたたくと、顎がわずかに閉じる。","1. 噛む筋が急に引き伸ばされ、その情報が V3 で運ばれる。","2. 中脳路核から三叉神経運動核へ伝わる。","3. 運動核から V3 で噛む筋に命令が出て、筋が縮む。","入り口も出口も V。"]},{"h":"顔面神経の全体像","b":["CN VII(facial nerve、顔面神経)は、4つの仕事をする。","1. 表情の筋を動かす(いちばん大きな仕事)。","2. 涙を出す。","3. 顎の下と舌の下の唾液腺から唾液を出す。","4. 舌の前の3分の2の味覚を脳へ運ぶ。","1番は鰓弓運動、2番と3番は副交感神経、4番は味の感覚。1本の神経に、この3種類の線維がまとめられている。","それぞれ脳幹の別の核から出発する。","- 表情の筋への線維:橋の下部にある facial motor nucleus(顔面神経核)から。","- 涙と唾液への線維:橋にある superior salivatory nucleus(上唾液核)から。Day 1 で学んだ副交感の核の1つ。","- 味覚の線維:延髄の solitary nucleus(孤束核)へ届く。Day 1 で学んだ、内臓と味の感覚の核。"]},{"h":"顔面神経の2つの根","b":["顔面神経は、脳幹を出るとき2本の根に分かれている。","太い方は運動の根で、表情の筋への線維だけが入っている。","細い方は nervus intermedius(中間神経)と呼ばれ、涙と唾液への副交感の線維と、味覚の線維が入っている。運動の根と、すぐ外側を走る CN VIII(内耳神経)の「中間」にあるので、この名前がついた。","2本の根は、このあとすぐ1本にまとまる。"]},{"h":"顔面神経の、脳幹から内耳道まで","b":["表情の筋への線維は、顔面神経核を出ると、まず後ろへ向かう。第四脳室の床に近い所で、外転神経核の後ろをぐるりと回り込み、それから前へ向きを変えて進む。この回り込む曲がり角を internal genu(内膝)という。この線維が第四脳室の床に顔面神経丘のふくらみを作る(Day 2)。","前へ進んだ線維は、橋と延髄の境の溝の外側寄りから脳幹の外へ出る。このとき、すぐ外側に CN VIII が並んでいる。","顔面神経と CN VIII は一緒に進み、頭蓋骨の側頭骨にあいた穴 internal acoustic meatus(内耳道)に入る。"]},{"h":"顔面神経の、骨の中の道","b":["内耳道の奥で、顔面神経は CN VIII と別れ、側頭骨の中を通る細い骨のトンネル facial canal(顔面神経管)に入る。","顔面神経管の中で、神経はほぼ直角に後ろへ曲がる。この曲がり角を external genu(外膝)といい、ここに geniculate ganglion(膝神経節)がある。膝神経節は、味覚の1次ニューロンの細胞体の集まり(感覚の神経節)。","曲がったあとは、中耳(鼓膜の奥の空間)の内側の壁に沿って後ろへ進み、さらに下へ向きを変えて下る。","最後に、耳の後ろ下の骨の小さな穴 stylomastoid foramen(茎乳突孔)から頭蓋骨の外へ出る。","外へ出た神経は、耳の前にある耳下腺の中を通り抜けながら5本に分かれ、顔の表情筋に広がる。5本は上から、側頭枝・頬骨枝・頬筋枝・下顎縁枝・頸枝。"]},{"h":"骨の中で出る3本の枝","b":["顔面神経管の中で、顔面神経は3本の枝を出す。表情筋以外の仕事は、この3本が受け持つ。","1. greater superficial petrosal nerve(大錐体神経):膝神経節から前へ出る。中身は涙への副交感の線維。翼口蓋窩(上顎の奥の深い所)にある pterygopalatine ganglion(翼口蓋神経節)で乗り換え、涙腺に届いて涙を出させる。","2. nerve to stapedius(アブミ骨筋神経):中耳の小さな骨(アブミ骨)についた筋を動かす。大きな音がすると縮んで、音が内耳に強く伝わりすぎないようにする。","3. chorda tympani(鼓索神経):茎乳突孔の少し上で出て、中耳の中を横切り(鼓膜の裏を通るので「鼓」の字がつく)、頭蓋骨を出て、舌の感覚を担当する V3 の枝(舌神経)に合流する。中身は2種類。","- 舌の前3分の2の味覚の線維。舌から脳へ向かう。","- 唾液への副交感の線維。顎の下の submandibular ganglion(顎下神経節)で乗り換え、顎下腺と舌下腺に届く。"]},{"h":"中枢性と末梢性の顔面麻痺","b":["表情の筋を動かす命令は、大脳皮質から出て、皮質核路(Day 1)を通って顔面神経核へ届く。","顔面神経核のうち、上の顔(額や目の周り)を担当する部分は、左右両方の大脳皮質から命令を受ける。下の顔(口の周り)を担当する部分は、反対側の大脳皮質からだけ命令を受ける。","この違いで、どこが壊れたかによって麻痺の出方が変わる。","中枢性麻痺(大脳皮質や、皮質から顔面神経核までの道が壊れた場合):反対側の顔の下半分だけが動かなくなる。上半分は、壊れていない側の皮質からも命令が来るので動く。額にしわを寄せられる。脳梗塞などで起こる。","末梢性麻痺(顔面神経核そのものか、顔面神経が壊れた場合):同じ側の顔全体が動かなくなる。額にもしわが寄らない。Bell 麻痺(原因不明の顔面神経麻痺)などで起こる。","額が動くかどうかが、見分けるポイント。"]}],"terms":[{"q":"trigeminal nerve","a":"CN V、三叉神経"},{"q":"trigeminal ganglion","a":"Gasser 神経節(半月神経節)。Meckel's cave 内"},{"q":"Meckel's cave","a":"錐体尖上の硬膜のくぼみ、三叉神経節が入る"},{"q":"V1 ophthalmic","a":"眼神経。上眼窩裂"},{"q":"V2 maxillary","a":"上顎神経。正円孔"},{"q":"V3 mandibular","a":"下顎神経。卵円孔。運動線維も含む"},{"q":"mesencephalic nucleus","a":"三叉神経中脳路核。固有感覚"},{"q":"main sensory nucleus","a":"三叉神経主感覚核(橋)。触覚"},{"q":"spinal trigeminal nucleus","a":"三叉神経脊髄路核。痛覚・温度覚"},{"q":"trigeminal lemniscus","a":"三叉毛帯。主感覚核から VPM へ"},{"q":"VPM","a":"視床後内側腹側核。顔の感覚と味覚"},{"q":"corneal reflex","a":"角膜反射。求心 V1、遠心 VII"},{"q":"jaw-jerk reflex","a":"下顎反射。求心も遠心も V3"},{"q":"facial nerve","a":"CN VII、顔面神経"},{"q":"nervus intermedius","a":"中間神経。VII の副交感と味覚の線維"},{"q":"superior salivatory nucleus","a":"上唾液核。VII の副交感"},{"q":"solitary nucleus","a":"孤束核。味覚と内臓感覚"},{"q":"internal acoustic meatus","a":"内耳道。VII と VIII が入る"},{"q":"facial canal","a":"顔面神経管。側頭骨内の骨の管"},{"q":"geniculate ganglion","a":"膝神経節。VII の感覚(味覚)の神経節"},{"q":"stylomastoid foramen","a":"茎乳突孔。VII が頭蓋を出る孔"},{"q":"greater superficial petrosal nerve","a":"大錐体神経。涙腺への副交感"},{"q":"chorda tympani","a":"鼓索神経。舌前2/3の味覚と顎下腺・舌下腺への副交感"},{"q":"pterygopalatine ganglion","a":"翼口蓋神経節。涙腺へ"},{"q":"submandibular ganglion","a":"顎下神経節。顎下腺・舌下腺へ"}],"facts":[{"q":"CN V が脳幹から出る場所","a":"橋の外側面"},{"q":"三叉神経節の別名","a":"Gasser 神経節(semilunar ganglion)"},{"q":"三叉神経節がある場所","a":"Meckel's cave(錐体尖の上)"},{"q":"V1 の出口","a":"上眼窩裂"},{"q":"V2 の出口","a":"正円孔(foramen rotundum)"},{"q":"V3 の出口","a":"卵円孔(foramen ovale)"},{"q":"運動線維を含む枝","a":"V3 だけ"},{"q":"V1 の3枝","a":"Frontal・nasociliary・lacrimal"},{"q":"V1 の最大の枝","a":"Frontal nerve"},{"q":"三叉神経で固有感覚を担う核","a":"Mesencephalic nucleus"},{"q":"三叉神経で触覚を担う核","a":"Main (principal) sensory nucleus"},{"q":"三叉神経で痛覚・温度覚を担う核","a":"Spinal trigeminal nucleus"},{"q":"固有感覚の1次ニューロンの細胞体の場所","a":"中脳路核(Gasser 神経節ではない)"},{"q":"三叉神経運動核が支配する代表の筋","a":"咀嚼筋(咬筋・側頭筋・翼突筋)"},{"q":"顔の触覚の2次線維の名前","a":"Trigeminal lemniscus"},{"q":"顔の感覚が中継される視床核","a":"VPM"},{"q":"体の感覚が中継される視床核","a":"VPL"},{"q":"角膜反射の求心路","a":"V1(nasociliary nerve)"},{"q":"角膜反射の遠心路","a":"CN VII"},{"q":"下顎反射の求心路と遠心路","a":"どちらも V3"},{"q":"顔面神経の3核","a":"Motor nucleus・上唾液核・孤束核"},{"q":"顔面神経の副交感の核","a":"Superior salivatory nucleus"},{"q":"顔面神経の味覚が届く核","a":"Solitary nucleus"},{"q":"副交感と味覚を運ぶ細い根","a":"Nervus intermedius"},{"q":"顔面神経が脳幹内で回り込む核","a":"外転神経核(internal genu)"},{"q":"顔面神経が出る場所","a":"橋延髄溝の外側部(VIII の内側)"},{"q":"VII と VIII が入る孔","a":"内耳道(internal acoustic meatus)"},{"q":"顔面神経が通る骨の管","a":"Facial canal"},{"q":"顔面神経管で曲がる所にある神経節","a":"Geniculate ganglion"},{"q":"顔面神経が頭蓋を出る孔","a":"茎乳突孔(stylomastoid foramen)"},{"q":"耳下腺内で分かれる枝の数","a":"5本"},{"q":"膝神経節から出る枝","a":"Greater superficial petrosal nerve"},{"q":"大錐体神経の乗り換え駅と標的","a":"翼口蓋神経節 → 涙腺"},{"q":"舌の前2/3の味覚を運ぶ枝","a":"Chorda tympani"},{"q":"鼓索神経の乗り換え駅と標的","a":"顎下神経節 → 顎下腺・舌下腺"},{"q":"アブミ骨筋の役割","a":"大きな音で耳小骨の動きを抑える"},{"q":"顔面神経核の上半分の皮質支配","a":"両側"},{"q":"顔面神経核の下半分の皮質支配","a":"反対側だけ"},{"q":"中枢性顔面麻痺の特徴","a":"反対側の顔の下半分だけ、額は動く"},{"q":"末梢性顔面麻痺の特徴","a":"同じ側の顔全体、額も動かない"}]},{"title":"4 VIII〜XII、嗅神経、副交感神経、第4脳室底","secs":[{"title":"聴覚路","cards":[{"q":"聴覚路の1st order neuronは?","a":"Spiral ganglionの細胞。末梢突起はorgan of Corti、中枢突起がcochlear nerve","s":1},{"q":"聴覚路を順に","a":"Cochlear nuclei → (trapezoid bodyで交叉)superior olivary nucleus → lateral lemniscus → inferior colliculus → brachium of inferior colliculus → medial geniculate body → auditory radiation(sublentiform part)→ Heschl's gyrus (41, 42)","s":1},{"q":"聴覚は同側・対側のどちらに投射?","a":"Bilateral。cochlear nucleiより上は両側性なので、一側の中枢病変では聾にならない","s":1},{"q":"聴覚を受ける皮質の名前は?","a":"Primary auditory cortex = Heschl's gyrus(areas 41, 42)。周囲がWernicke's area (22)","s":1}]},{"title":"CN I(嗅覚)","cards":[{"q":"Olfactory pathwayの1st・2nd order neuronは?","a":"1st:nasal epitheliumのreceptor neurons(fila olfactoriaがcribriform plateを通る)。2nd:olfactory bulbのmitral cells(→ olfactory tract)","s":0},{"q":"Lateral / medial olfactory striaの行き先は?","a":"Lateral:primary olfactory cortex(piriform cortex、uncus)。Medial:anterior commissureを経て対側へ。thalamusを経由しない","s":0}]},{"title":"CN VIIIと味覚","cards":[{"q":"味覚を担う神経と核は?","a":"VII(舌前2/3)、IX(後1/3)、X(epiglottis)→ solitary nucleusの吻側部 → VPM → insula・frontal operculum","s":0},{"q":"CN VIIIの3部とgangliaは?","a":"Superior vestibular、inferior vestibular、cochlear。vestibular (Scarpa's) ganglionとspiral ganglion","s":0},{"q":"聴覚器の構造は?","a":"Cochlea:modiolusの周りを2回転半。受容器はorgan of Cortiのhair cells。spiral ganglionはRosenthal's canal内","s":1},{"q":"Vestibular systemの受容器は?","a":"Semicircular canalsのampullaにあるcrista ampullaris(回転加速度)と、utricle・sacculeのotolith organs(直線加速度・重力)","s":1},{"q":"Vestibular nucleiの投射先は?","a":"同側flocculonodular lobe(inferior cerebellar peduncle)、両側VP thalamus → cortex、III・IV・VI核(MLF)、脊髄(lateral / medial vestibulospinal tracts)","s":1}]},{"title":"CN IX–XII","cards":[{"q":"CN IXの成分と核は?","a":"Nucleus ambiguus(stylopharyngeus)、inferior salivatory n.(parotid、otic ganglion経由)、solitary n.(舌後1/3の味覚と感覚、carotid body / sinus)、spinal trigeminal n.(耳の皮膚)","s":0},{"q":"Parotid glandへの経路は?","a":"Inferior salivatory n. → IX → tympanic nerve → lesser petrosal nerve → otic ganglion → auriculotemporal nerve → parotid","s":0},{"q":"Carotid body / sinusからの経路は?","a":"Carotid sinus nerve (IX) → inferior glossopharyngeal ganglion → solitary tract nucleus","s":0},{"q":"嚥下の神経と核は?","a":"IXとX。運動はnucleus ambiguus(pharynx・larynxの横紋筋)","s":1},{"q":"なぜnucleus ambiguusと呼ぶ?","a":"Reticular formation内で境界が不明瞭(ambiguous)で、組織学的に同定しにくいから","s":1},{"q":"CN Xの核は?","a":"Nucleus ambiguus(branchiomotor)、dorsal motor nucleus(副交感、vagal trigone)、solitary n.(内臓感覚・味覚)、spinal trigeminal n.(耳)","s":0},{"q":"CN Xの出口とganglia、頸部の位置は?","a":"Retro-olivary sulcusから出てjugular foramenへ。superior / inferior ganglia。carotid sheath内でICAとIJVの間","s":0},{"q":"迷走神経の副交感神経節はどこ?","a":"標的臓器の壁内または近傍","s":0},{"q":"CN XIの核と支配筋は?","a":"Spinal accessory nucleus(C1–C5前角)。sternocleidomastoid(頭を対側へ回す)とtrapezius(肩をすくめる)","s":0},{"q":"CN XIIの核・出口・機能は?","a":"Hypoglossal nucleus(hypoglossal trigone)。pyramidとoliveの間のpreolivary sulcusから出てhypoglossal canalへ。genioglossusと舌内筋","s":2},{"q":"CN XII障害で舌はどちらへ偏る?","a":"障害側へ(健側genioglossusが押し出すため)","s":0},{"q":"Jugular foramenを通る神経は?","a":"IX、X、XI","s":0,"n":"日本語の定番ゴロ(脳神経12対):嗅いで視る 動く車の 三の外 顔聴く舌に 迷う副舌"}]},{"title":"Autonomic nervous system","cards":[{"q":"Sympathetic系の中枢は?","a":"脊髄T1–L2のlateral horn(intermediolateral nucleus)","s":1},{"q":"Sympathetic系の構成は?","a":"短いpreganglionic fiber → white ramus communicans → sympathetic trunkのparavertebral ganglion(またはsplanchnic nervesでprevertebral ganglion)→ 長いpostganglionic fiber → gray ramusでspinal nerveへ、または動脈に沿う","s":1},{"q":"Parasympathetic系の中枢は?","a":"Craniosacral:脳幹(CN III・VII・IX・Xの核)と脊髄S2–S4","s":1},{"q":"仙髄副交感の経路と標的は?","a":"S2–S4 → pelvic splanchnic nerves → 骨盤臓器壁のganglia。膀胱detrusorの収縮、internal sphinctersの弛緩、直腸、勃起","s":1},{"q":"両系の違いは?","a":"Para:preが長くpostが短い、gangliaは標的近く、postもACh(muscarinic)。Symp:preが短くpostが長い、postはnorepinephrine。preはどちらもACh(nicotinic)","s":0},{"q":"Somatic motor系との違いは?","a":"Somaticは1ニューロンで骨格筋へ。自律系は2ニューロン(pre- / postganglionic)で平滑筋・心筋・腺へ","s":0},{"q":"頭部の4つの副交感gangliaと神経は?","a":"Ciliary (III)、pterygopalatine (VII)、submandibular (VII)、otic (IX)","s":0,"n":"COPS:Ciliary (III), Otic (IX), Pterygopalatine (VII), Submandibular (VII)"}]}],"rev":[2,0],"lesson":[{"h":"今日学ぶこと","b":["今日は、残りの脳神経をまとめて学ぶ。","- CN VIII(内耳神経):聞く、体のバランスを感じる。","- CN IX(舌咽神経)と CN X(迷走神経):のど、唾液、味、内臓。","- CN XI(副神経):首と肩の筋。","- CN XII(舌下神経):舌の筋。","- CN I(嗅神経):においを感じる。","最後に、ここまでに出てきた副交感神経を整理し、第四脳室の床に並ぶ核の地図を完成させる。"]},{"h":"延髄から出る4本の神経の出口","b":["延髄の前面には、正中の両側に縦長の pyramid(錐体)、その外側に楕円形の olive(オリーブ)がある(Day 1)。","- CN XII は、錐体とオリーブの間の溝から、細い根の列として出る。","- CN IX・X・XI は、オリーブの後ろの溝から、上から順に細い根の列として出る。","頭蓋骨を出る穴も決まっている。IX・X・XI の3本は、そろって jugular foramen(頸静脈孔)を通る。頸静脈孔は、脳から出る静脈(内頸静脈)が通る穴でもある。XII だけは別の hypoglossal canal(舌下神経管)を通る。"]},{"h":"のどの筋を動かす核:疑核","b":["飲み込む(嚥下)ときと、声を出す(発声)ときには、のどの奥の咽頭と、声帯のある喉頭の筋が働く。これらは咽頭弓から生まれた筋(Day 1 の鰓弓運動)。","これらの筋を動かす核は、延髄の nucleus ambiguus(疑核)。CN IX と CN X の運動の線維はここから出る。","ambiguus はラテン語で「あいまいな」という意味。この核は神経細胞がまとまらずに網様体の中に散らばっていて、顕微鏡で見ても境目がはっきりしない。そのためこの名前がついた。","疑核が壊れると、飲み込みにくくなり(むせる)、声がかすれる。"]},{"h":"舌咽神経(CN IX)の仕事","b":["舌咽神経は、名前のとおり舌と咽頭を担当する。中には4種類の線維が入っている。","1. 運動:疑核から出て、咽頭を持ち上げる小さな筋(茎突咽頭筋)を動かす。","2. 副交感:耳の前にある大きな唾液腺(parotid gland、耳下腺)から唾液を出させる(次のページ)。","3. 感覚:舌の後ろ3分の1と、咽頭の粘膜の感覚。舌の後ろ3分の1の味覚もここに含まれる。","4. 血圧と血液の状態の情報:首の頸動脈が内頸動脈と外頸動脈に分かれる所にある2つのセンサーから情報を運ぶ。","- carotid sinus(頸動脈洞):動脈の壁がわずかにふくらんだ所で、壁の伸び具合から血圧を感じる。","- carotid body(頸動脈小体):分かれ目にある米粒ほどの小さな器官で、血液中の酸素と二酸化炭素の量を感じる。","3番と4番の情報は、延髄の孤束核(Day 1)に届く。この情報をもとに、脳幹が血圧や呼吸を自動で調節する。"]},{"h":"耳下腺へ唾液の命令が届くまで","b":["耳下腺への副交感の命令は、次の順に届く。","1. 延髄の inferior salivatory nucleus(下唾液核)の神経細胞が軸索を伸ばす。","2. 軸索は CN IX の中を通って頭蓋骨を出る。","3. すぐに CN IX から分かれ、中耳の内側の壁を通る細い枝(鼓室神経)になり、さらに lesser petrosal nerve(小錐体神経)という枝になって進む。","4. 頭蓋骨の底のすぐ下にある otic ganglion(耳神経節)で乗り換える。耳の近くにあるのでこの名前。","5. 2本目の神経細胞の軸索が耳下腺に届き、唾液を出させる。"]},{"h":"迷走神経(CN X)の仕事","b":["迷走神経は、脳神経の中でいちばん遠くまで行く。首を下って胸と腹の内臓まで、あちこちへ枝を伸ばすので「迷走」という。中には4種類の線維が入っている。","1. 運動:疑核から出て、咽頭と喉頭の筋を動かす。飲み込みと発声。","2. 副交感:延髄の dorsal motor nucleus of vagus(迷走神経背側核)から出て、心臓・肺・胃腸に届く。心臓の拍動を遅くし、気管支を狭め、胃腸の動きと分泌を高める。","3. 感覚:咽頭と喉頭、胸と腹の内臓、大動脈の血圧センサーからの情報を運び、孤束核に届く。","4. 味覚:喉頭の入り口付近(喉頭蓋)の味。孤束核に届く。","迷走神経の副交感の線維が乗り換える神経節は、頭の中や首ではなく、心臓や腸など、届け先の臓器の壁の中や、そのすぐそばにある。副交感神経では一般に、1本目の軸索が長く、神経節が臓器の近くにあり、2本目の軸索は短い。","首では、迷走神経は carotid sheath(頸動脈鞘:頸動脈と頸静脈を包む筋膜の筒)の中を、内頸動脈と内頸静脈の間の後ろに挟まれて下っていく。"]},{"h":"副神経(CN XI)と舌下神経(CN XII)","b":["副神経は、首と肩の2つの筋を動かす。","- sternocleidomastoid(胸鎖乳突筋):耳の後ろから胸の骨と鎖骨へ斜めに走る筋。縮むと、頭を反対側へ回す。","- trapezius(僧帽筋):首の後ろから肩と背中に広がる筋。縮むと、肩をすくめる。","副神経の核は、延髄の下部から上部頸髄(C1〜C5)の前角にある。","舌下神経は、舌の筋を動かす。核は延髄の第四脳室の床、正中のすぐ横にある(Day 1 の体性運動の列)。","舌を前に突き出すのは genioglossus(オトガイ舌筋)。左右に1本ずつあり、それぞれ舌を前へ、そして少し反対側へ押し出す。","片側の舌下神経が壊れると、壊れていない側のオトガイ舌筋だけが舌を押す。そのため、舌を突き出すと、舌先は壊れた側へ曲がる。"]},{"h":"内耳神経(CN VIII):聞く仕組み","b":["耳の奥(内耳)には、音を感じる器官と、体のバランスを感じる器官がある。CN VIII はこの2つからの情報を運ぶので、2つの部分に分かれる。cochlear nerve(蝸牛神経)と vestibular nerve(前庭神経)。","CN VIII は、橋と延髄の境の溝の、顔面神経のすぐ外側から脳幹に入る。頭蓋骨の内耳道を、顔面神経と一緒に通る(Day 3)。","音を感じる器官は cochlea(蝸牛)。カタツムリの殻のように2回転半巻いた管で、中に organ of Corti(コルチ器)という音のセンサーが並んでいる。音の振動が蝸牛の中の液体を揺らし、コルチ器の hair cells(有毛細胞:表面に細い毛を持つ細胞)の毛が曲がると、電気信号が生まれる。","この信号を最初に受け取る1次ニューロンの細胞体は、蝸牛の中心の骨の中にある spiral ganglion(らせん神経節)に集まっている。"]},{"h":"音が大脳まで届く道","b":["1. らせん神経節の1次ニューロンが、延髄と橋の境にある cochlear nuclei(蝸牛神経核)に信号を届ける。","2. 蝸牛神経核から、線維の多くは橋で反対側へ渡り、一部は同じ側のまま、superior olivary nucleus(上オリーブ核)へ行く。上オリーブ核は、左右の耳に届いた音のわずかな時間差と強さの差を比べ、音がどちらから来たかを判断する。","3. 上オリーブ核から、lateral lemniscus(外側毛帯)という線維の束が上へ向かう。","4. 中脳の inferior colliculus(下丘)で中継される。","5. 視床の medial geniculate body(内側膝状体)で中継される。","6. 大脳の側頭葉にある Heschl's gyrus(横側頭回)、つまり primary auditory cortex(一次聴覚野)に届く。","この道は途中で何度も左右を行き来するので、片方の耳の音は左右両方の大脳に届く。そのため、片側の大脳や脳幹の上の方が壊れても、片耳が聞こえなくなることはない。"]},{"h":"内耳神経(CN VIII):バランスを感じる仕組み","b":["バランスの器官は、蝸牛のすぐ隣にあり、まとめて前庭器官と呼ぶ。2種類ある。","- semicircular canals(三半規管):3本の半円形の管が、互いにほぼ直角に並ぶ。頭が回ると、管の中の液体が遅れて流れ、根元のふくらみ(ampulla 膨大部)の中の有毛細胞を曲げる。3本が別々の向きを向いているので、うなずく、首を振る、首をかしげる、のどの回転も感じ分けられる。","- utricle(卵形嚢)と saccule(球形嚢):小さな袋で、中の有毛細胞の上に、小さな石の粒(耳石)の乗った膜がある。体が傾いたり、まっすぐ加速したりすると、耳石の重みで膜がずれて有毛細胞が曲がる。重力の向きと、まっすぐな動きを感じる。","前庭器官からの信号は前庭神経を通って、脳幹の vestibular nuclei(前庭神経核)に届く。前庭神経核は、情報を4か所へ送る。","1. 小脳:体のバランスを保つ(Day 7)。","2. 目を動かす核(MLF を通って、III・IV・VI の核へ):頭が動いても視線がぶれないようにする(Day 2)。","3. 脊髄(前庭脊髄路):姿勢を保つ筋に命令を出す(Day 5)。","4. 視床を経て大脳:自分がどう動いているかを意識する。"]},{"h":"嗅神経(CN I):においを感じる仕組み","b":["鼻の奥の天井の粘膜に、においを感じる神経細胞が並んでいる。この細胞が1次ニューロンで、空気中のにおいの分子を感じて電気信号を出す。","1次ニューロンの軸索は、細い束になって、鼻と脳を隔てる骨の薄い板(篩板:ふるいのように小さな穴がたくさんあいた板)の穴を通り抜けて頭蓋の中に入る。この細い束が、本来の嗅神経。","頭蓋に入ると、すぐ上の olfactory bulb(嗅球)に届く。嗅球は前頭葉の下面に乗った小さなふくらみ。ここで mitral cells(僧帽細胞:形が司教の帽子に似ている)という2次ニューロンに信号が渡る。","僧帽細胞の軸索は olfactory tract(嗅索)となって後ろへ進み、2本に分かれる。外側の線維(外側嗅条)が、側頭葉の内側の先端付近にある嗅覚の皮質(piriform cortex 梨状皮質)に届く。","においは、視床を通らずに大脳に届く唯一の感覚。"]},{"h":"味が脳に届く道","b":["舌の表面には、味を感じる小さな器官(味蕾)がたくさんある。舌の場所によって、味を運ぶ神経が違う。","- 舌の前3分の2:CN VII(鼓索神経を通る、Day 3)。","- 舌の後ろ3分の1:CN IX。","- 喉頭の入り口付近(喉頭蓋):CN X。","3本の神経が運んだ味の情報は、どれも延髄の孤束核の上の方の部分に集まる。そこから視床の VPM(Day 3 で学んだ、顔の感覚の中継所)を経て、大脳の島(Day 14)と、その近くの前頭葉の一部に届く。"]},{"h":"頭の副交感神経を4つに整理する","b":["Day 1〜4 で、副交感神経の経路が4本出てきた。どれも「核 → 通る神経 → 乗り換える神経節 → 届け先」の順でたどれる。","1. 目:中脳の EW 核 → CN III → 毛様体神経節 → 瞳孔括約筋と毛様体筋。瞳孔を小さくし、近くにピントを合わせる。","2. 涙:橋の上唾液核 → CN VII(大錐体神経)→ 翼口蓋神経節 → 涙腺。","3. 唾液の一部:橋の上唾液核 → CN VII(鼓索神経)→ 顎下神経節 → 顎下腺と舌下腺。","4. 唾液の残り:延髄の下唾液核 → CN IX(小錐体神経)→ 耳神経節 → 耳下腺。","これに、5つ目として、延髄の迷走神経背側核 → CN X → 臓器の壁の中の神経節 → 心臓・肺・胃腸、が加わる。","頭の4つの神経節の名前は、毛様体・翼口蓋・顎下・耳。"]},{"h":"交感神経と副交感神経の違い","b":["Day 1 で、自律神経には交感と副交感の2系統があると学んだ。ここで違いを整理する。","出発点:交感神経は、脊髄の胸から腰の上の方(T1〜L2)の、側角(Day 5)という場所の神経細胞から出る。副交感神経は、脳幹の4つの核と、脊髄のいちばん下の仙髄(S2〜S4)から出る。","神経節の位置:交感神経の神経節は、背骨のすぐ両側に、上下につながって数珠のように並ぶ(交感神経幹)。だから1本目の軸索は短く、2本目が長い。副交感神経の神経節は、届け先の臓器のそばにある。だから1本目の軸索が長く、2本目が短い。","信号を伝える物質:神経細胞は、次の細胞へ信号を渡すとき、化学物質を放出する。1本目から2本目へは、どちらの系統も acetylcholine(アセチルコリン)を使う。2本目から臓器へは、副交感神経はアセチルコリン、交感神経は noradrenaline(ノルアドレナリン)を使う。","骨格筋への神経との違い:骨格筋へは、脳幹や脊髄の神経細胞が1本で直接届く。自律神経は2本でリレーする。"]},{"h":"第四脳室の床の地図","b":["最後に、第四脳室の床(rhomboid fossa 菱形窩:ひし形のくぼみ)を上から見て、ここまでに学んだ核の場所を確かめる。","床の中央には、上下にまっすぐ走る溝(正中溝)がある。床の真ん中の高さを、横に走る細い線維の筋が何本か横切っている。これを striae medullares(髄条)といい、ここより上が橋、下が延髄の部分。","橋の部分:正中溝のすぐ横に、facial colliculus(顔面神経丘)のふくらみ。下に外転神経核がある(Day 2)。","延髄の部分:正中溝のすぐ横に、細長い三角形のふくらみ hypoglossal trigone(舌下神経三角)。下に舌下神経核がある。そのすぐ外側に、灰色がかった三角形 vagal trigone(迷走神経三角)。下に迷走神経背側核がある。","いちばん外側:床の左右の端に広がる vestibular area(前庭神経野)。下に前庭神経核がある。","Day 1 の原則どおり、正中寄りに運動の核(外転・舌下・迷走神経背側核)、外側に感覚の核(前庭神経核)が並んでいる。"]}],"terms":[{"q":"glossopharyngeal nerve","a":"CN IX、舌咽神経"},{"q":"vagus nerve","a":"CN X、迷走神経"},{"q":"accessory nerve","a":"CN XI、副神経"},{"q":"hypoglossal nerve","a":"CN XII、舌下神経"},{"q":"jugular foramen","a":"頸静脈孔。IX・X・XI が通る"},{"q":"hypoglossal canal","a":"舌下神経管。XII が通る"},{"q":"nucleus ambiguus","a":"疑核。IX・X の運動核、咽頭喉頭の筋"},{"q":"inferior salivatory nucleus","a":"下唾液核。IX の副交感、耳下腺"},{"q":"lesser petrosal nerve","a":"小錐体神経。IX の副交感を耳神経節へ"},{"q":"otic ganglion","a":"耳神経節。耳下腺へ"},{"q":"dorsal motor nucleus of vagus","a":"迷走神経背側核。X の副交感"},{"q":"carotid sinus","a":"頸動脈洞。血圧のセンサー(圧受容器)"},{"q":"carotid body","a":"頸動脈小体。血液ガスのセンサー(化学受容器)"},{"q":"genioglossus","a":"オトガイ舌筋。舌を前に突き出す"},{"q":"sternocleidomastoid","a":"胸鎖乳突筋。頭を反対側へ回す"},{"q":"trapezius","a":"僧帽筋。肩をすくめる"},{"q":"preganglionic / postganglionic","a":"節前 / 節後ニューロン"},{"q":"craniosacral","a":"副交感の起点(脳幹と仙髄 S2–S4)"},{"q":"thoracolumbar","a":"交感の起点(T1–L2)"},{"q":"organ of Corti","a":"コルチ器。聴覚の受容器"},{"q":"spiral ganglion","a":"らせん神経節。聴覚の1次ニューロン"},{"q":"superior olivary nucleus","a":"上オリーブ核。聴覚路の中継、両耳の比較"},{"q":"lateral lemniscus","a":"外側毛帯。聴覚路、下丘へ"},{"q":"inferior colliculus","a":"下丘。聴覚路の中継"},{"q":"medial geniculate body","a":"内側膝状体。聴覚の視床中継"},{"q":"semicircular canals","a":"三半規管。頭の回転を感じる"},{"q":"utricle / saccule","a":"卵形嚢 / 球形嚢。直線加速度と重力"},{"q":"olfactory bulb","a":"嗅球。mitral cells が嗅索を出す"},{"q":"mitral cells","a":"僧帽細胞。嗅覚の2次ニューロン"},{"q":"rhomboid fossa","a":"菱形窩。第四脳室の床"},{"q":"hypoglossal trigone","a":"舌下神経三角。下に舌下神経核"},{"q":"vagal trigone","a":"迷走神経三角(ala cinerea)。下に迷走神経背側核"},{"q":"striae medullares","a":"髄条。第四脳室床で橋と延髄の境"}],"facts":[{"q":"CN XII が出る溝","a":"錐体とオリーブの間"},{"q":"CN IX・X・XI が出る場所","a":"オリーブの後ろ(retro-olivary sulcus)"},{"q":"頸静脈孔を通る神経","a":"IX・X・XI"},{"q":"CN XII が通る孔","a":"舌下神経管"},{"q":"IX と X の運動核","a":"Nucleus ambiguus"},{"q":"疑核が支配する筋","a":"咽頭・喉頭の横紋筋(嚥下と発声)"},{"q":"ambiguus の名の由来","a":"網様体に埋もれ境界がはっきりしない"},{"q":"IX の副交感の核","a":"下唾液核"},{"q":"IX の副交感の乗り換え駅","a":"Otic ganglion"},{"q":"耳神経節の標的","a":"耳下腺"},{"q":"IX の副交感線維が通る神経","a":"小錐体神経(lesser petrosal nerve)"},{"q":"舌の後ろ1/3の味覚を運ぶ神経","a":"CN IX"},{"q":"頸動脈洞が感じるもの","a":"血圧"},{"q":"頸動脈小体が感じるもの","a":"血液の O2・CO2"},{"q":"頸動脈洞・小体の情報が届く核","a":"孤束核(IX 経由)"},{"q":"X の副交感の核","a":"迷走神経背側核"},{"q":"迷走神経の副交感神経節の場所","a":"標的臓器の壁の中・近く"},{"q":"頸部で迷走神経がいる場所","a":"頸動脈鞘の中、内頸動脈と内頸静脈の間"},{"q":"XI の核の場所","a":"上部頸髄 C1–C5 の前角"},{"q":"XI が支配する2筋","a":"胸鎖乳突筋と僧帽筋"},{"q":"胸鎖乳突筋の作用","a":"頭を反対側へ回す"},{"q":"舌下神経核の場所","a":"第四脳室床の hypoglossal trigone"},{"q":"舌を突き出す筋","a":"Genioglossus"},{"q":"片側 XII 麻痺で舌が向く方向","a":"麻痺した側"},{"q":"EW核の線維が乗り換える神経節","a":"毛様体神経節(→ 瞳孔括約筋)"},{"q":"涙腺への副交感の乗り換え駅","a":"翼口蓋神経節(VII)"},{"q":"顎下腺・舌下腺への乗り換え駅","a":"顎下神経節(VII)"},{"q":"耳下腺への乗り換え駅","a":"耳神経節(IX)"},{"q":"頭部の副交感神経節4つ","a":"毛様体・翼口蓋・顎下・耳"},{"q":"自律神経が体性運動と違う点","a":"2本のニューロン(節前と節後)でリレー"},{"q":"交感神経の起点","a":"脊髄 T1–L2 の側角"},{"q":"副交感神経の起点","a":"脳幹(III・VII・IX・X の核)と仙髄 S2–S4"},{"q":"交感の節前・節後の長さ","a":"節前が短く節後が長い"},{"q":"副交感の節前・節後の長さ","a":"節前が長く節後が短い"},{"q":"交感の節後の伝達物質","a":"Noradrenaline"},{"q":"副交感の節後の伝達物質","a":"Acetylcholine"},{"q":"CN VIII の2部分","a":"Cochlear(聴覚)と vestibular(平衡)"},{"q":"聴覚の受容器","a":"コルチ器の有毛細胞"},{"q":"聴覚の1次ニューロン","a":"らせん神経節"},{"q":"聴覚路で交叉が始まる中継核","a":"上オリーブ核(台形体で交叉)"},{"q":"聴覚路で下丘へ上る線維束","a":"Lateral lemniscus"},{"q":"聴覚の視床中継","a":"内側膝状体"},{"q":"一次聴覚野","a":"Heschl 回(41・42野)"},{"q":"聴覚が両側性である理由","a":"途中で何度も交叉するから"},{"q":"頭の回転を感じる器官","a":"三半規管(ampulla の crista)"},{"q":"重力と直線加速度を感じる器官","a":"卵形嚢・球形嚢(otolith organs)"},{"q":"前庭神経核の出力先4つ","a":"小脳・視床・眼球運動核(MLF)・脊髄"},{"q":"嗅覚の2次ニューロン","a":"嗅球の mitral cells"},{"q":"視床を通らない感覚","a":"嗅覚"},{"q":"嗅覚の1次皮質","a":"梨状皮質(外側嗅条の行き先)"},{"q":"舌の前2/3・後1/3・喉頭蓋の味覚の神経","a":"VII・IX・X"},{"q":"味覚が集まる核","a":"孤束核の上部"},{"q":"第四脳室床で橋と延髄を分ける線","a":"Striae medullares"},{"q":"facial colliculus の下の核","a":"外転神経核"},{"q":"hypoglossal trigone の下の核","a":"舌下神経核"},{"q":"vagal trigone の下の核","a":"迷走神経背側核"},{"q":"第四脳室床のいちばん外側の領域","a":"Vestibular area(前庭神経核)"}]},{"title":"5 脊髄","secs":[{"title":"外形と灰白質","cards":[{"q":"Spinal cordの下端は?","a":"L1–L2(conus medullaris)。その下はcauda equinaとfilum terminale","s":0},{"q":"Spinal nervesの数は?","a":"31対:8 C、12 T、5 L、5 S、1 Co。C1は運動のみ","s":0},{"q":"2つのenlargementの高さと意味は?","a":"Cervical:C5–T1(上肢、brachial plexus)。Lumbosacral:T11–S2(下肢)。四肢を支配する運動ニューロンが多い","s":1},{"q":"横断面の基本構造は?","a":"中心にH字形のgray matter(細胞体)、周囲にwhite matter(有髄線維)。anterior horn(運動)、posterior horn(感覚)、lateral horn(自律)、central canal","s":2},{"q":"Rexed laminaeの要点は?","a":"I–VI:posterior horn(I marginal、II substantia gelatinosa、III–IV nucleus proprius)。VII:intermediate zone(Clarke's column、intermediolateral n.)。VIII:interneurons。IX:motor neurons。X:central canal周囲","s":2},{"q":"痛覚伝達に関わるlaminaeは?","a":"I、II、V(spinothalamic tractの起始)","s":0},{"q":"Clarke's nucleusとは?","a":"Lamina VIIのdorsal nucleus。C8–L2 (L3)。dorsal spinocerebellar tractの起始","s":2},{"q":"Onuf's nucleusとは?","a":"S2(S1–S3)のanterior horn腹側(lamina IX)のsomatic motor neurons。pudendal nerveの起始。尿道と肛門の横紋筋括約筋(rhabdosphincters)を随意制御。guarding reflex","s":2,"n":"S2, 3, 4 keeps the poo off the floor"},{"q":"Lateral horn / intermediolateral nucleusとは?","a":"T1–L2:sympathetic preganglionic neurons。S2–S4:parasympathetic preganglionic neurons","s":2},{"q":"Anterior hornのsomatotopyは?","a":"Medial group:axialとproximal muscles(全高位)。Lateral group:四肢のdistal muscles(enlargementsのみ)。腹側がextensors、背側がflexors","s":2},{"q":"Dermatomeric organizationとは?","a":"各脊髄分節が一定の皮膚帯(dermatome)と筋群(myotome)を支配すること","s":1},{"q":"代表的なdermatomeは?","a":"C6 母指、C7 中指、C8 小指、T4 乳頭、T10 臍、L4 膝、L5 母趾、S1 足外側","s":0,"n":"T4 = teat pore(乳頭)、T10 = belly butTEN(臍)"},{"q":"脊髄の血管支配は?","a":"Anterior spinal artery(前2/3)、2本のposterior spinal arteries(後1/3)、segmental medullary arteries","s":0},{"q":"Artery of Adamkiewiczとは?","a":"最大のanterior segmental medullary artery。75%で左側、T8–L1の肋間動脈から","s":0}]},{"title":"白質とtracts","cards":[{"q":"White matterの3つのfuniculiは?","a":"Dorsal、lateral、ventral funiculi","s":2},{"q":"主な上行路と位置は?","a":"Dorsal funiculus:fasciculus gracilisとcuneatus。Lateral:lateral spinothalamic、dorsal / ventral spinocerebellar。Ventral:anterior spinothalamic。後角尖端にLissauer's tract","s":2},{"q":"主な下行路と位置は?","a":"Lateral:lateral corticospinal、rubrospinal。Ventral:anterior corticospinal、vestibulospinal、reticulospinal、tectospinal","s":2},{"q":"Fasciculus gracilisとcuneatusの違いは?","a":"Gracilis:内側、T6より下(下半身)。Cuneatus:外側、T6より上(上半身)","s":0,"n":"Gracilis = graceful legs(下肢)"},{"q":"Dorsal columnsが運ぶ感覚は?","a":"Discriminative (fine) touch、pressure、vibration、position sense(conscious proprioception)","s":1},{"q":"Spinothalamic tractが運ぶ感覚は?","a":"Lateral:painとtemperature。Anterior:crude touch","s":1},{"q":"Lissauer's tractの意義は?","a":"DRG線維が上下1〜2分節に広がって後角に入る。損傷高位のdermatomeがanesthesiaでなくhypoesthesiaになる理由","s":0},{"q":"Spinothalamic tract内のsomatotopyは?","a":"Sacralが最外側(表層)、cervicalが内側。中心性病変でsacral sparing","s":0},{"q":"Spinocerebellar tractsの機能は?","a":"Unconscious proprioceptionを同側小脳へ。dorsal(Clarke's column、非交叉、inferior peduncle)とventral(二重交叉、superior peduncle)","s":2},{"q":"Lateral corticospinal tractの特徴は?","a":"Pyramidsで交叉。随意運動、特に精細運動。somatotopyは内→外にC-T-L-S","s":1},{"q":"Anterior corticospinal tractは?","a":"Pyramidsでは交叉せず、終止高位で交叉。cervicalとupper thoracicのみ。体幹筋","s":0},{"q":"Vestibulospinal tractの起始・経路・機能は?","a":"Lateral:lateral vestibular (Deiters) nucleusから非交叉でventral funiculusを全長下行、抗重力伸筋のtoneを促進。Medial:medial nucleusから両側性にMLFを通り頸髄へ、頭頸部の姿勢","s":1},{"q":"Rubrospinal tractは?","a":"Red nucleusから交叉してlateral funiculusへ。上肢屈筋の促進","s":0}]},{"title":"脊髄症候群","cards":[{"q":"Brown-Séquard syndromeは?","a":"半側損傷。同側の運動麻痺とproprioception低下、対側の温痛覚低下。予後は良い(90%が歩行回復)","s":0},{"q":"Central cord syndromeは?","a":"頸椎過伸展。上肢優位の運動麻痺、cape状の温痛覚障害、sacral sparing","s":0},{"q":"Anterior cord syndromeは?","a":"Anterior spinal artery領域の虚血。両側の運動と温痛覚の障害、proprioceptionは保たれる。予後不良","s":0},{"q":"Conusとcauda equina syndromeの違いは?","a":"Conus:対称性、早期から括約筋障害。Cauda equina:非対称性の感覚運動障害、areflexia","s":0},{"q":"Spinal shockとは?","a":"損傷高位以下の全神経機能(反射を含む)の一過性消失。通常48時間、後にspasticity","s":0},{"q":"Cruciate paralysis (Bell)とは?","a":"C1–C2前方病変で上肢優位の麻痺。上肢のcorticospinal fibersが下肢より吻側・内側で交叉するため","s":0}]}],"rev":[3,1],"lesson":[{"h":"脊髄の外形","b":["脊髄(spinal cord)は延髄から続き、脊柱管の中を下る。大人では L1–L2 の高さで細くなって終わる(conus medullaris 脊髄円錐)。その下は神経根の束 cauda equina(馬尾)と、細い糸 filum terminale(終糸)。","脊髄は背骨より短いので、下の髄節ほど神経根が長く下へ伸びる。","脊髄神経は31対:頸8・胸12・腰5・仙5・尾1。"]},{"h":"太くなる2か所","b":["手足を動かす神経細胞が多い場所は太くなる。","- cervical enlargement(頸膨大):C5–T1、腕(腕神経叢)へ。","- lumbosacral enlargement(腰膨大):T11–S2、脚へ。"]},{"h":"輪切りにすると H の字","b":["中心に H 字(蝶の形)の gray matter(灰白質:細胞体)、その周りを white matter(白質:線維)が包む。","灰白質は3つの角に分かれる。","- anterior (ventral) horn 前角:運動。骨格筋へ行く運動ニューロン。","- posterior (dorsal) horn 後角:感覚の入口。","- lateral horn 側角:T1–L2 だけ。交感神経の節前ニューロン。","真ん中に細い central canal(中心管)。"]},{"h":"灰白質の層(Rexed laminae)","b":["灰白質を後ろから前へ I〜X の層に分ける。","- I〜VI:後角。I と II(substantia gelatinosa 膠様質)と V が痛みの中継。","- VII:中間層。Clarke's nucleus と intermediolateral nucleus(側角)がここ。","- VIII:内側の介在ニューロン。","- IX:前角の運動ニューロン。","- X:中心管の周り。"]},{"h":"覚えるべき3つの特別な核","b":["1. Clarke's nucleus(背核、lamina VII):C8–L2。下半身の筋の伸び具合を小脳へ送る dorsal spinocerebellar tract の出発点。","2. intermediolateral nucleus(側角):T1–L2 は交感、S2–S4 は副交感の節前ニューロン。","3. Onuf's nucleus(lamina IX、S2 付近):pudendal nerve(陰部神経)の出発点。肛門と尿道の外括約筋(自分の意思で締められる横紋筋)を動かす。"]},{"h":"前角の中の並び方","b":["前角の運動ニューロンは、体の中心に近い筋ほど内側にいる。","- 内側群:体幹と体の近くの筋。全部の高さにある。","- 外側群:手足の先の筋。膨大部にだけある。","- 前後では、伸筋が前、屈筋が後ろ。"]},{"h":"白質は3つの柱","b":["- dorsal funiculus(後索):上行のみ。fasciculus gracilis(薄束、内側、下半身)と fasciculus cuneatus(楔状束、外側、上半身、T6 より上にだけある)。","- lateral funiculus(側索):lateral corticospinal tract(下行、運動)、lateral spinothalamic tract(上行、痛み温度)、spinocerebellar tracts(上行、小脳へ)、rubrospinal tract(下行)。","- ventral funiculus(前索):anterior spinothalamic(粗い触覚)、anterior corticospinal、vestibulospinal、reticulospinal、tectospinal。"]},{"h":"感覚が入ってくる仕組み","b":["1次ニューロンの細胞体は dorsal root ganglion(後根神経節)にある。","皮膚や筋の受容器 → 後根神経節 → 後根から脊髄へ。","- 触覚・振動・位置覚は、同じ側の後索をそのまま上って延髄へ。","- 痛み・温度は、後角でニューロンを替え、すぐ反対側へ渡って側索(脊髄視床路)を上る。","後角の先端には Lissauer's tract があり、入ってきた線維が上下1〜2髄節に広がってから後角に入る。"]},{"h":"脊髄の血管と症候群","b":["anterior spinal artery(前脊髄動脈、1本)が前2/3、posterior spinal arteries(後脊髄動脈、2本)が後ろ1/3。下部の最大の補給路が artery of Adamkiewicz(T8–L1、多くは左)。","- Brown-Séquard:半分だけ切れる。同じ側は運動と位置覚、反対側は痛みと温度が失われる。","- central cord:首の過伸展。腕に強い麻痺、肩にマント状の温痛覚低下。","- anterior cord:前脊髄動脈の梗塞。運動と温痛覚が両側で失われ、後索の位置覚だけ残る。"]}],"terms":[{"q":"spinal cord","a":"脊髄"},{"q":"conus medullaris","a":"脊髄円錐。脊髄の下端(L1–L2)"},{"q":"cauda equina","a":"馬尾。脊髄円錐より下の神経根の束"},{"q":"filum terminale","a":"終糸。脊髄円錐から伸びる軟膜の糸"},{"q":"cervical enlargement","a":"頸膨大。C5–T1"},{"q":"lumbosacral enlargement","a":"腰膨大。T11–S2"},{"q":"gray matter","a":"灰白質。細胞体が集まる"},{"q":"white matter","a":"白質。有髄線維が集まる"},{"q":"anterior horn","a":"前角。運動ニューロン"},{"q":"posterior horn","a":"後角。感覚の入口"},{"q":"lateral horn","a":"側角。T1–L2、交感の節前ニューロン"},{"q":"central canal","a":"中心管。脳室の続き"},{"q":"Rexed laminae","a":"灰白質を後ろから前へ I〜X に分けた層"},{"q":"substantia gelatinosa","a":"膠様質(lamina II)。痛みの調節"},{"q":"Clarke's nucleus","a":"背核(lamina VII、C8–L2)。後脊髄小脳路の起始"},{"q":"intermediolateral nucleus","a":"中間外側核(側角)。自律神経の節前"},{"q":"Onuf's nucleus","a":"オヌフ核(S2)。陰部神経、外括約筋"},{"q":"funiculus","a":"索。白質の柱"},{"q":"fasciculus gracilis","a":"薄束。後索の内側、下半身"},{"q":"fasciculus cuneatus","a":"楔状束。後索の外側、上半身"},{"q":"dorsal root ganglion","a":"後根神経節。感覚の1次ニューロンの細胞体"},{"q":"Lissauer's tract","a":"後外側束。後角先端、線維が上下に広がる"},{"q":"dermatome","a":"皮膚分節。1つの髄節が支配する皮膚の帯"},{"q":"myotome","a":"筋分節。1つの髄節が支配する筋群"},{"q":"artery of Adamkiewicz","a":"アダムキーヴィッツ動脈。下部脊髄の主な補給"}],"facts":[{"q":"大人の脊髄の下端","a":"L1–L2"},{"q":"脊髄円錐より下の神経根の束","a":"Cauda equina"},{"q":"脊髄神経の総数","a":"31対(C8・T12・L5・S5・Co1)"},{"q":"運動線維だけで感覚線維をもたない脊髄神経","a":"C1"},{"q":"頸膨大の高さ","a":"C5–T1"},{"q":"腰膨大の高さ","a":"T11–S2"},{"q":"膨大部が太い理由","a":"手足を動かす運動ニューロンが多いから"},{"q":"灰白質の形","a":"H 字(蝶形)"},{"q":"運動ニューロンがある角","a":"前角"},{"q":"感覚が入る角","a":"後角"},{"q":"側角がある高さ","a":"T1–L2"},{"q":"側角に入るニューロン","a":"交感神経の節前ニューロン"},{"q":"Rexed laminae の数","a":"I〜X の10層"},{"q":"運動ニューロンの層","a":"Lamina IX"},{"q":"痛みの中継に関わる層","a":"I・II・V"},{"q":"膠様質は何層","a":"Lamina II"},{"q":"中心管の周りの層","a":"Lamina X"},{"q":"Clarke's nucleus の高さ","a":"C8–L2"},{"q":"Clarke's nucleus から出る経路","a":"Dorsal spinocerebellar tract"},{"q":"仙髄 S2–S4 の側角にあるもの","a":"副交感の節前ニューロン"},{"q":"Onuf's nucleus の高さ","a":"S2(S1–S3)"},{"q":"Onuf's nucleus から出る神経","a":"陰部神経(pudendal nerve)"},{"q":"Onuf's nucleus が動かす筋","a":"肛門・尿道の外括約筋(横紋筋)"},{"q":"前角の内側群が支配する筋","a":"体幹と体の近くの筋"},{"q":"前角の外側群がある高さ","a":"膨大部だけ"},{"q":"前角で伸筋と屈筋の前後関係","a":"伸筋が前、屈筋が後ろ"},{"q":"白質の3つの索","a":"後索・側索・前索"},{"q":"後索に入る経路の向き","a":"上行だけ"},{"q":"後索の内側の束","a":"薄束(下半身)"},{"q":"後索の外側の束","a":"楔状束(上半身)"},{"q":"楔状束がある高さ","a":"T6 より上"},{"q":"後索が運ぶ感覚","a":"触覚(識別)・振動覚・位置覚"},{"q":"外側脊髄視床路が運ぶ感覚","a":"痛覚と温度覚"},{"q":"前脊髄視床路が運ぶ感覚","a":"粗い触覚"},{"q":"外側皮質脊髄路がある索","a":"側索"},{"q":"前庭脊髄路がある索","a":"前索"},{"q":"感覚の1次ニューロンの細胞体","a":"後根神経節"},{"q":"痛み温度の線維が反対側へ渡る場所","a":"入った高さの前白交連"},{"q":"後索の線維が反対側へ渡る場所","a":"延髄(脊髄では渡らない)"},{"q":"Lissauer's tract の役割","a":"入った線維を上下1〜2髄節に広げる"},{"q":"脊髄の前2/3を養う動脈","a":"前脊髄動脈(1本)"},{"q":"脊髄の後ろ1/3を養う動脈","a":"後脊髄動脈(2本)"},{"q":"Adamkiewicz 動脈の起始の高さ","a":"T8–L1(多くは左)"},{"q":"Brown-Séquard で同じ側に失われるもの","a":"運動と位置覚・振動覚"},{"q":"Brown-Séquard で反対側に失われるもの","a":"痛覚と温度覚"},{"q":"前脊髄症候群で残る感覚","a":"位置覚・振動覚(後索)"},{"q":"中心性脊髄症候群の原因","a":"首の過伸展(狭い頸椎管)"},{"q":"C6 の dermatome","a":"母指"},{"q":"C7 の dermatome","a":"中指"},{"q":"C8 の dermatome","a":"小指"},{"q":"T4 の dermatome","a":"乳頭"},{"q":"T10 の dermatome","a":"臍"},{"q":"L4 の dermatome","a":"膝・下腿内側"},{"q":"L5 の dermatome","a":"母趾と足背"},{"q":"S1 の dermatome","a":"足の外側・足底"}]},{"title":"6 長経路の統合","secs":[{"title":"Corticobulbar tract","cards":[{"q":"Corticobulbar tractの支配様式は?","a":"運動性脳神経核を両側性に支配。例外は顔面神経核の下部と舌下神経核(対側優位)","s":0}]},{"title":"感覚路の入口","cards":[{"q":"感覚路の1st order neuronはどこ?","a":"Dorsal root ganglion","s":2,"n":"SAME DAVE:Sensory = Afferent, Motor = Efferent / Dorsal = Afferent, Ventral = Efferent"},{"q":"皮膚・深部の受容器は?","a":"Free nerve endings(pain・temperature)、MeissnerとMerkel(touch)、Pacini(vibration・pressure)、Ruffini(stretch)、muscle spindlesとGolgi tendon organs(proprioception)","s":1}]},{"title":"通しで語る経路","cards":[{"q":"Dorsal column–medial lemniscus pathwayを起始から皮質まで","a":"受容器 → dorsal root ganglion(1st)→ 同側fasciculus gracilis / cuneatus → medullaのnucleus gracilis / cuneatus(2nd)→ internal arcuate fibersで交叉 → medial lemniscus → thalamus VPL(3rd)→ posterior limb of internal capsule → postcentral gyrus (3, 1, 2)","s":2},{"q":"Spinothalamic tractを起始から皮質まで","a":"Free nerve endings → dorsal root ganglion(1st)→ Lissauer's tractで1〜2分節 → posterior horn laminae I, II, V(2nd)→ anterior white commissureで交叉 → 対側lateral spinothalamic tract → 脳幹lateral tegmentum → thalamus VPL(3rd)→ postcentral gyrus","s":2},{"q":"Corticospinal (pyramidal) tractを皮質から脊髄まで","a":"Precentral gyrusのlayer 5 (Betz cells) → corona radiata → posterior limb of internal capsuleの前2/3 → crus cerebriの中央3/5 → basilar pons → pyramid → pyramidal decussationで85〜90%交叉 → lateral corticospinal tract → anterior hornのmotor neurons (lamina IX)","s":2}]}],"rev":[4,2],"lesson":[{"h":"長経路とは","b":["脳と体をつなぐ長い線維の通り道。途中で何回ニューロンを替えるか、どこで反対側へ渡るかが毎回のポイント。","覚える経路は3本:触覚の後索路、痛み温度の脊髄視床路、運動の皮質脊髄路。","どれも左右が入れ替わる(大脳の左が体の右を担当)。違うのは渡る高さだけ。"]},{"h":"受容器:感覚の入口","b":["- free nerve endings(自由神経終末):痛み・温度。","- Meissner 小体・Merkel 盤:細かい触覚。","- Pacini 小体:振動と圧。","- Ruffini 小体:皮膚の伸び。","- muscle spindle(筋紡錘)と Golgi 腱器官:筋の長さと張力(固有感覚)。","どの受容器からの線維も、1次ニューロンの細胞体は dorsal root ganglion(後根神経節)にある。顔だけは三叉神経節。"]},{"h":"後索-内側毛帯路(触覚・振動・位置覚)","b":["1. 受容器 → 後根神経節(1次ニューロン)→ 後根から脊髄へ。","2. 同じ側の後索(薄束か楔状束)をそのまま上る。","3. 延髄の nucleus gracilis / cuneatus(薄束核・楔状束核)で2次ニューロンへ。","4. internal arcuate fibers として反対側へ渡り、medial lemniscus(内側毛帯)を上る。","5. 視床の VPL(3次ニューロン)。","6. 内包後脚 → 中心後回(一次体性感覚野、3・1・2野)。","渡るのは延髄。"]},{"h":"脊髄視床路(痛み・温度・粗い触覚)","b":["1. 自由神経終末 → 後根神経節(1次)。","2. Lissauer's tract で上下1〜2髄節に広がる。","3. 後角(lamina I・II・V)で2次ニューロンへ。","4. すぐ前白交連で反対側へ渡る。","5. 反対側の側索を lateral spinothalamic tract として上る(脳幹では被蓋の外側)。","6. 視床の VPL(3次)→ 中心後回。","渡るのは入った高さの脊髄。"]},{"h":"皮質脊髄路(随意運動)","b":["1. 中心前回(一次運動野)の第5層、Betz 細胞。","2. 放線冠 → 内包後脚の前2/3。","3. 中脳の大脳脚の中央3/5 → 橋底部 → 延髄の錐体。","4. 延髄下端の pyramidal decussation で85〜90%が反対側へ渡る → lateral corticospinal tract(側索)。","5. 前角の運動ニューロン(lamina IX)へ。","渡らなかった残りは anterior corticospinal tract(前索)を下り、終わる高さで反対側へ渡る。","皮質から前角までを upper motor neuron(上位運動ニューロン)、前角から筋までを lower motor neuron(下位運動ニューロン)という。"]},{"h":"脳神経核への運動路(皮質核路)","b":["corticobulbar tract は内包の膝を通り、脳幹の運動性脳神経核へ。","多くの核を左右両方の皮質が支配する。例外は顔面神経核の下半分と舌下神経核で、主に反対側の皮質から。だから中枢性の顔面麻痺は顔の下半分だけになる。"]},{"h":"病変の位置から症状を読む","b":["- 脊髄の右半分が切れた:右の運動と位置覚(まだ渡っていない)、左の痛みと温度(もう渡った)が失われる。","- 延髄より上の右側の病変:左半身の運動・触覚・痛みすべて。","上位運動ニューロンの障害は痙性麻痺・腱反射亢進・Babinski 陽性。下位運動ニューロンの障害は弛緩性麻痺・筋萎縮・反射消失。"]}],"terms":[{"q":"long tracts","a":"長経路。脳と脊髄を結ぶ長い線維路"},{"q":"receptor","a":"受容器。刺激を電気信号に変える"},{"q":"free nerve endings","a":"自由神経終末。痛み・温度"},{"q":"Meissner corpuscle","a":"マイスナー小体。細かい触覚"},{"q":"Pacinian corpuscle","a":"パチニ小体。振動と圧"},{"q":"muscle spindle","a":"筋紡錘。筋の長さ(固有感覚)"},{"q":"Golgi tendon organ","a":"ゴルジ腱器官。筋の張力"},{"q":"proprioception","a":"固有感覚。体の位置と動きの感覚"},{"q":"first-order neuron","a":"1次ニューロン。受容器から中枢へ"},{"q":"nucleus gracilis / cuneatus","a":"薄束核 / 楔状束核。延髄、後索路の2次ニューロン"},{"q":"internal arcuate fibers","a":"内弓状線維。延髄で正中を渡る後索路の線維"},{"q":"medial lemniscus","a":"内側毛帯。後索路の交叉後の線維束"},{"q":"VPL","a":"視床後外側腹側核。体の感覚の中継"},{"q":"anterior white commissure","a":"前白交連。脊髄で痛み温度の線維が渡る"},{"q":"pyramidal decussation","a":"錐体交叉。延髄下端、皮質脊髄路の交叉"},{"q":"Betz cells","a":"ベッツ細胞。一次運動野第5層の巨大錐体細胞"},{"q":"upper motor neuron","a":"上位運動ニューロン。皮質から前角まで"},{"q":"lower motor neuron","a":"下位運動ニューロン。前角(脳神経核)から筋まで"},{"q":"corticobulbar tract","a":"皮質核路。皮質から脳神経運動核へ"},{"q":"Babinski sign","a":"バビンスキー徴候。上位運動ニューロン障害の徴候"}],"facts":[{"q":"長経路の3本","a":"後索-内側毛帯路・脊髄視床路・皮質脊髄路"},{"q":"痛み・温度の受容器","a":"自由神経終末"},{"q":"振動を感じる受容器","a":"Pacini 小体"},{"q":"細かい触覚の受容器","a":"Meissner 小体・Merkel 盤"},{"q":"筋の長さを感じる受容器","a":"筋紡錘"},{"q":"筋の張力を感じる受容器","a":"Golgi 腱器官"},{"q":"体の感覚の1次ニューロンの細胞体","a":"後根神経節"},{"q":"顔の感覚の1次ニューロンの細胞体","a":"三叉神経節(固有感覚だけは中脳路核)"},{"q":"後索路の2次ニューロンがある場所","a":"延髄の薄束核・楔状束核"},{"q":"後索路が交叉する場所","a":"延髄(internal arcuate fibers)"},{"q":"後索路の交叉後の線維束","a":"Medial lemniscus"},{"q":"後索路の3次ニューロン","a":"視床 VPL"},{"q":"後索路の最終目的地","a":"中心後回(3・1・2野)"},{"q":"脊髄視床路の2次ニューロンがある場所","a":"後角(lamina I・II・V)"},{"q":"脊髄視床路が交叉する場所","a":"入った高さの脊髄、前白交連"},{"q":"脊髄視床路が上る索","a":"反対側の側索"},{"q":"脊髄視床路の3次ニューロン","a":"視床 VPL"},{"q":"皮質脊髄路の起始","a":"中心前回の第5層 Betz 細胞"},{"q":"皮質脊髄路が通る内包の部位","a":"後脚の前2/3"},{"q":"皮質脊髄路が通る大脳脚の部位","a":"中央3/5"},{"q":"皮質脊髄路が延髄で通る構造","a":"錐体"},{"q":"錐体交叉で交叉する割合","a":"85〜90%"},{"q":"交叉した皮質脊髄路の名前","a":"Lateral corticospinal tract"},{"q":"交叉しない皮質脊髄路の名前","a":"Anterior corticospinal tract"},{"q":"皮質脊髄路が終わる細胞","a":"前角の運動ニューロン(lamina IX)"},{"q":"上位運動ニューロンの範囲","a":"皮質から前角(脳神経核)まで"},{"q":"下位運動ニューロンの範囲","a":"前角から筋まで"},{"q":"皮質核路が通る内包の部位","a":"膝(genu)"},{"q":"皮質核路で反対側優位に支配される核","a":"顔面神経核下半分と舌下神経核"},{"q":"右脊髄半切で右に失われるもの","a":"運動と位置覚・振動覚"},{"q":"右脊髄半切で左に失われるもの","a":"痛覚・温度覚"},{"q":"上位運動ニューロン障害の徴候","a":"痙性麻痺・腱反射亢進・Babinski 陽性"},{"q":"下位運動ニューロン障害の徴候","a":"弛緩性麻痺・筋萎縮・反射消失"}]},{"title":"7 小脳","secs":[{"title":"解剖と区分","cards":[{"q":"Cerebellumの解剖学的構成は?","a":"2つのhemispheresと正中のvermis。anterior lobe、posterior lobe、flocculonodular lobe","s":2},{"q":"葉を分けるfissureは?","a":"Primary fissure(anterior / posterior lobe)、dorsolateral (posterolateral) fissure(posterior / flocculonodular)、horizontal fissure","s":0},{"q":"半球の小葉を上→下に","a":"Anterior quadrangular、posterior quadrangular (simple)、superior semilunar、inferior semilunar、biventral。付属:tonsilとflocculus","s":0},{"q":"Vermisの区分を上→下に","a":"Lingula、central lobule、culmen、declive、folium、tuber、pyramid、uvula、nodule","s":1},{"q":"Tonsilの臨床的意義は?","a":"Foramen
