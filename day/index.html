tle":"白質とtracts","cards":[{"q":"White matterの3つのfuniculiは?","a":"Dorsal、lateral、ventral funiculi","s":2},{"q":"主な上行路と位置は?","a":"Dorsal funiculus:fasciculus gracilisとcuneatus。Lateral:lateral spinothalamic、dorsal / ventral spinocerebellar。Ventral:anterior spinothalamic。後角尖端にLissauer's tract","s":2},{"q":"主な下行路と位置は?","a":"Lateral:lateral corticospinal、rubrospinal。Ventral:anterior corticospinal、vestibulospinal、reticulospinal、tectospinal","s":2},{"q":"Fasciculus gracilisとcuneatusの違いは?","a":"Gracilis:内側、T6より下(下半身)。Cuneatus:外側、T6より上(上半身)","s":0,"n":"Gracilis = graceful legs(下肢)"},{"q":"Dorsal columnsが運ぶ感覚は?","a":"Discriminative (fine) touch、pressure、vibration、position sense(conscious proprioception)","s":1},{"q":"Spinothalamic tractが運ぶ感覚は?","a":"Lateral:painとtemperature。Anterior:crude touch","s":1},{"q":"Lissauer's tractの意義は?","a":"DRG線維が上下1〜2分節に広がって後角に入る。損傷高位のdermatomeがanesthesiaでなくhypoesthesiaになる理由","s":0},{"q":"Spinothalamic tract内のsomatotopyは?","a":"Sacralが最外側(表層)、cervicalが内側。中心性病変でsacral sparing","s":0},{"q":"Spinocerebellar tractsの機能は?","a":"Unconscious proprioceptionを同側小脳へ。dorsal(Clarke's column、非交叉、inferior peduncle)とventral(二重交叉、superior peduncle)","s":2},{"q":"Lateral corticospinal tractの特徴は?","a":"Pyramidsで交叉。随意運動、特に精細運動。somatotopyは内→外にC-T-L-S","s":1},{"q":"Anterior corticospinal tractは?","a":"Pyramidsでは交叉せず、終止高位で交叉。cervicalとupper thoracicのみ。体幹筋","s":0},{"q":"Vestibulospinal tractの起始・経路・機能は?","a":"Lateral:lateral vestibular (Deiters) nucleusから非交叉でventral funiculusを全長下行、抗重力伸筋のtoneを促進。Medial:medial nucleusから両側性にMLFを通り頸髄へ、頭頸部の姿勢","s":1},{"q":"Rubrospinal tractは?","a":"Red nucleusから交叉してlateral funiculusへ。上肢屈筋の促進","s":0}]},{"title":"脊髄症候群","cards":[{"q":"Brown-Séquard syndromeは?","a":"半側損傷。同側の運動麻痺とproprioception低下、対側の温痛覚低下。予後は良い(90%が歩行回復)","s":0},{"q":"Central cord syndromeは?","a":"頸椎過伸展。上肢優位の運動麻痺、cape状の温痛覚障害、sacral sparing","s":0},{"q":"Anterior cord syndromeは?","a":"Anterior spinal artery領域の虚血。両側の運動と温痛覚の障害、proprioceptionは保たれる。予後不良","s":0},{"q":"Conusとcauda equina syndromeの違いは?","a":"Conus:対称性、早期から括約筋障害。Cauda equina:非対称性の感覚運動障害、areflexia","s":0},{"q":"Spinal shockとは?","a":"損傷高位以下の全神経機能(反射を含む)の一過性消失。通常48時間、後にspasticity","s":0},{"q":"Cruciate paralysis (Bell)とは?","a":"C1–C2前方病変で上肢優位の麻痺。上肢のcorticospinal fibersが下肢より吻側・内側で交叉するため","s":0}]}],"rev":[3,1],"lesson":[{"h":"今日学ぶこと","b":["今日は spinal cord(脊髄)を学ぶ。脊髄は、脳と体をつなぐ太い神経の束で、同時に、体の感覚を最初に受け取り、筋に命令を出す場所でもある。","今日の流れは、外から見た形 → 輪切りの断面(灰白質と白質)→ 灰白質の中の層と特別な核 → 白質の中の線維の通り道 → 感覚が入ってくる仕組み → 血管と、壊れたときの症状、の順。"]},{"h":"脊髄はどこからどこまでか","b":["脊髄は、延髄の下から続き、背骨の中の管(vertebral canal 脊柱管)を下っていく。","大人の脊髄は背骨より短く、背骨のいちばん上から数えて腰の1番目と2番目の骨(L1〜L2)の高さで終わる。終わりの部分は円錐の形にとがっていて、conus medullaris(脊髄円錐)という。","脊髄円錐より下には脊髄はなく、脊髄から出た神経の根が、馬のしっぽのように束になって下へ伸びている。これを cauda equina(馬尾:ラテン語で馬の尾)という。真ん中を、脊髄円錐から続く細い糸 filum terminale(終糸)が下り、背骨の下端につながって脊髄を支えている。","脊髄が背骨より短いのは、胎児のころは同じ長さだったのに、成長するにつれて背骨の方が長く伸びたから。そのため、下の方の神経の根ほど、脊髄を出てから自分の出口の穴まで長く下ることになる。"]},{"h":"脊髄神経は31対","b":["脊髄からは、左右に1本ずつ、合計31対の spinal nerves(脊髄神経)が出る。背骨の骨と骨の間のすき間から外へ出ていく。","上から、首の8対(C1〜C8)、胸の12対(T1〜T12)、腰の5対(L1〜L5)、骨盤の後ろの仙骨の5対(S1〜S5)、尾骨の1対(Co1)。","脊髄の、1対の脊髄神経が出る範囲を segment(髄節)という。たとえば「C5 の髄節」は、5番目の頸神経が出る脊髄の部分。","C1 は筋を動かす線維だけで、感覚の線維をほとんど持たない。"]},{"h":"脊髄が太くなる2か所","b":["脊髄の太さは一様ではなく、2か所で太くなっている。","- cervical enlargement(頸膨大):首の下から胸の上(C5〜T1)。ここから腕へ行く神経が出る。","- lumbosacral enlargement(腰膨大):胸の下から仙骨(T11〜S2)。ここから脚へ行く神経が出る。","腕と脚には筋がたくさんあり、それぞれを動かす神経細胞と、皮膚からの感覚を受ける神経細胞がたくさん必要になる。その分だけ灰白質が多くなり、脊髄が太くなる。"]},{"h":"輪切りにすると、中に H の字","b":["脊髄を横に切ると、中央に灰色の H の字(または蝶の形)が見え、その周りを白い部分が囲んでいる。","- gray matter(灰白質):中央の H の字。神経細胞の細胞体が集まっている。細胞体が多いと灰色に見える。","- white matter(白質):その周り。神経細胞の軸索が上下に走っている。軸索の多くは、電線の被覆のような髄鞘(脂肪を多く含む膜)で包まれているので、白く見える。","脳(大脳と小脳)では、灰白質が外側(皮質)、白質が内側にある。脊髄では逆で、灰白質が内側、白質が外側。","H の字の真ん中には、ごく細い穴 central canal(中心管)が縦に通っている。これは Day 1 で学んだ神経管の中の空間の名残りで、脳室とつながっている。"]},{"h":"灰白質の3つの角","b":["H の字の、前に突き出した部分、後ろに突き出した部分、横に小さく突き出した部分を、それぞれ角(horn)と呼ぶ。","- anterior horn(前角):前の太い部分。ここには、骨格筋を動かす神経細胞(運動ニューロン)がある。その軸索は脊髄の前から出て、筋へ向かう。","- posterior horn(後角):後ろの細長い部分。体から入ってくる感覚の情報を受け取る。","- lateral horn(側角):前角と後角の間から横に小さく突き出た部分。胸から腰の上(T1〜L2)にだけある。交感神経の1本目の神経細胞がある(Day 4)。","Day 1 で学んだとおり、神経管の前半分(基板)が運動、後ろ半分(翼板)が感覚になる。脊髄は管が開かないので、前が運動、後ろが感覚の並びがそのまま残っている。"]},{"h":"灰白質を10の層に分ける","b":["灰白質の中の神経細胞は、形や大きさの違うものが層を作って並んでいる。これを、スウェーデンの研究者 Rexed が後ろから前へ I〜X の番号をつけて分けた。Rexed laminae(レクセドの層)という。","- I〜VI 層:後角。感覚の情報を受け取る層。","- VII 層:後角と前角の間(中間部)。側角もここに入る。","- VIII 層:前角の内側。神経細胞どうしをつなぐ細胞(介在ニューロン)がいる。","- IX 層:前角。骨格筋を動かす運動ニューロンの集まり。","- X 層:中心管の周り。","痛みの情報を受け取るのは、主に I 層、II 層、V 層。II 層は顕微鏡で見ると半透明のゼリーのように見えるので、substantia gelatinosa(膠様質:にかわのような質)と呼ばれ、痛みの強さを調節する働きを持つ。"]},{"h":"覚えるべき3つの特別な核","b":["灰白質の中には、特定の高さにだけある、名前のついた核が3つある。","1つ目は Clarke's nucleus(クラーク核、背核)。VII 層の内側にあり、胸の下から腰の上(C8〜L2)にだけある。脚の筋がどれだけ伸びているかの情報を受け取り、それを小脳へ送る経路(dorsal spinocerebellar tract 後脊髄小脳路)の出発点になる。小脳はこの情報を使って動きのずれを直す(Day 7)。","2つ目は intermediolateral nucleus(中間外側核)。側角そのものの神経細胞の集まり。T1〜L2 では交感神経の1本目の神経細胞、仙髄の S2〜S4 では副交感神経の1本目の神経細胞が入っている。","3つ目は Onuf's nucleus(オヌフ核)。仙髄の S2(前後の S1〜S3 に及ぶこともある)の前角、IX 層にある運動ニューロンの集まり。ここから出る神経は pudendal nerve(陰部神経)で、肛門と尿道の出口を締める外括約筋を動かす。この括約筋は横紋筋なので、自分の意思で締められる。くしゃみや咳でお腹に力が入った瞬間に、反射的に括約筋を締めて漏れを防ぐのもこの核の働き。"]},{"h":"前角の中の並び方","b":["前角の運動ニューロンは、どの筋を動かすかによって、決まった場所に並んでいる。","内側の群は、体幹の筋と、肩や腰のような体の中心に近い筋を動かす。体幹はどの高さにもあるので、内側の群は脊髄の全部の高さにある。","外側の群は、手足の先の方の筋(手や指、足や指)を動かす。手足の筋は、腕と脚の高さにしかないので、外側の群は2つの膨大部にだけある。膨大部が太い理由の1つが、この外側の群。","前後では、筋を伸ばす筋(伸筋)を動かす細胞が前寄り、曲げる筋(屈筋)を動かす細胞が後ろ寄りに並ぶ。"]},{"h":"白質は3つの柱に分かれる","b":["白質は、灰白質の角と、そこから出入りする神経の根によって、左右それぞれ3つの柱に区切られる。柱を funiculus(索)という。","- dorsal funiculus(後索):左右の後角の間。","- lateral funiculus(側索):後角と前角の外側。","- ventral funiculus(前索):左右の前角の間とその周り。","それぞれの索の中を、上へ向かう線維(上行路:感覚を脳へ運ぶ)と、下へ向かう線維(下行路:脳からの命令を運ぶ)が、決まった場所に束になって走る。束にはそれぞれ名前がついていて、名前は「出発点 → 到着点」の順に並べて作ることが多い。たとえば spinothalamic(脊髄視床路)は、脊髄から視床へ行く束。"]},{"h":"後索に入っている線維","b":["後索には、上へ向かう線維だけが入っている。運ぶのは、細かい触覚(どこを触られたか正確に分かる感覚)、振動、手足の位置の感覚。","後索は、内側と外側の2つの束に分かれる。","- fasciculus gracilis(薄束):内側の細い束。脚と体の下半分(胸の6番目 T6 より下)からの情報。gracilis は「細い」という意味。","- fasciculus cuneatus(楔状束):外側の束。腕と体の上半分(T6 より上)からの情報。cuneatus は「くさび形の」という意味。楔状束は T6 より上の高さにしかない。","下から入ってきた線維が先に内側に並び、上から入ってきた線維が後からその外側に加わっていくので、このような並びになる。","後索の線維は、脊髄の中では左右を渡らず、同じ側のまま延髄まで上る(全体の道すじは Day 6)。"]},{"h":"側索と前索に入っている線維","b":["側索の主な線維:","- lateral corticospinal tract(外側皮質脊髄路):下行。大脳皮質から来て、手足を動かす命令を前角へ運ぶ。随意運動(自分の意思で動かす運動)の主な通り道。","- lateral spinothalamic tract(外側脊髄視床路):上行。痛みと温度の情報を視床へ運ぶ。","- spinocerebellar tracts(脊髄小脳路):上行。筋の伸び具合などを小脳へ運ぶ。意識にはのぼらない情報。","- rubrospinal tract(赤核脊髄路):下行。中脳の赤核(Day 1)から来て、腕を曲げる筋を助ける。","前索の主な線維:","- anterior spinothalamic tract(前脊髄視床路):上行。大まかな触覚。","- anterior corticospinal tract(前皮質脊髄路):下行。体幹の筋への命令。","- vestibulospinal tract(前庭脊髄路):下行。前庭神経核(Day 4)から来て、重力に逆らって体を支える筋(背中や脚を伸ばす筋)を働かせ、姿勢を保つ。","- reticulospinal tract(網様体脊髄路)と tectospinal tract(視蓋脊髄路):下行。姿勢や、音や光に向かって首を回す動き。","!img reticulospinal-tract.jpg | 網様体脊髄路。大脳皮質・淡蒼球・小脳核からの信号を受けた網様体が、脊髄へ命令を送る。","網様体(Day 1)は、大脳皮質、淡蒼球(Day 11 で学ぶ基底核の一部)、小脳核(Day 7)からの信号を受ける。網様体の神経細胞の軸索は、前索の外側と側索を下り、脊髄の interneuron(介在ニューロン:運動ニューロンの手前で信号をつなぐ小さな神経細胞)に命令を渡す。こうして姿勢や、手足の大まかな動きを調節する。","!img vestibulospinal-tract.jpg | 前庭脊髄路。半規管からの信号が前庭神経外側核に届き、そこから前索を下る。","図の「前庭ggl.」は前庭神経節(ggl. は ganglion の略)。lateral vestibular nucleus(前庭神経外側核)は前庭神経核の4つの部分のうちの1つで、前庭脊髄路はここから出る。小脳の室頂核(Day 7)などからも信号を受けている。","線維は同じ側の前索を下り、運動ニューロンに直接命令を渡す。網様体脊髄路が介在ニューロンを経るのとは、この点が違う。"]},{"h":"感覚が脊髄に入ってくる仕組み","b":["体の皮膚や筋で感じた情報は、脊髄神経を通って脊髄に入る。脊髄神経は、脊髄に近づくと後ろの根(dorsal root 後根)と前の根(ventral root 前根)に分かれる。感覚は後根から入り、運動の命令は前根から出る。","後根の途中には、小さなふくらみ dorsal root ganglion(後根神経節)がある。これは感覚の1次ニューロンの細胞体の集まり(Day 3 で学んだ感覚の神経節と同じ仕組み)。細胞体から出た1本の突起が皮膚や筋へ、もう1本が脊髄の中へ伸びている。","脊髄に入った線維は、感覚の種類によって行き先が分かれる。","- 細かい触覚・振動・位置の感覚:後角を素通りして、そのまま同じ側の後索に入り、上へ向かう。","- 痛みと温度:後角に入り、そこで2本目の神経細胞に情報を渡す。2本目の神経細胞の軸索は、すぐに中心管の前(anterior white commissure 前白交連)を通って反対側へ渡り、反対側の側索(外側脊髄視床路)を上る。","後角の先端には Lissauer's tract(リッサウアー路)という細い束がある。痛みと温度の線維は、後角に入る前にここで上下に1〜2髄節分枝分かれしてから後角に入る。"]},{"h":"皮膚の帯の地図(dermatome)","b":["1つの髄節の後根は、体の決まった帯状の範囲の皮膚から感覚を受け取る。この範囲を dermatome(皮膚分節)という。同じように、1つの髄節の前根が動かす筋のまとまりを myotome(筋分節)という。","皮膚分節は、胎児のときに体が節ごとに分かれて作られた名残りで、体幹では輪切りのように横に並ぶ。手足では、手足が伸びていくときに引き伸ばされて、縦長の帯になっている。","覚えておく目印:","- C6:親指。C7:中指。C8:小指。","- T4:乳首の高さ。T10:へその高さ。","- L4:膝と、すねの内側。L5:足の甲と親指。S1:足の外側と足の裏。","患者がどこまで感覚がないかを調べると、脊髄のどの高さが壊れたかが分かる。"]},{"h":"脊髄の血管","b":["脊髄の前には、縦に1本の anterior spinal artery(前脊髄動脈)が走り、脊髄の前の3分の2(前角・側索の大部分・前索)を養う。","後ろには、左右に1本ずつ posterior spinal artery(後脊髄動脈)が走り、後ろの3分の1(後角と後索)を養う。","どちらも上の方では頭の椎骨動脈(Day 17)から出るが、それだけでは下まで届かない。そこで途中の高さごとに、大動脈などから補給の動脈が入ってくる。そのうち最も大きいのが artery of Adamkiewicz(アダムキーヴィッツ動脈)で、多くは左側、胸の8番目から腰の1番目(T8〜L1)の高さで入る。大動脈の手術でこの動脈が傷むと、下半身が麻痺することがある。"]},{"h":"脊髄の一部が壊れたときの症状","b":["ここまでの知識で、脊髄のどこが壊れるとどんな症状になるかを考えられる。","Brown-Séquard syndrome(ブラウン・セカール症候群):脊髄の左右どちらか半分が切れた場合。","- 同じ側:壊れた高さより下の運動の麻痺(皮質脊髄路は延髄ですでに交叉したあとなので、ここでは同じ側を走っている)と、細かい触覚・位置の感覚の消失(後索は同じ側を上っている)。","- 反対側:痛みと温度の感覚の消失(脊髄視床路は入った高さですぐ反対側へ渡っている)。","anterior cord syndrome(前脊髄症候群):前脊髄動脈が詰まって、脊髄の前の3分の2が壊れた場合。両側の運動と、痛み・温度の感覚がなくなる。後ろの3分の1にある後索は残るので、触れた場所や手足の位置は分かる。","central cord syndrome(中心性脊髄症候群):首を強く後ろへ反らせたときなどに、脊髄の中心部が傷む場合。中心に近い所を走る腕への線維が先に傷むので、脚より腕の麻痺が強い。中心管のすぐ前で交叉する痛みと温度の線維も傷むので、両肩から腕にかけて、マントをはおったような範囲で痛みと温度が分からなくなる。"]}],"terms":[{"q":"interneuron","a":"介在ニューロン。運動ニューロンの手前で信号をつなぐ"},{"q":"lateral vestibular nucleus","a":"前庭神経外側核。前庭脊髄路の起始"},{"q":"spinal cord","a":"脊髄"},{"q":"conus medullaris","a":"脊髄円錐。脊髄の下端(L1–L2)"},{"q":"cauda equina","a":"馬尾。脊髄円錐より下の神経根の束"},{"q":"filum terminale","a":"終糸。脊髄円錐から伸びる軟膜の糸"},{"q":"cervical enlargement","a":"頸膨大。C5–T1"},{"q":"lumbosacral enlargement","a":"腰膨大。T11–S2"},{"q":"gray matter","a":"灰白質。細胞体が集まる"},{"q":"white matter","a":"白質。有髄線維が集まる"},{"q":"anterior horn","a":"前角。運動ニューロン"},{"q":"posterior horn","a":"後角。感覚の入口"},{"q":"lateral horn","a":"側角。T1–L2、交感の節前ニューロン"},{"q":"central canal","a":"中心管。脳室の続き"},{"q":"Rexed laminae","a":"灰白質を後ろから前へ I〜X に分けた層"},{"q":"substantia gelatinosa","a":"膠様質(lamina II)。痛みの調節"},{"q":"Clarke's nucleus","a":"背核(lamina VII、C8–L2)。後脊髄小脳路の起始"},{"q":"intermediolateral nucleus","a":"中間外側核(側角)。自律神経の節前"},{"q":"Onuf's nucleus","a":"オヌフ核(S2)。陰部神経、外括約筋"},{"q":"funiculus","a":"索。白質の柱"},{"q":"fasciculus gracilis","a":"薄束。後索の内側、下半身"},{"q":"fasciculus cuneatus","a":"楔状束。後索の外側、上半身"},{"q":"dorsal root ganglion","a":"後根神経節。感覚の1次ニューロンの細胞体"},{"q":"Lissauer's tract","a":"後外側束。後角先端、線維が上下に広がる"},{"q":"dermatome","a":"皮膚分節。1つの髄節が支配する皮膚の帯"},{"q":"myotome","a":"筋分節。1つの髄節が支配する筋群"},{"q":"artery of Adamkiewicz","a":"アダムキーヴィッツ動脈。下部脊髄の主な補給"}],"facts":[{"q":"前庭脊髄路の起始と通り道","a":"前庭神経外側核から、同じ側の前索"},{"q":"網様体脊髄路が通る場所","a":"前索の外側と側索"},{"q":"大人の脊髄の下端","a":"L1–L2"},{"q":"脊髄円錐より下の神経根の束","a":"Cauda equina"},{"q":"脊髄神経の総数","a":"31対(C8・T12・L5・S5・Co1)"},{"q":"運動線維だけで感覚線維をもたない脊髄神経","a":"C1"},{"q":"頸膨大の高さ","a":"C5–T1"},{"q":"腰膨大の高さ","a":"T11–S2"},{"q":"膨大部が太い理由","a":"手足を動かす運動ニューロンが多いから"},{"q":"灰白質の形","a":"H 字(蝶形)"},{"q":"運動ニューロンがある角","a":"前角"},{"q":"感覚が入る角","a":"後角"},{"q":"側角がある高さ","a":"T1–L2"},{"q":"側角に入るニューロン","a":"交感神経の節前ニューロン"},{"q":"Rexed laminae の数","a":"I〜X の10層"},{"q":"運動ニューロンの層","a":"Lamina IX"},{"q":"痛みの中継に関わる層","a":"I・II・V"},{"q":"膠様質は何層","a":"Lamina II"},{"q":"中心管の周りの層","a":"Lamina X"},{"q":"Clarke's nucleus の高さ","a":"C8–L2"},{"q":"Clarke's nucleus から出る経路","a":"Dorsal spinocerebellar tract"},{"q":"仙髄 S2–S4 の側角にあるもの","a":"副交感の節前ニューロン"},{"q":"Onuf's nucleus の高さ","a":"S2(S1–S3)"},{"q":"Onuf's nucleus から出る神経","a":"陰部神経(pudendal nerve)"},{"q":"Onuf's nucleus が動かす筋","a":"肛門・尿道の外括約筋(横紋筋)"},{"q":"前角の内側群が支配する筋","a":"体幹と体の近くの筋"},{"q":"前角の外側群がある高さ","a":"膨大部だけ"},{"q":"前角で伸筋と屈筋の前後関係","a":"伸筋が前、屈筋が後ろ"},{"q":"白質の3つの索","a":"後索・側索・前索"},{"q":"後索に入る経路の向き","a":"上行だけ"},{"q":"後索の内側の束","a":"薄束(下半身)"},{"q":"後索の外側の束","a":"楔状束(上半身)"},{"q":"楔状束がある高さ","a":"T6 より上"},{"q":"後索が運ぶ感覚","a":"触覚(識別)・振動覚・位置覚"},{"q":"外側脊髄視床路が運ぶ感覚","a":"痛覚と温度覚"},{"q":"前脊髄視床路が運ぶ感覚","a":"粗い触覚"},{"q":"外側皮質脊髄路がある索","a":"側索"},{"q":"前庭脊髄路がある索","a":"前索"},{"q":"感覚の1次ニューロンの細胞体","a":"後根神経節"},{"q":"痛み温度の線維が反対側へ渡る場所","a":"入った高さの前白交連"},{"q":"後索の線維が反対側へ渡る場所","a":"延髄(脊髄では渡らない)"},{"q":"Lissauer's tract の役割","a":"入った線維を上下1〜2髄節に広げる"},{"q":"脊髄の前2/3を養う動脈","a":"前脊髄動脈(1本)"},{"q":"脊髄の後ろ1/3を養う動脈","a":"後脊髄動脈(2本)"},{"q":"Adamkiewicz 動脈の起始の高さ","a":"T8–L1(多くは左)"},{"q":"Brown-Séquard で同じ側に失われるもの","a":"運動と位置覚・振動覚"},{"q":"Brown-Séquard で反対側に失われるもの","a":"痛覚と温度覚"},{"q":"前脊髄症候群で残る感覚","a":"位置覚・振動覚(後索)"},{"q":"中心性脊髄症候群の原因","a":"首の過伸展(狭い頸椎管)"},{"q":"C6 の dermatome","a":"母指"},{"q":"C7 の dermatome","a":"中指"},{"q":"C8 の dermatome","a":"小指"},{"q":"T4 の dermatome","a":"乳頭"},{"q":"T10 の dermatome","a":"臍"},{"q":"L4 の dermatome","a":"膝・下腿内側"},{"q":"L5 の dermatome","a":"母趾と足背"},{"q":"S1 の dermatome","a":"足の外側・足底"}]},{"title":"6 長経路の統合","secs":[{"title":"Corticobulbar tract","cards":[{"q":"Corticobulbar tractの支配様式は?","a":"運動性脳神経核を両側性に支配。例外は顔面神経核の下部と舌下神経核(対側優位)","s":0}]},{"title":"感覚路の入口","cards":[{"q":"感覚路の1st order neuronはどこ?","a":"Dorsal root ganglion","s":2,"n":"SAME DAVE:Sensory = Afferent, Motor = Efferent / Dorsal = Afferent, Ventral = Efferent"},{"q":"皮膚・深部の受容器は?","a":"Free nerve endings(pain・temperature)、MeissnerとMerkel(touch)、Pacini(vibration・pressure)、Ruffini(stretch)、muscle spindlesとGolgi tendon organs(proprioception)","s":1}]},{"title":"通しで語る経路","cards":[{"q":"Dorsal column–medial lemniscus pathwayを起始から皮質まで","a":"受容器 → dorsal root ganglion(1st)→ 同側fasciculus gracilis / cuneatus → medullaのnucleus gracilis / cuneatus(2nd)→ internal arcuate fibersで交叉 → medial lemniscus → thalamus VPL(3rd)→ posterior limb of internal capsule → postcentral gyrus (3, 1, 2)","s":2},{"q":"Spinothalamic tractを起始から皮質まで","a":"Free nerve endings → dorsal root ganglion(1st)→ Lissauer's tractで1〜2分節 → posterior horn laminae I, II, V(2nd)→ anterior white commissureで交叉 → 対側lateral spinothalamic tract → 脳幹lateral tegmentum → thalamus VPL(3rd)→ postcentral gyrus","s":2},{"q":"Corticospinal (pyramidal) tractを皮質から脊髄まで","a":"Precentral gyrusのlayer 5 (Betz cells) → corona radiata → posterior limb of internal capsuleの前2/3 → crus cerebriの中央3/5 → basilar pons → pyramid → pyramidal decussationで85〜90%交叉 → lateral corticospinal tract → anterior hornのmotor neurons (lamina IX)","s":2}]}],"rev":[4,2],"lesson":[{"h":"今日学ぶこと","b":["Day 1 で脳幹を通る長い経路を4本挙げ、Day 5 で脊髄の中のどこを走るかを学んだ。今日は、そのうち特に大事な3本を、出発点から到着点まで1本の道として通してたどる。","1. 後索-内側毛帯路:細かい触覚・振動・手足の位置の感覚。","2. 脊髄視床路:痛みと温度。","3. 皮質脊髄路:手足を動かす命令。","口頭試験では「この経路を説明して」と聞かれ、途中で止まらずに言えるかが問われる。3本とも、次の3点を必ず言えるようにする。","- 何本の神経細胞をリレーするか、それぞれの細胞体はどこにあるか。","- どこで左右が入れ替わるか(交叉の位置)。","- 途中でどの構造を通るか。","!img ascending-descending-pathways.jpg | 伝導路の区分。A が下行性、B が上行性。","図の「伝導路」は、このアプリでいう「経路」と同じ意味。大脳から下へ命令を運ぶ経路を descending(下行性)、体から上へ情報を運ぶ経路を ascending(上行性)という。","下行性のうち、今日学ぶ皮質脊髄路と皮質核路をまとめて錐体路系と呼ぶ。自分の意思で動かす運動(随意運動)を担う。それ以外の運動の経路(網様体脊髄路や前庭脊髄路など、Day 5)は錐体外路系と呼ばれ、運動の調節を担う(Day 11)。","上行性のうち、今日学ぶ後索-内側毛帯路と脊髄視床路が、体性感覚(皮膚や筋で感じる感覚)の経路にあたる。"]},{"h":"経路を追うための3つの言葉","b":["1. 何次ニューロン:感覚の経路では、体で感じた情報を最初に受け取る神経細胞を1次ニューロン(first-order neuron)、次を2次、その次を3次と呼ぶ。感覚の経路は、ほぼすべて3本のリレーで大脳まで届く。","2. 交叉(decussation):経路の線維が正中を越えて反対側へ渡ること。脳と体の左右は入れ替わっていて、大脳の右半分が体の左半分を担当する。そのため、大脳と体を結ぶ経路は、必ずどこかで1回交叉する。経路ごとに違うのは、交叉する場所だけ。","3. 視床:大脳の奥にある灰白質のかたまり(Day 9)。においを除くすべての感覚は、大脳皮質に届く前に視床で3次ニューロンに乗り換える。体の感覚は、視床の VPL(ventral posterolateral nucleus 後外側腹側核)という部分で乗り換える。"]},{"h":"感覚の入り口:受容器","b":["receptor(受容器)は、体の中や表面にあって、圧力・熱・伸び具合などの刺激を電気信号に変える構造。1次ニューロンの突起の先端そのものか、その先端を包む小さな器官。感覚の種類ごとに、違う受容器がある。","- free nerve endings(自由神経終末):何にも包まれていない、むき出しの神経の先端。痛みと温度を感じる。","- Meissner corpuscle(マイスナー小体)と Merkel disc(メルケル盤):皮膚の浅い所にあり、細かい触覚を感じる。指先に特に多い。","- Pacinian corpuscle(パチニ小体):皮膚の深い所にある玉ねぎのような層状の小体。振動と強い圧を感じる。","- Ruffini corpuscle(ルフィニ小体):皮膚が引き伸ばされるのを感じる。","- muscle spindle(筋紡錘):筋の中にある細長い器官。筋がどれだけ伸びたかを感じる。","- Golgi tendon organ(ゴルジ腱器官):筋と腱のつなぎ目にあり、筋がどれだけ強く引っぱっているかを感じる。","筋紡錘とゴルジ腱器官の情報は、手足が今どんな位置にあり、どう動いているかの感覚になる。これを proprioception(固有感覚)という。","どの受容器から来ても、1次ニューロンの細胞体は後根神経節にある(Day 5)。顔の場合は三叉神経節(Day 3)。"]},{"h":"後索-内側毛帯路:脊髄の中","b":["細かい触覚、振動、手足の位置の感覚を運ぶ経路。dorsal column-medial lemniscus pathway という。脊髄では後索(dorsal column)、脳幹では内側毛帯(medial lemniscus)を通るので、この名前になった。","1. 指先などの受容器で刺激を感じる。","2. 1次ニューロン(細胞体は後根神経節)の突起が、後根から脊髄に入る。","3. 後角を素通りして、そのまま同じ側の後索に入り、上へ向かう。脚と体の下半分からの線維は内側の薄束、腕と体の上半分からの線維は外側の楔状束を通る(Day 5)。","4. 1次ニューロンの線維は、脊髄の中では左右を渡らずに、延髄まで上りきる。","!img conscious-proprioception.jpg | 意識にのぼる深部感覚。U は上肢(腕)から、L は下肢(脚)からの経路。","深部感覚とは、皮膚より深い所(筋・腱・関節)で感じる感覚のこと。前のページで学んだ固有感覚(手足の位置と動きの感覚)がその中心。","図の吹き出しのとおり、深部感覚のうち意識にのぼるものは、細かい触覚と同じ後索-内側毛帯路を通る。後索を上って延髄の薄束核と楔状束核に届き、反対側へ渡って内側毛帯になり、視床の VPL から中心後回へ。","図の「毛帯交叉」は、薄束核と楔状束核から出た線維が反対側へ渡る場所のこと。次のページで学ぶ内弓状線維が交叉する所で、sensory decussation(感覚交叉)とも呼ぶ。"]},{"h":"後索-内側毛帯路:延髄から大脳まで","b":["5. 延髄の下部で、薄束の線維は nucleus gracilis(薄束核)、楔状束の線維は nucleus cuneatus(楔状束核)に届き、2次ニューロンに情報を渡す。","6. 2次ニューロンの軸索は、前へ弧を描きながら正中を越えて反対側へ渡る。この弧を描く線維を internal arcuate fibers(内弓状線維)という。ここが交叉の場所。","7. 反対側へ渡った線維は、平たい束にまとまって上へ向かう。これが medial lemniscus(内側毛帯)。毛帯(lemniscus)はリボンという意味。脳幹の被蓋を通る(Day 1)。","8. 視床の VPL に届き、3次ニューロンに情報を渡す。","9. 3次ニューロンの軸索は、内包の後脚(Day 11 で学ぶ、大脳の奥の白質の通り道)を通って、大脳の postcentral gyrus(中心後回:頭のてっぺん近くを横に走る脳回)にある primary somatosensory cortex(一次体性感覚野)に届く(Day 13)。","交叉は延髄。","!img dorsal-column-medial-lemniscus.jpg | 精細触覚(後索-内側毛帯路)。U は上肢(腕)から、L は下肢(脚)からの経路。","図の「識別型」は、触れた場所や形を細かく区別できる、という意味。","右下の脊髄で、下肢からの線維(L)は内側の薄束に、上肢からの線維(U)は外側の楔状束に入る。延髄でそれぞれ薄束核と楔状束核に届き、反対側へ渡って内側毛帯になる。そこから視床の VPL を経て中心後回へ。","図の吹き出しのとおり、腕と脚で、通る束と届く核が違うことに注意する。"]},{"h":"脊髄視床路","b":["痛みと温度を運ぶ経路。spinothalamic tract という。脊髄から視床へ直接行く線維なのでこの名前。","1. 自由神経終末で痛みや熱さを感じる。","2. 1次ニューロン(細胞体は後根神経節)の突起が、後根から脊髄に入る。","3. 後角の先端の Lissauer's tract(リッサウアー路)で、上下に1〜2髄節分枝分かれする。","4. 後角(主に I・II・V 層)で、2次ニューロンに情報を渡す。","5. 2次ニューロンの軸索は、すぐに中心管の前の anterior white commissure(前白交連)を通って反対側へ渡る。ここが交叉の場所。","6. 反対側の側索を、外側脊髄視床路として上へ向かう。脳幹では被蓋の外側寄りを通る。","7. 視床の VPL に届き、3次ニューロンに情報を渡す。","8. 内包の後脚を通って、中心後回の一次体性感覚野に届く。","交叉は、線維が入ったその高さの脊髄。後索-内側毛帯路との最大の違いはここ。","!img spinothalamic-pain-temperature.jpg | 温度覚と痛覚(外側脊髄視床路)。脊髄に入ってすぐ反対側へ渡る。","図の「後角 海綿質」は、後角の先端にある、小さな細胞が集まった層。substantia gelatinosa(膠様質)とも呼び、Rexed の II 層にあたる。痛みと温度の情報は、この付近で2次ニューロンに渡される。","脳幹に入ると、脊髄視床路の線維は spinal lemniscus(脊髄毛帯)と呼ばれる束になって上る。","!img anterior-spinothalamic-crude-touch.jpg | 粗大触圧覚(前脊髄視床路)。経路の形は、痛みと温度の経路とほぼ同じ。","粗大触圧覚とは、どこを触られたかをはっきり区別できない、大まかな触覚と圧覚のこと。細かい触覚(精細触覚)が後索-内側毛帯路を通るのに対して、こちらは anterior spinothalamic tract(前脊髄視床路)を通る。","2次ニューロンは後角の真ん中あたり(図の「後角固有核」)にあり、軸索は反対側へ渡って前索を上る。脳幹では外側脊髄視床路と一緒に脊髄毛帯となり、視床の VPL、内包の後脚を経て中心後回に届く。"]},{"h":"2つの感覚経路を比べる","b":["2本の感覚経路は、3本のリレーで視床の VPL を通り中心後回に届く、という点は同じ。違いは、2次ニューロンの場所と交叉の位置。","後索-内側毛帯路:2次ニューロンは延髄(薄束核・楔状束核)。交叉は延髄。だから脊髄の中では、線維は体と同じ側を上っている。","脊髄視床路:2次ニューロンは脊髄の後角。交叉は入った高さの脊髄。だから脊髄の中では、線維は体と反対側を上っている。","この違いが、脊髄の片側が壊れたときの症状(Brown-Séquard 症候群、Day 5)を生む。右の脊髄が切れると、右側の細かい触覚(後索はまだ右側を上っている)と、左側の痛みと温度(左から来た線維はすでに右へ渡ってきている)が分からなくなる。"]},{"h":"皮質脊髄路:大脳から脳幹まで","b":["手足を自分の意思で動かす命令の経路。corticospinal tract という。大脳皮質(cortex)から脊髄(spinal cord)へ行くのでこの名前。延髄の錐体を通るので、pyramidal tract(錐体路)ともいう。","1. 出発点は、大脳の precentral gyrus(中心前回:中心後回のすぐ前の脳回)にある primary motor cortex(一次運動野)。皮質の6つの層のうち5番目の層(Day 13)にある、特に大きな神経細胞 Betz cells(ベッツ細胞)が代表。","2. 軸索は、大脳の白質を扇形に集まりながら下る(この扇形を corona radiata 放線冠という)。","3. 内包の後脚の前3分の2を通る。","4. 中脳では、大脳脚(crus cerebri)の中央の5分の3を通る(Day 1)。","5. 橋では、橋底部の橋核の間を、細い束に分かれて縦に通り抜ける。","6. 延髄では、前面の錐体を通る。"]},{"h":"皮質脊髄路:延髄から筋まで","b":["7. 延髄の下端で、85〜90%の線維が正中を越えて反対側へ渡る。これを pyramidal decussation(錐体交叉)という。","8. 交叉した線維は、反対側の脊髄の側索を lateral corticospinal tract(外側皮質脊髄路)として下る。","9. 交叉しなかった残りの10〜15%は、同じ側の前索を anterior corticospinal tract(前皮質脊髄路)として下る。こちらは首と胸の上の高さまでしかなく、終わる高さで反対側へ渡る。主に体幹の筋を担当する。","10. どちらも最後は、脊髄の前角の IX 層にある運動ニューロンに命令を渡す。","11. 前角の運動ニューロンの軸索が、前根から脊髄神経を通って筋に届く。","!img pyramidal-tract.jpg | 錐体路(皮質脊髄路)。中心前回から脊髄の前角まで。","線維は中心前回から内包、大脳脚の中央、橋、延髄の錐体を通る。図の「橋縦束」は、橋底部を縦に通り抜ける皮質脊髄路の束のこと。","延髄の下端の錐体交叉で大部分が反対側へ渡って外側皮質脊髄路になり、渡らなかった線維は前皮質脊髄路として下る。最後は前角の運動ニューロンに命令を渡す。","吹き出しのとおり、中心前回の顔の領域から出る線維は、皮質延髄路(皮質核路)になる(2つ後のページ)。"]},{"h":"上位運動ニューロンと下位運動ニューロン","b":["運動の命令の経路は、2本の神経細胞のリレーと考える。","- upper motor neuron(上位運動ニューロン):大脳皮質の神経細胞から、脊髄の前角(脳神経の場合は脳幹の運動核)までの部分。皮質脊髄路がこれ。","- lower motor neuron(下位運動ニューロン):前角(または脳幹の運動核)の神経細胞から、筋までの部分。","どちらが壊れても筋は動かなくなるが、症状に違いがある。","上位運動ニューロンが壊れた場合:筋そのものと下位運動ニューロンは残っているが、大脳からの調節がなくなる。下位運動ニューロンは本来、大脳から常にブレーキをかけられている。そのブレーキが外れるので、筋が突っ張り(痙性麻痺)、膝をたたいたときの反射(腱反射)が強くなる。足の裏をこすると親指が上へ反り返る Babinski sign(バビンスキー徴候)が出る。","下位運動ニューロンが壊れた場合:筋へ届く神経そのものがなくなる。筋はだらりと力が入らず(弛緩性麻痺)、反射もなくなり、使われない筋はやせていく(筋萎縮)。"]},{"h":"顔とのどへの運動命令:皮質核路","b":["顔やのどの筋は、脊髄ではなく、脳幹の運動の脳神経核(Day 1)の運動ニューロンが動かす。その運動ニューロンへ命令を運ぶのが corticobulbar tract(皮質核路)。bulbar は延髄を含む脳幹の古い呼び名。","皮質核路も一次運動野から出て、内包の膝(後脚より少し前、Day 11)を通り、脳幹で各運動核へ枝を出して終わる。","ほとんどの運動核は、左右両方の大脳皮質から命令を受ける。だから片側の大脳が壊れても、多くの顔やのどの筋は動かせる。例外は、顔面神経核のうち顔の下半分を担当する部分と、舌下神経核で、主に反対側の皮質だけから命令を受ける。そのため、脳梗塞などで片側の皮質核路が壊れると、反対側の口の周りが動かなくなり(額は動く、Day 3)、舌を出すと壊れた皮質の反対側へ曲がる。","!img corticobulbar-tract.jpg | 皮質延髄路(皮質核路)。中心前回から、脳幹の運動の脳神経核へ。","図の「皮質延髄路」は皮質核路の別名。図では、動眼神経核・外転神経核・顔面神経核・舌下神経核への線維が描かれている。注にあるとおり、三叉神経運動核と疑核にも届く。","吹き出しのとおり、皮質核路も皮質脊髄路と同じく、中心前回の5層の錐体細胞(Day 13)から始まる。"]},{"h":"壊れた場所から症状を予想する","b":["ここまでの3本の経路を使えば、壊れた場所から症状を予想できる。","脊髄の右半分が壊れた場合(壊れた高さより下):","- 右側の運動の麻痺:外側皮質脊髄路は延髄ですでに交叉し、右の脊髄を下って右の体へ向かっている。","- 右側の細かい触覚・位置の感覚の消失:後索は右の体から来て、まだ交叉せずに右を上っている。","- 左側の痛みと温度の消失:左の体から来た線維は、脊髄に入ってすぐ右へ渡ってきている。","延髄より上(たとえば右の内包)が壊れた場合:3本とも交叉したあとなので、左半身の運動と、すべての種類の感覚がそろって失われる。","口頭試験では、経路の説明のあとにこの種の質問がよく続く。答えるときは「この経路はどこで交叉するから」と理由から言う。"]}],"terms":[{"q":"sensory decussation","a":"毛帯交叉(感覚交叉)。延髄で内弓状線維が交叉する所"},{"q":"substantia gelatinosa","a":"膠様質(海綿質)。後角の先端、II 層"},{"q":"spinal lemniscus","a":"脊髄毛帯。脳幹での脊髄視床路の束"},{"q":"crude touch","a":"粗大触圧覚。場所を細かく区別できない大まかな触覚"},{"q":"long tracts","a":"長経路。脳と脊髄を結ぶ長い線維路"},{"q":"receptor","a":"受容器。刺激を電気信号に変える"},{"q":"free nerve endings","a":"自由神経終末。痛み・温度"},{"q":"Meissner corpuscle","a":"マイスナー小体。細かい触覚"},{"q":"Pacinian corpuscle","a":"パチニ小体。振動と圧"},{"q":"muscle spindle","a":"筋紡錘。筋の長さ(固有感覚)"},{"q":"Golgi tendon organ","a":"ゴルジ腱器官。筋の張力"},{"q":"proprioception","a":"固有感覚。体の位置と動きの感覚"},{"q":"first-order neuron","a":"1次ニューロン。受容器から中枢へ"},{"q":"nucleus gracilis / cuneatus","a":"薄束核 / 楔状束核。延髄、後索路の2次ニューロン"},{"q":"internal arcuate fibers","a":"内弓状線維。延髄で正中を渡る後索路の線維"},{"q":"medial lemniscus","a":"内側毛帯。後索路の交叉後の線維束"},{"q":"VPL","a":"視床後外側腹側核。体の感覚の中継"},{"q":"anterior white commissure","a":"前白交連。脊髄で痛み温度の線維が渡る"},{"q":"pyramidal decussation","a":"錐体交叉。延髄下端、皮質脊髄路の交叉"},{"q":"Betz cells","a":"ベッツ細胞。一次運動野第5層の巨大錐体細胞"},{"q":"upper motor neuron","a":"上位運動ニューロン。皮質から前角まで"},{"q":"lower motor neuron","a":"下位運動ニューロン。前角(脳神経核)から筋まで"},{"q":"corticobulbar tract","a":"皮質核路。皮質から脳神経運動核へ"},{"q":"Babinski sign","a":"バビンスキー徴候。上位運動ニューロン障害の徴候"}],"facts":[{"q":"意識にのぼる深部感覚の経路","a":"後索-内側毛帯路(細かい触覚と同じ)"},{"q":"粗大触圧覚を運ぶ経路","a":"前脊髄視床路"},{"q":"前脊髄視床路の2次ニューロン","a":"後角固有核"},{"q":"下肢の精細触覚が通る後索の束","a":"薄束(内側)"},{"q":"皮質核路が届く運動の核(図の4つ+2つ)","a":"動眼・外転・顔面・舌下神経核、三叉神経運動核、疑核"},{"q":"長経路の3本","a":"後索-内側毛帯路・脊髄視床路・皮質脊髄路"},{"q":"痛み・温度の受容器","a":"自由神経終末"},{"q":"振動を感じる受容器","a":"Pacini 小体"},{"q":"細かい触覚の受容器","a":"Meissner 小体・Merkel 盤"},{"q":"筋の長さを感じる受容器","a":"筋紡錘"},{"q":"筋の張力を感じる受容器","a":"Golgi 腱器官"},{"q":"体の感覚の1次ニューロンの細胞体","a":"後根神経節"},{"q":"顔の感覚の1次ニューロンの細胞体","a":"三叉神経節(固有感覚だけは中脳路核)"},{"q":"後索路の2次ニューロンがある場所","a":"延髄の薄束核・楔状束核"},{"q":"後索路が交叉する場所","a":"延髄(internal arcuate fibers)"},{"q":"後索路の交叉後の線維束","a":"Medial lemniscus"},{"q":"後索路の3次ニューロン","a":"視床 VPL"},{"q":"後索路の最終目的地","a":"中心後回(3・1・2野)"},{"q":"脊髄視床路の2次ニューロンがある場所","a":"後角(lamina I・II・V)"},{"q":"脊髄視床路が交叉する場所","a":"入った高さの脊髄、前白交連"},{"q":"脊髄視床路が上る索","a":"反対側の側索"},{"q":"脊髄視床路の3次ニューロン","a":"視床 VPL"},{"q":"皮質脊髄路の起始","a":"中心前回の第5層 Betz 細胞"},{"q":"皮質脊髄路が通る内包の部位","a":"後脚の前2/3"},{"q":"皮質脊髄路が通る大脳脚の部位","a":"中央3/5"},{"q":"皮質脊髄路が延髄で通る構造","a":"錐体"},{"q":"錐体交叉で交叉する割合","a":"85〜90%"},{"q":"交叉した皮質脊髄路の名前","a":"Lateral corticospinal tract"},{"q":"交叉しない皮質脊髄路の名前","a":"Anterior corticospinal tract"},{"q":"皮質脊髄路が終わる細胞","a":"前角の運動ニューロン(lamina IX)"},{"q":"上位運動ニューロンの範囲","a":"皮質から前角(脳神経核)まで"},{"q":"下位運動ニューロンの範囲","a":"前角から筋まで"},{"q":"皮質核路が通る内包の部位","a":"膝(genu)"},{"q":"皮質核路で反対側優位に支配される核","a":"顔面神経核下半分と舌下神経核"},{"q":"右脊髄半切で右に失われるもの","a":"運動と位置覚・振動覚"},{"q":"右脊髄半切で左に失われるもの","a":"痛覚・温度覚"},{"q":"上位運動ニューロン障害の徴候","a":"痙性麻痺・腱反射亢進・Babinski 陽性"},{"q":"下位運動ニューロン障害の徴候","a":"弛緩性麻痺・筋萎縮・反射消失"}]},{"title":"7 小脳","secs":[{"title":"解剖と区分","cards":[{"q":"Cerebellumの解剖学的構成は?","a":"2つのhemispheresと正中のvermis。anterior lobe、posterior lobe、flocculonodular lobe","s":2},{"q":"葉を分けるfissureは?","a":"Primary fissure(anterior / posterior lobe)、dorsolateral (posterolateral) fissure(posterior / flocculonodular)、horizontal fissure","s":0},{"q":"半球の小葉を上→下に","a":"Anterior quadrangular、posterior quadrangular (simple)、superior semilunar、inferior semilunar、biventral。付属:tonsilとflocculus","s":0},{"q":"Vermisの区分を上→下に","a":"Lingula、central lobule、culmen、declive、folium、tuber、pyramid、uvula、nodule","s":1},{"q":"Tonsilの臨床的意義は?","a":"Foramen magnumへherniationしmedullaを圧迫する。PICAのcaudal loopの目印","s":1},{"q":"機能的(系統発生的)区分は?","a":"Vestibulocerebellum = archicerebellum(flocculonodular lobe)。Spinocerebellum = paleocerebellum(vermisとanterior lobe)。Cerebro- (ponto-) cerebellum = neocerebellum(posterior lobeの半球)","s":2},{"q":"縦方向の3区分は?","a":"Vermis、paravermis (intermediate)、hemisphere","s":0},{"q":"Deep nucleiを外→内に","a":"Dentate、emboliform、globose、fastigial(emboliform + globose = interposed)","s":2,"n":"Don't Eat Greasy Food:Dentate, Emboliform, Globose, Fastigial(外→内)"},{"q":"各deep nucleusと対応する区分は?","a":"Fastigial:vestibulocerebellumとvermis。Interposed:spinocerebellum。Dentate:neocerebellum","s":2},{"q":"Neocerebellumの出力核は?","a":"Dentate nucleus(最大)","s":1}]},{"title":"皮質と回路","cards":[{"q":"Cerebellar cortexの3層は?","a":"Molecular layer、Purkinje layer、granular layer","s":2},{"q":"Molecular layerにあるものは?","a":"Purkinje cellsのdendrites、granule cellsの軸索(parallel fibers)、stellate cellsとbasket cells","s":0},{"q":"Granular layerにあるものは?","a":"Granule cellsとGolgi cells。mossy fibersが終わる(rosettes / glomeruli)","s":0},{"q":"External granule cell layerとは?","a":"胎生期の層で生後1年までに退縮。medulloblastomaの起源とされる","s":0},{"q":"Purkinje cellsの機能は?","a":"皮質の唯一の出力細胞。GABAでdeep cerebellar nuclei(とlateral vestibular n.)を抑制する","s":2},{"q":"皮質への2種の求心線維は?","a":"Climbing fibers:inferior oliveから、Purkinje cellに直接。Mossy fibers:それ以外(spinal cord、pontine nuclei、vestibular nn.)から、granule cells経由。どちらも興奮性","s":2},{"q":"3つ目の求心系は?","a":"Aminergic fibers:locus coeruleus(norepinephrine)とraphe nuclei(serotonin)","s":0},{"q":"4種のinterneuronと性質は?","a":"Granule cells(興奮性、glutamate)。Stellate・basket・Golgi cells(抑制性、GABA)","s":1},{"q":"Purkinje cellsはどう制御される?","a":"Granule cellsが興奮させる。Stellateとbasket cellsが直接抑制。Golgi cellsはgranule cellsを抑制して間接的に調節","s":1},{"q":"皮質回路を一文で","a":"Mossyとclimbing fibersが(deep nucleiに側副枝を出しつつ)Purkinje cellsを興奮させ、Purkinje cellsがdeep nucleiを抑制して出力を調節する","s":2},{"q":"Deep nucleiは求心も遠心も持つ?","a":"持つ。求心:mossy / climbing fibersの側副枝(興奮)とPurkinje cells(抑制)。遠心:小脳からの出力そのもの","s":1}]},{"title":"連絡とpeduncles","cards":[{"q":"3つのpeduncleと主な内容は?","a":"Superior:主な遠心路(dentate・interposedからred nucleusとthalamusへ)+ ventral spinocerebellar tract。Middle:pontocerebellar fibersのみ(最大)。Inferior:dorsal spinocerebellar、cuneocerebellar、olivocerebellar、vestibulocerebellar、reticulocerebellar + cerebellovestibular遠心","s":2},{"q":"小脳への求心の起源は?","a":"Cerebral cortex(pontine nuclei・inferior olive・reticular formation経由)、spinal cord、vestibular nuclei、tectum / red nucleus","s":0},{"q":"Corticopontocerebellar路は?","a":"Cortex → internal capsule → 同側pontine nuclei → 交叉 → middle peduncle → 対側小脳半球(mossy fibers)","s":1},{"q":"Dorsal spinocerebellar tractは?","a":"同側Clarke's column (C8–L2)から、inferior peduncleを通り同側小脳へ。下半身の無意識のproprioception","s":0},{"q":"Ventral spinocerebellar tract (Gowers)は?","a":"脊髄で交叉し、superior peduncleで入るとき再交叉(double crossed)。結果は同側","s":0},{"q":"Cuneocerebellar tractは?","a":"Accessory cuneate nucleusからinferior peduncle経由。上半身のproprioception","s":0},{"q":"Dentateからの遠心路は?","a":"Dentate → superior peduncle → 交叉 → 対側thalamus VL → motor cortex → pyramidal tractが再び交叉。結果、小脳は同側の身体を制御","s":2},{"q":"Interposedからの遠心路は?","a":"Superior peduncle → 対側red nucleus → rubrospinal tract(再交叉)。同側四肢の屈筋tone","s":0},{"q":"Fastigialからの遠心路は?","a":"Inferior peduncle → 両側lateral vestibular nn.とreticular formation。抗重力伸筋のtone","s":0},{"q":"各区分の機能は?","a":"Vestibulo:balanceと眼・頭の協調。Spino:運動指令と末梢からのfeedbackを比較して修正、tone。Ponto:随意運動の力・方向・範囲の調節、巧緻性","s":2},{"q":"小脳の機能を一文で","a":"大脳皮質のmotor outputと末梢からのproprioceptive inputを比較し、運動出力を微調整する","s":1},{"q":"小脳から脊髄への直接路はある?","a":"ない。vestibular nuclei、red nucleus、reticular formation、motor cortexを介する","s":0}]}],"rev":[5,3],"lesson":[{"h":"今日学ぶこと","b":["今日は cerebellum(小脳)を学ぶ。小脳は試験でほぼ毎回聞かれる。","流れは、小脳が何をする器官か → 外から見た形 → 働きによる3つの区分 → 中にある4つの核 → 表面の皮質の3層と細胞 → 皮質の中の回路 → 脳幹とつなぐ3本の脚 → 情報の出入りの道、の順。"]},{"h":"小脳は何をする器官か","b":["小脳の仕事は、運動のずれを直すこと。","体を動かすとき、大脳は「こう動け」という命令を出す。同時に、筋や関節の受容器(筋紡錘など、Day 6)は「実際にはこう動いている」という情報を返してくる。小脳はこの2つを受け取って比べ、ずれがあれば修正の信号を出す。","たとえば、コップに手を伸ばすとき、手が行き過ぎそうになると途中でブレーキをかけ、ぴたりと止める。歩くときに体が傾けば、すぐに立て直す。こうした細かい調整を、意識しないうちに小脳が行っている。","小脳が壊れても、筋の力はなくならない(力を出すのは大脳と脊髄の運動ニューロン)。しかし動きがぎこちなくなる。手を伸ばすと行き過ぎたり手前で止まったりし、歩くとふらつく。これを ataxia(運動失調)という。"]},{"h":"小脳はどこにあるか","b":["小脳は、脳幹の後ろ、大脳の後頭葉の下にある。頭の後ろの下の方、首の付け根の上あたり。","小脳と大脳の後頭葉の間には、脳を包む硬い膜(硬膜)が水平な仕切りとして張っている。これを tentorium cerebelli(小脳テント)という。小脳の上にテントを張ったような形なのでこの名前(Day 18)。","小脳と脳幹の間のすき間が、第四脳室(Day 1)。"]},{"h":"外から見た形","b":["小脳は、正中の細い部分と、左右の大きなふくらみからなる。","- vermis(虫部):正中の細い部分。横じわが入っていて、虫(イモムシ)のように見えるのでこの名前。","- cerebellar hemispheres(小脳半球):左右の大きなふくらみ。","表面には、細かい横じわ(folia、小脳回)がびっしり並ぶ。そのうち特に深い溝が、小脳を3つの葉に分ける。","- primary fissure(第一裂):上の面を横切る深い溝。これより前が anterior lobe(前葉)。","- 第一裂より後ろの大部分が posterior lobe(後葉)。いちばん大きい。","- 下の面の前の方、脳幹に接する所に、小さな flocculonodular lobe(片葉小節葉)がある。左右の小さな房(flocculus 片葉)と、正中の小さな結節(nodulus 小節)からなる。後葉との境の溝が posterolateral fissure(後外側裂)。","下の面の正中のすぐ両脇には、丸く垂れ下がった部分 tonsil(小脳扁桃)がある。のどの扁桃に形が似ているのでこの名前。頭の中の圧が上がって脳が下へ押されると、扁桃が頭蓋骨の底の大きな穴(大後頭孔)に押し込まれ、すぐ前にある延髄を圧迫する。延髄には呼吸の中枢があるので命に関わる。"]},{"h":"働きで3つに分ける","b":["小脳は、どこから情報を受けるかによって3つに分けると、働きが理解しやすい。3つは、進化の古い順にも並んでいる。","1. vestibulocerebellum(前庭小脳):片葉小節葉。耳の奥の前庭器官(Day 4)から、体のバランスの情報を受ける。体のバランスを保ち、頭が動いたときの目の動きを調整する。最も古い部分なので archicerebellum(原小脳)ともいう。","2. spinocerebellum(脊髄小脳):虫部と、半球のうち虫部に近い部分(paravermis 傍虫部)。主に前葉。脊髄から、体や手足の筋の伸び具合の情報を受ける。立つ姿勢と歩き方、筋の張り具合(筋緊張)を調整する。次に古いので paleocerebellum(古小脳)ともいう。","3. cerebrocerebellum(大脳小脳):半球の外側の大部分。後葉の大部分。大脳皮質から、これから行う運動の計画の情報を受ける(橋を経由するので pontocerebellum 橋小脳ともいう)。手足の細かく素早い動きを、順序よく正確に行えるように調整する。最も新しいので neocerebellum(新小脳)ともいう。","覚え方:前庭から来れば前庭小脳、脊髄から来れば脊髄小脳、大脳から来れば大脳小脳。"]},{"h":"小脳の中にある4つの核","b":["小脳の表面は灰白質の皮質で、その内側は白質。白質の奥深くに、左右それぞれ4つの灰白質のかたまりが埋まっている。これを deep cerebellar nuclei(小脳核、深部核)という。","小脳から外へ出ていく情報は、ほぼすべてこの4つの核から出る。皮質は計算をする場所で、核は出口、と考えるとよい。","外側から順に:","1. dentate nucleus(歯状核):いちばん大きい。縁がギザギザで、歯並びのように見える。","2. emboliform nucleus(栓状核):歯状核の入り口に、栓のようにはまっている。","3. globose nucleus(球状核):小さな球の集まり。","4. fastigial nucleus(室頂核):いちばん内側、第四脳室の天井の頂点(fastigium 室頂)のすぐ上にある。","覚え方は、外側から Don't Eat Greasy Food(Dentate、Emboliform、Globose、Fastigial)。","栓状核と球状核は働きが似ているので、まとめて interposed nucleus(中位核:間に置かれた核)と呼ぶ。"]},{"h":"3つの区分と4つの核の対応","b":["皮質の各部分は、すぐ内側にある核に情報を送る。外側の皮質は外側の核へ、内側の皮質は内側の核へ。","- 半球の外側(大脳小脳)→ 歯状核(いちばん外側)","- 傍虫部(脊髄小脳の一部)→ 中位核(栓状核と球状核)","- 虫部(脊髄小脳の一部)と片葉小節葉(前庭小脳)→ 室頂核(いちばん内側)","片葉小節葉の一部の皮質は、例外として、小脳核を通らずに直接、脳幹の前庭神経核へ線維を送る。"]},{"h":"小脳の皮質は3層","b":["小脳の皮質は、どこを切っても同じ3層でできている。表面から順に:","1. molecular layer(分子層):いちばん外側。神経細胞の体は少なく、ほとんどが細い突起(樹状突起と軸索)の網。","2. Purkinje cell layer(プルキンエ細胞層):1列に並んだ大きな神経細胞の層。","3. granular layer(顆粒層):いちばん内側。小さな神経細胞が、ぎっしり詰まっている。","胎児のときは、分子層のさらに外側に、もう1層(external granular layer 外顆粒層)がある。ここの細胞は内側へ移動して顆粒層を作り、外顆粒層は生後1年ほどで消える。小児の脳腫瘍の1つ(髄芽腫)は、この層の細胞から生じると考えられている。"]},{"h":"小脳皮質の細胞","b":["小脳の皮質には、5種類の神経細胞がある。","Purkinje cell(プルキンエ細胞):プルキンエ細胞層に並ぶ大きな細胞。発見者の名前から。樹状突起(情報を受け取る枝)を分子層に向かって、平たい扇のように広げている。軸索は白質を通って小脳核へ行く。皮質から外へ出る軸索を持つのはプルキンエ細胞だけで、皮質の唯一の出口。","granule cell(顆粒細胞):顆粒層にぎっしり詰まった小さな細胞。軸索を分子層まで上げ、そこで T の字に左右へ分かれて、小脳のしわに沿って長く走る。この横に走る線維を parallel fibers(平行線維)という。平行線維は、扇を突き刺すようにたくさんのプルキンエ細胞の樹状突起を横切り、その全部に信号を伝える。","stellate cell(星状細胞)と basket cell(籠細胞):分子層にいる小さな細胞。プルキンエ細胞にブレーキをかける。籠細胞は、プルキンエ細胞の細胞体を籠のように包むのでこの名前。","Golgi cell(ゴルジ細胞):顆粒層にいる。顆粒細胞にブレーキをかける。","信号を伝える物質の種類で、興奮させる(相手を働かせる)細胞と、抑制する(相手にブレーキをかける)細胞に分けられる。顆粒細胞だけが興奮性(glutamate グルタミン酸を使う)。プルキンエ細胞・星状細胞・籠細胞・ゴルジ細胞は、すべて抑制性(GABA ギャバを使う)。"]},{"h":"小脳皮質に入ってくる2種類の線維","b":["外から小脳の皮質に情報を運び込む線維は2種類ある。","climbing fibers(登上線維):延髄の inferior olivary nucleus(下オリーブ核、Day 1)からだけ来る。1本の登上線維が1つのプルキンエ細胞の樹状突起に、ツタが木に登るように巻きつき、非常に強い信号を送る。この形からこの名前がついた。","mossy fibers(苔状線維):下オリーブ核以外の、すべての場所(脊髄、橋核、前庭神経核など)から来る。顆粒層で顆粒細胞に信号を渡す。先端が苔のようにふさふさした形をしているのでこの名前。顆粒細胞が平行線維で多くのプルキンエ細胞に信号を広げるので、1本の苔状線維の情報が多くのプルキンエ細胞に届く。","どちらの線維も興奮性。また、どちらも皮質に入る前に、途中で小脳核にも枝を出して、核を直接興奮させる。","このほかに、脳幹の青斑核(noradrenaline を出す)と縫線核(serotonin を出す)から、小脳全体に薄く広がる線維もある。"]},{"h":"小脳の回路を一文で","b":["ここまでをつなげると、小脳の回路は次のようになる。","1. 外からの情報(苔状線維と登上線維)が入ってくる。","2. その情報は、まず小脳核を直接興奮させる(途中の枝)。","3. 同時に、皮質に入って、最終的にプルキンエ細胞を興奮させる(苔状線維は顆粒細胞を経由して、登上線維は直接)。","4. 興奮したプルキンエ細胞は、小脳核に GABA でブレーキをかける。","5. 小脳核は、2番のアクセルと4番のブレーキの差し引きの分だけ、外へ信号を出す。","つまり、小脳核は入ってきた情報で興奮させられ、皮質のプルキンエ細胞がそれを調節して削る。皮質で計算された「どれだけ修正するか」が、ブレーキのかけ方として小脳核の出力に反映される。"]},{"h":"脳幹とつながる3本の脚","b":["小脳は、左右それぞれ3本の太い線維の束で脳幹とつながっている。これを cerebellar peduncles(小脳脚)という。小脳に出入りするすべての線維は、この3本のどれかを通る。","superior cerebellar peduncle(上小脳脚):中脳とつながる。小脳から出ていく線維の主な通り道。歯状核と中位核から出た線維が、ここを通って中脳の赤核と視床へ向かう。入ってくる線維では、前脊髄小脳路だけがここを通る。","middle cerebellar peduncle(中小脳脚):橋とつながる。3本の中でいちばん太い。入ってくる線維だけでできている。大脳皮質から橋の橋核(Day 1)に届いた情報が、橋核から反対側へ渡ってここを通り、小脳半球に入る。","inferior cerebellar peduncle(下小脳脚):延髄とつながる。主に入ってくる線維。脊髄から来る後脊髄小脳路(Day 5 のクラーク核から)と楔状束小脳路、下オリーブ核からの登上線維、前庭神経核からの線維が通る。出ていく線維では、室頂核から前庭神経核へ向かう線維がここを通る。","!img unconscious-proprioception-spinocerebellar.jpg | 意識されない深部感覚。筋の伸び具合などの情報が、脊髄から小脳へ届く。図の「上」は上小脳脚、「下」は下小脳脚。","筋や腱からの深部感覚の多くは、意識にのぼらずに小脳へ送られ、動きのずれを直すのに使われる。吹き出しのとおり、途中で中継する核が体の上下で違う。","- 下半身から:胸髄核(本文のクラーク核、Day 5)で中継し、後脊髄小脳路として同じ側を上り、下小脳脚から小脳に入る。","- 上半身から:延髄の accessory cuneate nucleus(副楔状束核:楔状束核のすぐ外側にある別の核)で中継し、下小脳脚から小脳に入る。ここから出る線維が、本文の楔状束小脳路。","- 前脊髄小脳路:腰髄から上り、このページで学んだとおり、上小脳脚から小脳に入る。"]},{"h":"小脳は体の同じ側を担当する","b":["大脳は体の反対側を担当するが、小脳は体の同じ側を担当する。右の小脳が壊れると、右の手足がぎこちなくなる。その理由は、経路が2回交叉するから。","小脳から手足への道:","1. 右の歯状核から出た線維が、上小脳脚を通る。","2. 中脳で正中を越えて、左へ渡る(1回目の交叉)。","3. 左の視床の VL(ventral lateral nucleus 外側腹側核)に届く。","4. 左の大脳の運動野に届く。","5. 左の運動野からの皮質脊髄路が、延髄の錐体交叉で右へ渡る(2回目の交叉)。","6. 右の手足の筋が動く。","2回渡るので、元の右に戻る。","大脳から小脳への道も交叉する。左の大脳皮質 → 左の橋核 → 正中を越えて右へ → 右の中小脳脚 → 右の小脳半球。左の大脳が計画した運動(右手の運動)の情報が、右の小脳に届く。"]},{"h":"各区分の出口と行き先","b":["前庭小脳(片葉小節葉):室頂核と前庭神経核へ出力し、前庭神経核から脊髄(前庭脊髄路で姿勢を支える筋へ)と目を動かす核(MLF 経由)へ。下小脳脚を通る。体のバランスと目の動き。","脊髄小脳(虫部・傍虫部):虫部は室頂核から前庭神経核と網様体へ、傍虫部は中位核から上小脳脚を通って反対側の赤核へ行き、赤核脊髄路(Day 5)で脊髄へ。姿勢、歩行、筋の張り。","大脳小脳(半球外側):歯状核から上小脳脚を通って反対側の視床 VL へ、そこから運動野と運動前野へ。運動前の計画を調整し、細かい動きを滑らかにする。","小脳から脊髄へ直接行く経路はない。必ず前庭神経核・赤核・網様体・大脳の運動野のどれかを経由する。","大脳基底核(Day 11)も視床の VL・VA を経由して運動野に働きかけるので、小脳と基底核は視床で合流している。"]}],"terms":[{"q":"accessory cuneate nucleus","a":"副楔状束核。上半身の深部感覚を小脳へ中継"},{"q":"cerebellum","a":"小脳"},{"q":"tentorium cerebelli","a":"小脳テント。大脳と小脳を隔てる硬膜"},{"q":"ataxia","a":"運動失調。力はあるのに動きが協調しない"},{"q":"vermis","a":"虫部。小脳の正中部"},{"q":"hemisphere(小脳の)","a":"小脳半球"},{"q":"primary fissure","a":"第一裂。前葉と後葉を分ける"},{"q":"anterior lobe","a":"前葉"},{"q":"posterior lobe","a":"後葉。最大"},{"q":"flocculonodular lobe","a":"片葉小節葉。最小・最古"},{"q":"tonsil","a":"小脳扁桃。下面内側の突起"},{"q":"vestibulocerebellum","a":"前庭小脳 = 片葉小節葉 = archicerebellum"},{"q":"spinocerebellum","a":"脊髄小脳 = 虫部・半球内側 = paleocerebellum"},{"q":"cerebrocerebellum","a":"大脳小脳(橋小脳)= 半球外側 = neocerebellum"},{"q":"dentate nucleus","a":"歯状核。最大・最外側の深部核"},{"q":"interposed nucleus","a":"中位核 = 栓状核 + 球状核"},{"q":"fastigial nucleus","a":"室頂核。最内側の深部核"},{"q":"molecular layer","a":"分子層。小脳皮質の最表層"},{"q":"Purkinje cell","a":"プルキンエ細胞。小脳皮質唯一の出力、GABA"},{"q":"granule cell","a":"顆粒細胞。唯一の興奮性の介在ニューロン"},{"q":"parallel fibers","a":"平行線維。顆粒細胞の軸索"},{"q":"climbing fibers","a":"登上線維。下オリーブ核から Purkinje へ直接"},{"q":"mossy fibers","a":"苔状線維。下オリーブ以外の入力、顆粒細胞へ"},{"q":"inferior olive","a":"下オリーブ核。延髄、登上線維の起始"},{"q":"superior cerebellar peduncle","a":"上小脳脚。主な出力路、中脳へ"},{"q":"middle cerebellar peduncle","a":"中小脳脚。最大、橋核からの入力のみ"},{"q":"inferior cerebellar peduncle","a":"下小脳脚。延髄へ、入力が多い"}],"facts":[{"q":"意識されない深部感覚の中継核(下半身/上半身)","a":"クラーク核(胸髄核)/ 副楔状束核"},{"q":"上小脳脚から小脳に入る脊髄小脳路","a":"前脊髄小脳路"},{"q":"小脳と大脳を隔てる硬膜","a":"小脳テント"},{"q":"小脳の仕事を一言で","a":"運動の誤差の補正(協調)"},{"q":"小脳障害の症状の総称","a":"Ataxia(運動失調)"},{"q":"小脳の正中部の名前","a":"Vermis"},{"q":"前葉と後葉を分ける裂","a":"Primary fissure"},{"q":"最大の葉","a":"Posterior lobe"},{"q":"最小で最も古い葉","a":"Flocculonodular lobe"},{"q":"大後頭孔に押し込まれる構造","a":"Tonsil"},{"q":"片葉小節葉の機能区分名","a":"Vestibulocerebellum(archicerebellum)"},{"q":"虫部・前葉の機能区分名","a":"Spinocerebellum(paleocerebellum)"},{"q":"半球外側の機能区分名","a":"Cerebrocerebellum(neocerebellum)"},{"q":"前庭小脳が担当するもの","a":"バランスと眼の動き"},{"q":"脊髄小脳が担当するもの","a":"姿勢・歩行・筋の張り"},{"q":"大脳小脳が担当するもの","a":"手足の細かい動きの計画"},{"q":"深部核の数","a":"4つ"},{"q":"最も外側の深部核","a":"Dentate nucleus"},{"q":"最も内側の深部核","a":"Fastigial nucleus"},{"q":"中位核を構成する2核","a":"栓状核と球状核"},{"q":"半球外側の出力核","a":"歯状核"},{"q":"虫部の出力核","a":"室頂核"},{"q":"小脳皮質の層の数","a":"3層"},{"q":"最表層の名前","a":"Molecular layer"},{"q":"最深層の名前","a":"Granular layer"},{"q":"Purkinje 細胞が並ぶ層","a":"中間の Purkinje layer"},{"q":"平行線維はどの細胞の軸索","a":"顆粒細胞"},{"q":"小脳皮質の唯一の出力細胞","a":"Purkinje 細胞"},{"q":"Purkinje 細胞の伝達物質","a":"GABA(抑制)"},{"q":"Purkinje 細胞の出力先","a":"深部核(と外側前庭核)"},{"q":"唯一の興奮性の介在ニューロン","a":"顆粒細胞"},{"q":"抑制性の介在ニューロン3つ","a":"Stellate・basket・Golgi cells"},{"q":"登上線維の起始","a":"下オリーブ核"},{"q":"登上線維の行き先","a":"Purkinje 細胞に直接"},{"q":"苔状線維の行き先","a":"顆粒細胞"},{"q":"苔状線維の起始の例","a":"脊髄・橋核・前庭核"},{"q":"最大の小脳脚","a":"Middle cerebellar peduncle"},{"q":"中小脳脚の中身","a":"橋核からの入力線維だけ"},{"q":"主な出力が通る脚","a":"Superior cerebellar peduncle"},{"q":"上小脳脚がつながる脳幹の部位","a":"中脳"},{"q":"下小脳脚がつながる脳幹の部位","a":"延髄"},{"q":"下オリーブからの登上線維が通る脚","a":"Inferior cerebellar peduncle"},{"q":"歯状核の出力が向かう視床核","a":"VL(反対側)"},{"q":"小脳の障害は体のどちら側に出る","a":"同じ側"},{"q":"小脳が同じ側を担当する理由","a":"上小脳脚で交叉し、皮質脊髄路で再交叉するから"}]},{"title":"8 脳室系とCSF","secs":[{"title":"脳室系","cards":[{"q":"Foramen of Monroの境界は?","a":"前・上:column of fornix。後:thalamusの前端(anterior tubercle)","s":1},{"q":"脳室系の構成と連絡は?","a":"2 lateral ventricles → interventricular foramina (Monro) → third ventricle → cerebral aqueduct (Sylvius) → fourth ventricle → foramen of Magendie(正中)とforamina of Luschka(外側)→ subarachnoid space","s":2,"n":"Magendie = Medial(正中)、Luschka = Lateral(外側)"},{"q":"Lateral ventricleの部分は?","a":"Anterior (frontal) horn、body、atrium、posterior (occipital) horn、inferior (temporal) horn","s":0},{"q":"Bodyの壁は?","a":"Roof:corpus callosum。Floor:body of caudateとthalamus。Medial wall:septum pellucidumとfornix","s":0},{"q":"Anterior hornの壁は?","a":"Roof・前壁:corpus callosum(genu)。Floor・外側壁:head of caudate。Medial:septum pellucidum","s":0},{"q":"Inferior hornの壁は?","a":"Roof:tapetumとtail of caudate、stria terminalis。Floor:hippocampusとcollateral eminence。前端にamygdala","s":0},{"q":"Posterior horn内側壁の2つの隆起は?","a":"Bulb(forceps major)とcalcar avis(calcarine sulcus)","s":0},{"q":"Choroidal fissureとは?","a":"Fornixとthalamusの間の裂隙。choroid plexusが側脳室へ入る","s":0},{"q":"Third ventricleの壁は?","a":"Lateral:thalamusとhypothalamus(hypothalamic sulcusで分かれる)。Anterior:lamina terminalis、anterior commissure、columns of fornix。Floor:chiasm、infundibulum、tuber cinereum、mammillary bodies。Roof:tela choroidea(fornixの下)。Posterior:pineal、posterior commissure、aqueduct","s":1},{"q":"Fourth ventricleの位置は?","a":"Ponsとmedulla上半の後ろ、cerebellumの前。テント形","s":2},{"q":"Fourth ventricleのroofは?","a":"上半:superior cerebellar pedunclesとsuperior medullary velum。下半:inferior medullary velumとtela choroidea(choroid plexus)。頂点はfastigium","s":2},{"q":"Lateral boundariesは?","a":"上:superior cerebellar peduncles。下:inferior cerebellar peduncles(gracile・cuneate tubercles)","s":1},{"q":"Floor (rhomboid fossa)の構造は?","a":"Median sulcus、medial eminence、sulcus limitans。striae medullaresでpons部とmedulla部に分かれる。pons部:facial colliculus。medulla部:hypoglossal trigone、vagal trigone (ala cinerea)。外側:vestibular area。下端:obex","s":2},{"q":"Floorの下にある核は?","a":"Abducens n.(facial colliculus)、hypoglossal n.、dorsal motor n. of vagus、vestibular nn.、cochlear nn.(lateral recess)、solitary n.、salivatory nn.","s":2},{"q":"Fourth ventricleのchoroid plexusを養うのは?","a":"PICA","s":0},{"q":"Central canalの終末は?","a":"Conus medullarisでterminal ventricle。12歳までに閉塞する","s":0}]},{"title":"CSF","cards":[{"q":"Choroid plexusの構造は?","a":"毛細血管の房(fenestrated endothelium)を、microvilliとtight junctionsを持つmodified ependymal cellsが覆う。tela choroideaから生じる","s":2},{"q":"Choroid plexusがある場所とない場所は?","a":"ある:lateral ventricle(bodyとinferior horn)、thirdとfourth ventricleのroof。ない:anterior / posterior horn、aqueduct、central canal","s":0},{"q":"CSF産生の機序は?","a":"Ultrafiltration、active transport(Na+/K+-ATPase、aquaporin 1)、carbonic anhydrase、pinocytosis","s":2},{"q":"CSFの産生量は?","a":"約20 ml/h = 500 ml/day(0.2–0.7 ml/min)。1日に3〜4回入れ替わる","s":2},{"q":"CSFの総量は?","a":"約150 ml。脳室内は約25 ml","s":0},{"q":"CSFの組成は?","a":"無色透明。glucoseは血中の約半分、proteinはごく微量、細胞はlymphocyte 0–3 /mm³。圧は側臥位で60–150 mm H₂O","s":1},{"q":"CSFの機能は?","a":"脳のcushion(機械的保護)、代謝産物のsink(waste clearance)、神経組織のhomeostasis","s":1},{"q":"CSFを動かす力は?","a":"動脈拍動によるpulsatile flux、choroid plexusの拍動、ependymal cilia、呼吸や体位","s":0},{"q":"CSFの吸収部位は?","a":"Arachnoid granulations (Pacchioni) → superior sagittal sinusなどdural sinuses。一部はcribriform plateとspinal nerve sheathsからlymphへ","s":2},{"q":"吸収の機序は?","a":"Active:arachnoid cellsを通るgiant vacuoles。Passive:圧依存性。CSF圧 ≥ 4.5 mmHgで始まり、産生能の5倍まで増える。villiはone-way valve","s":2},{"q":"Blood-brain barrierの構造的特徴は?","a":"Tight junctions(脳毛細血管の内皮細胞間。blood-CSF barrierはchoroid epitheliumのtight junctions)","s":1},{"q":"正常の頭蓋内圧は?","a":"成人10–15 mmHg、小児3–7、乳児1.5–6。亢進は20–25以上","s":0}]},{"title":"Hydrocephalus","cards":[{"q":"Hydrocephalusの定義は?","a":"CSFの産生・流れ・吸収の障害により、CSFが占める容積が増える状態","s":0},{"q":"3つの原因は?","a":"Obstruction、altered absorption、hypersecretion","s":0},{"q":"閉塞が起きやすい部位は?","a":"Foramen of Monro、aqueduct(congenital aqueductal stenosis)、fourth ventricleの出口","s":0},{"q":"吸収障害型の原因は?","a":"出血後、感染後、normal pressure hydrocephalus、Dandy-Walker、Chiari II、leptomeningeal carcinomatosis","s":0},{"q":"Normal pressure hydrocephalusの3徴は?","a":"Gait disturbance(最初)、cognitive decline、urinary incontinence","s":0,"n":"Wet, Wobbly, Wacky:尿失禁、歩行障害、認知低下"},{"q":"Evans' indexの異常値は?","a":"> 0.3","s":0},{"q":"Dandy-Walkerの3徴は?","a":"Hydrocephalus、第四脳室の嚢胞状拡大、vermisの欠損 / 低形成","s":0},{"q":"乳児の徴候は?","a":"頭囲拡大、緊張したfontanelle、縫合離開、setting-sun sign","s":0},{"q":"成人の徴候は?","a":"朝の頭痛と嘔吐、papilledema、第6脳神経麻痺、Parinaud syndrome(上方注視麻痺)","s":0},{"q":"治療は?","a":"閉塞の除去、shunt(external / internal)、endoscopic third ventriculostomy","s":0},{"q":"Germinal matrix hemorrhageが起こるのは?","a":"早産児。germinal matrixの脆弱な血管から出血し、脳室内出血からhydrocephalusに至る。35–36週で消失","s":0}]}],"rev":[6,4,0],"lesson":[{"h":"今日学ぶこと","b":["今日は、脳の中の液体の通り道である ventricles(脳室)と、その中を流れる CSF(cerebrospinal fluid 脳脊髄液)を学ぶ。","Day 1 で、脳と脊髄は胎児のときの神経管からできていて、管の中の空間が脳室になると学んだ。脳が発達するにつれて、この空間は場所によって広がったり細くなったりして、大人では4つの部屋とそれをつなぐ通路になる。","流れは、4つの脳室の全体像とつながり → それぞれの脳室の壁 → CSF を作る仕組み → 流れと吸収 → CSF の働き → 流れが止まったとき(水頭症)、の順。"]},{"h":"4つの脳室と、そのつながり","b":["脳室は全部で4つある。","- lateral ventricles(側脳室):左右の大脳半球の中に1つずつ。いちばん大きい。","- third ventricle(第三脳室):正中にある細いすき間。左右の間脳(視床と視床下部)に挟まれている。","- fourth ventricle(第四脳室):脳幹(橋と延髄)の後ろ、小脳の前(Day 1)。","CSF は次の順に流れる。","1. 側脳室で作られる(後で説明する脈絡叢で)。","2. 左右の側脳室から、それぞれ小さな穴 interventricular foramen(室間孔)を通って、第三脳室に入る。この穴は発見者の名前から foramen of Monro(モンロー孔)とも呼ぶ。","3. 第三脳室から、中脳の中を通る細い管 cerebral aqueduct(中脳水道)を通って、第四脳室に入る(Day 1)。","4. 第四脳室には、脳の外へ通じる穴が3つある。正中に1つの foramen of Magendie(マジャンディ孔)と、左右に1つずつの foramina of Luschka(ルシュカ孔)。ここから CSF は脳の外側の空間(subarachnoid space くも膜下腔、Day 18)へ出る。","覚え方:Magendie は Medial(正中)、Luschka は Lateral(外側)。"]},{"h":"側脳室の形","b":["側脳室は、大脳半球の中を前から後ろへ、そして下へぐるりと回り込む、C の字の形をしている。これは、大脳半球が胎児のときに前から後ろ、そして下へと C の字に成長したため。","側脳室は5つの部分に分けて呼ぶ。","- anterior horn(前角):前頭葉の中にある、前の端の部分。","- body(体部):前角から後ろへ続く、頭のてっぺんの下の部分。","- atrium(三角部):体部が後ろで、後ろと下の2方向に分かれる三差路。","- posterior horn(後角):三角部から後ろへ、後頭葉の中に伸びる部分。","- inferior horn(下角):三角部から前下へ、側頭葉の中に伸びる部分。"]},{"h":"側脳室の壁を作る構造","b":["側脳室の壁は、まわりの脳の構造そのものでできている。","- 前角:外側の壁は caudate nucleus(尾状核:大脳の奥にある灰白質のかたまり、Day 11)の頭の部分がふくらんで作る。天井と前の壁は corpus callosum(脳梁:左右の大脳半球をつなぐ太い白質の板)。","- 体部:天井は脳梁。床は、外側が尾状核、内側が thalamus(視床、Day 9)。","- 左右の側脳室の前角と体部の間には、薄い2枚の膜の仕切り septum pellucidum(透明中隔)がある。","- 下角:床に hippocampus(海馬:記憶に関わる構造、Day 12)が盛り上がっている。前の端の近くに amygdala(扁桃体)がある。","- 後角:内側の壁に、後頭葉の深い溝(鳥距溝)が押し込んでできた盛り上がり calcar avis(鳥距)がある(Day 14)。","側脳室から第三脳室へ通じる室間孔は、前と上を fornix(脳弓:海馬から出る白質の束、Day 12)の柱、後ろを視床の前の端で囲まれている。"]},{"h":"第三脳室と第四脳室の壁","b":["第三脳室は、左右の間脳に挟まれた、縦に細長いすき間。","- 外側の壁:上半分が視床、下半分が hypothalamus(視床下部、Day 10)。","- 前の壁:lamina terminalis(終板:神経管の前の端の名残りの薄い膜)と、その上の anterior commissure(前交連:左右をつなぐ細い白質の束)。","- 床:前から順に、optic chiasm(視交叉)、infundibulum(漏斗:下垂体の茎)、tuber cinereum(灰白隆起)、mammillary bodies(乳頭体)。","- 天井:薄い膜(tela choroidea 脈絡組織)で、ここから脈絡叢が垂れ下がる。","第四脳室は、横から見るとテントのような三角形。","- 床:橋と延髄の後ろの面。rhomboid fossa(菱形窩)と呼ばれ、脳神経の核が並ぶ(Day 4)。","- 天井:上半分は、左右の上小脳脚と、その間に張った薄い膜(superior medullary velum 上髄帆)。下半分は、薄い膜(inferior medullary velum 下髄帆)と脈絡組織。天井のいちばん高い頂点を fastigium(室頂)という。","- 外側の境界:上は上小脳脚、下は下小脳脚(Day 7)。左右に伸びた部分(lateral recess 外側陥凹)の先にルシュカ孔がある。"]},{"h":"CSF を作る脈絡叢","b":["CSF の大部分は choroid plexus(脈絡叢)で作られる。脈絡叢は、脳室の壁から脳室の中へ垂れ下がった、カリフラワーのような房状の構造。","脈絡叢の中には細い血管(毛細血管)がたくさんあり、その表面を、脳室の内面を覆う細胞の仲間(ependymal cells 上衣細胞)が変化した細胞が1層で包んでいる。","- 血管の壁は穴あき(fenestrated)になっていて、血液の成分が外へ漏れやすい。","- それを包む上衣細胞どうしは、tight junction(密着結合:細胞と細胞のすき間をぴったり閉じる構造)でしっかりつながっている。","血液から漏れ出た成分は、上衣細胞のすき間を通り抜けられず、上衣細胞の中を通ってしか脳室に入れない。上衣細胞が必要なものだけを選んで通すので、CSF の成分は血液と違うものになる。この仕組みを blood-CSF barrier(血液脳脊髄液関門)という。","脈絡叢は、側脳室(体部と下角)、第三脳室の天井、第四脳室の天井(下半分)にある。側脳室の前角と後角、中脳水道にはない。"]},{"h":"CSF はどうやって作られるか","b":["脈絡叢の上衣細胞は、次の仕組みで CSF を作る。","1. 血管から、血液の液体成分が上衣細胞のすぐ外まで漏れ出る(ultrafiltration 限外濾過)。","2. 上衣細胞が、エネルギーを使ってナトリウムイオンを脳室の側へくみ出す(active transport 能動輸送)。","3. ナトリウムを追いかけるように、水が細胞を通って脳室へ移動する。水が通る専用の通路(aquaporin 1 アクアポリン1)が使われる。","4. この過程に、carbonic anhydrase(炭酸脱水酵素)という酵素が関わる。","作られる量は1時間に約20 ml、1日に約500 ml。脳室とくも膜下腔にある CSF の全量は約150 ml なので、CSF は1日に3〜4回入れ替わっている。"]},{"h":"CSF の成分と働き","b":["CSF は無色透明の液体。血液と比べると、糖(glucose)は約半分、蛋白はごくわずか、細胞はほとんど含まない(リンパ球が1 mm³ あたり数個まで)。","CSF には3つの働きがある。","1. クッション:脳は CSF に浮かんでいるので、実際の重さの数十分の1しか下にかからない。頭をぶつけたときの衝撃も和らげる。","2. 老廃物の流し先:脳の活動で出た不要な物質が CSF に流れ出て、CSF と一緒に血液へ運ばれる。","3. 環境を一定に保つ:神経細胞の周りの化学的な環境を安定させる。","脳の毛細血管には、脈絡叢とは別のしくみの壁がある。血管の内側の細胞(内皮細胞)どうしが密着結合でぴったり閉じていて、血液中の多くの物質が脳の組織に直接入れない。これを blood-brain barrier(血液脳関門)という。"]},{"h":"CSF の流れと吸収","b":["CSF は、脳室で作られ、第四脳室の3つの穴から脳の外のくも膜下腔へ出る。くも膜下腔は、脳と脊髄の周りを包む膜(くも膜と軟膜、Day 18)の間の空間で、脳と脊髄の表面全体をおおっている。","CSF は、心臓の拍動に合わせた動脈の脈打ち、脈絡叢の脈打ち、上衣細胞の表面の細い毛(線毛)の動き、呼吸などに押されて流れる。","吸収される場所は、主に頭のてっぺんの、太い静脈の通り道(上矢状静脈洞、Day 18)の近く。くも膜の一部が、静脈の通り道の壁を突き抜けて、静脈の中へ小さな房のように顔を出している。これを arachnoid granulations(くも膜顆粒)といい、発見者の名前から Pacchioni 小体ともいう。","くも膜顆粒は一方通行の弁のように働く。CSF の圧が静脈の血液の圧より高いと、CSF が静脈へ流れ込み、逆流はしない。吸収は CSF の圧が約4.5 mmHg を超えると始まり、圧が高くなるほど多く吸収される。","一部の CSF は、鼻の上の骨の穴や、脊髄神経の周りから、リンパ管へも流れ出る。"]},{"h":"流れが止まると:水頭症","b":["hydrocephalus(水頭症)は、CSF が作られる・流れる・吸収される、のどこかがうまくいかず、CSF がたまって脳室が広がる状態。広がった脳室が周りの脳を押しつぶす。","原因は3種類に分けられる。","1. 流れの通路が詰まる(閉塞性水頭症)。詰まりやすいのは、細い場所。室間孔、中脳水道、第四脳室の出口。詰まった所より上流の脳室だけが広がる。たとえば中脳水道が詰まると、側脳室と第三脳室が広がり、第四脳室は広がらない。","2. 吸収がうまくいかない。くも膜下出血や髄膜炎のあとに、くも膜顆粒が傷むと起こる。全部の脳室が広がる。","3. 作られすぎる。まれ(脈絡叢の腫瘍など)。","赤ちゃんでは頭蓋骨の継ぎ目がまだ閉じていないので、頭そのものが大きくなる。大人では頭蓋骨が広がらないので、頭の中の圧が上がり、頭痛、吐き気、目の奥の視神経乳頭のむくみ(うっ血乳頭)が出る。外転神経が引っぱられて目が外へ向けにくくなることもある(Day 2)。","お年寄りには、頭の中の圧がそれほど高くならないのに脳室が広がる normal pressure hydrocephalus(正常圧水頭症)がある。歩きにくい、物忘れ、尿が漏れる、の3つがそろうのが特徴。覚え方は Wet(漏れる)、Wobbly(ふらつく)、Wacky(ぼける)。","治療は、詰まりの原因を取り除くか、細い管(シャント)で脳室の CSF を腹の中などへ流す。第三脳室の床に小さな穴をあけて、CSF を直接くも膜下腔へ逃がす方法(内視鏡的第三脳室開窓術)もある。"]}],"terms":[{"q":"ventricles","a":"脳室。脳の中の液体の部屋"},{"q":"CSF","a":"Cerebrospinal fluid、脳脊髄液"},{"q":"lateral ventricle","a":"側脳室。左右に1つずつ、C 字形"},{"q":"third ventricle","a":"第三脳室。左右の間脳の間"},{"q":"fourth ventricle","a":"第四脳室。橋・延髄と小脳の間"},{"q":"interventricular foramen","a":"室間孔(Monro 孔)。側脳室と第三脳室をつなぐ"},{"q":"foramen of Magendie","a":"マジャンディ孔。第四脳室の正中の出口"},{"q":"foramina of Luschka","a":"ルシュカ孔。第四脳室の外側の出口"},{"q":"subarachnoid space","a":"くも膜下腔。脳の外側を CSF が流れる"},{"q":"septum pellucidum","a":"透明中隔。左右の側脳室を隔てる薄い板"},{"q":"atrium","a":"三角部。側脳室の体部・後角・下角の合流部"},{"q":"lamina terminalis","a":"終板。第三脳室の前壁"},{"q":"tela choroidea","a":"脈絡組織。脳室の天井、脈絡叢が出る"},{"q":"fastigium","a":"室頂。第四脳室の天井の頂点"},{"q":"superior medullary velum","a":"上髄帆。第四脳室天井の上半分"},{"q":"lateral recess","a":"外側陥凹。第四脳室の外側に伸びた部分"},{"q":"choroid plexus","a":"脈絡叢。CSF を作る"},{"q":"ependymal cells","a":"上衣細胞。脳室の内面を覆う細胞"},{"q":"blood-CSF barrier","a":"血液脳脊髄液関門。脈絡叢上皮の tight junction"},{"q":"blood-brain barrier","a":"血液脳関門。脳の毛細血管内皮の tight junction"},{"q":"arachnoid granulations","a":"くも膜顆粒(Pacchioni 小体)。CSF の吸収"},{"q":"hydrocephalus","a":"水頭症。脳室が広がる状態"},{"q":"normal pressure hydrocephalus","a":"正常圧水頭症。歩行障害・認知低下・尿失禁"}],"facts":[{"q":"脳室の数","a":"4つ(側脳室2・第三・第四)"},{"q":"側脳室と第三脳室をつなぐ孔","a":"室間孔(Monro 孔)"},{"q":"第三脳室と第四脳室をつなぐ管","a":"中脳水道"},{"q":"第四脳室の正中の出口","a":"Magendie 孔"},{"q":"第四脳室の外側の出口","a":"Luschka 孔(左右2つ)"},{"q":"第四脳室を出た CSF が流れる場所","a":"くも膜下腔"},{"q":"側脳室の形","a":"C 字形"},{"q":"側脳室の5部分","a":"前角・体部・三角部・後角・下角"},{"q":"側脳室前角の外側の壁","a":"尾状核の頭"},{"q":"側脳室体部の天井","a":"脳梁"},{"q":"側脳室体部の床","a":"尾状核と視床"},{"q":"左右の側脳室を隔てる板","a":"透明中隔"},{"q":"側脳室下角の床にある構造","a":"海馬"},{"q":"体部・後角・下角が合流する場所","a":"三角部(atrium)"},{"q":"Monro 孔の前上の境界","a":"脳弓の柱"},{"q":"Monro 孔の後ろの境界","a":"視床の前端"},{"q":"第三脳室の外側の壁","a":"視床(上)と視床下部(下)"},{"q":"第三脳室の前壁","a":"終板と前交連"},{"q":"第三脳室の床にある構造","a":"視交叉・漏斗・灰白隆起・乳頭体"},{"q":"第四脳室の前にある構造","a":"橋と延髄"},{"q":"第四脳室の後ろにある構造","a":"小脳"},{"q":"第四脳室の床の名前","a":"菱形窩(rhomboid fossa)"},{"q":"第四脳室の天井の頂点","a":"Fastigium"},{"q":"第四脳室天井の上半分","a":"上小脳脚と上髄帆"},{"q":"第四脳室天井の下半分","a":"下髄帆と脈絡組織"},{"q":"第四脳室の外側の上の境界","a":"上小脳脚"},{"q":"第四脳室の外側の下の境界","a":"下小脳脚"},{"q":"CSF を作る構造","a":"脈絡叢"},{"q":"脈絡叢の血管内皮の特徴","a":"穴あき(fenestrated)"},{"q":"脈絡叢で関門を作るもの","a":"上衣細胞どうしの tight junction"},{"q":"脈絡叢がない場所","a":"前角・後角・中脳水道"},{"q":"1日の CSF 産生量","a":"約500 ml(約20 ml/時)"},{"q":"CSF の全量","a":"約150 ml"},{"q":"1日に入れ替わる回数","a":"3〜4回"},{"q":"CSF の糖は血液と比べて","a":"約半分"},{"q":"CSF 産生に関わる酵素","a":"Carbonic anhydrase"},{"q":"CSF 産生に関わる水チャネル","a":"Aquaporin 1"},{"q":"CSF の主な吸収場所","a":"くも膜顆粒 → 静脈洞"},{"q":"くも膜顆粒の別名","a":"Pacchioni 小体"},{"q":"吸収が始まる CSF 圧","a":"約4.5 mmHg 以上"},{"q":"CSF の3つのはたらき","a":"クッション・老廃物の流し先・環境の維持"},{"q":"血液脳関門の正体","a":"脳の毛細血管内皮の tight junction"},{"q":"正常の頭蓋内圧(大人)","a":"10〜15 mmHg"},{"q":"閉塞性水頭症が起きやすい3か所","a":"Monro 孔・中脳水道・第四脳室出口"},{"q":"正常圧水頭症の3徴","a":"歩行障害・認知低下・尿失禁"}]},{"title":"9 間脳と視床","secs":[{"title":"Thalamus","cards":[{"q":"Diencephalonの構成は?","a":"Thalamus、subthalamus、epithalamus、hypothalamus(metathalamus = geniculate bodiesはthalamusの一部)","s":2},{"q":"Thalamusの機能は?","a":"皮質へのgateway。olfaction以外の全感覚の中継、extrapyramidal motor circuit、limbic system、consciousness","s":0},{"q":"Thalamusの白質は?","a":"Stratum zonale(表面)、external medullary lamina(外側)、internal medullary lamina(Y字型でanterior・medial・lateralに分ける)","s":1},{"q":"Thalamic nucleiの形態学的分類は?","a":"Anterior:anterior n.。Medial:dorsomedial n.。Lateralのdorsal tier:lateral dorsal、lateral posterior、pulvinar。ventral tier:VA、VL、VP (VPL・VPM)、geniculate bodies","s":2},{"q":"Internal nucleiは?","a":"Reticular n.(external medullary laminaとinternal capsuleの間)、intralaminar nn.(centromedian、parafascicularなど)、midline nn.","s":0},{"q":"機能的分類は?","a":"Specific relay nuclei(anteriorとventral)、nonspecific nuclei(reticular・intralaminar・midline)、association nuclei(dorsomedialとdorsal tier)","s":1},{"q":"Anterior nucleusの入出力は?","a":"入力:mammillary body(mammillothalamic tract)。出力:cingulate gyrus。Papez回路","s":0},{"q":"VA・VLの入出力は?","a":"入力:globus pallidus internusとcerebellum。出力:primary motor areaとpremotor area","s":0},{"q":"VPLとVPMの入力は?","a":"VPL:medial lemniscusとspinothalamic tract(体幹・四肢)。VPM:trigeminothalamic tractとtrigeminal lemniscus(顔)と味覚","s":0,"n":"VPL = Limbs(体)、VPM = Mouth(顔・味覚)"},{"q":"Geniculate bodiesと関与する経路は?","a":"Lateral:retinal ganglion cellsから受けcalcarine cortexへ(視覚)。Medial:inferior colliculusから受けHeschl's gyrusへ(聴覚)","s":2,"n":"Lateral = Light(視覚)、Medial = Music(聴覚)"},{"q":"皮質に投射しない唯一の核は?","a":"Reticular nucleus(他のthalamic nucleiに投射)","s":0},{"q":"Thalamusと脳室の関係は?","a":"内側面 = 第三脳室の外側壁。上面 = 側脳室bodyの床。後端(pulvinar)はatriumとquadrigeminal cisternに面する","s":1},{"q":"Interthalamic adhesionとは?","a":"Massa intermedia。左右のthalamusを第三脳室内でつなぐ","s":0},{"q":"Thalamusの血管支配は?","a":"PCAのthalamoperforating・thalamogeniculate・posterior choroidal arteries、PCoAの枝、AChA","s":0}]},{"title":"Epithalamus","cards":[{"q":"Epithalamusの構成と機能は?","a":"Pineal gland(melatonin)、habenula、stria medullaris thalami、posterior commissure","s":0}]}],"rev":[7,5,1],"lesson":[{"h":"今日学ぶこと","b":["今日は diencephalon(間脳)と、その最大の部分である thalamus(視床)を学ぶ。","これまでに何度も「視床で乗り換えて大脳へ」と出てきた(Day 3、Day 4、Day 6)。今日は、その視床がどんな形で、中がどう分かれていて、どの部分が何を中継しているのかを学ぶ。","流れは、間脳の全体と4つの部分 → 視床の場所と形 → 視床の中を分ける白質の板 → 核の並び → 各核が何を中継するか → 働きによる3つの分類 → 血管と視床上部、の順。"]},{"h":"間脳はどこにあるか","b":["diencephalon(間脳)は、大脳半球と中脳の間にある部分。Day 1 で学んだ脳幹のすぐ上で、左右の大脳半球に包み込まれるように、脳の中心にある。","間脳は、正中の細いすき間である第三脳室(Day 8)を、左右から挟んでいる。第三脳室の左右の壁が、そのまま間脳でできている。"]},{"h":"間脳の4つの部分","b":["間脳は4つの部分に分けられる。名前はどれも「視床(thalamus)」を基準につけられている。","- thalamus(視床):いちばん大きく、間脳の大部分を占める。第三脳室の壁の上半分。","- hypothalamus(視床下部):視床の下(hypo- は下の意味)。第三脳室の壁の下半分と床。体の調節の中枢(Day 10)。","- epithalamus(視床上部):視床の後ろ上(epi- は上の意味)。小さな部分で、pineal gland(松果体)と habenula(手綱)からなる。","- subthalamus(視床腹側部、視床下野):視床の下で、視床下部より外側の部分。subthalamic nucleus(視床下核)がある。視床下核は、運動を調節する大脳基底核の回路に入る(Day 11)。","視床のすぐ後ろ下には、2つの小さなふくらみ、lateral geniculate body(外側膝状体)と medial geniculate body(内側膝状体)がある。膝のように曲がった形なのでこの名前。これらをまとめて metathalamus(視床後部)と呼ぶが、働きの上では視床の一部として扱う。"]},{"h":"視床は大脳への関所","b":["視床の最も大事な仕事は、大脳皮質へ向かう情報の中継。","においを除くすべての感覚(体の感覚、顔の感覚、視覚、聴覚、味覚)は、大脳皮質に届く前に、必ず視床で次の神経細胞に乗り換える。乗り換えるときに、視床は情報を整理したり、注意を向けていない情報を弱めたりしている。","感覚だけではない。運動を調節する大脳基底核(Day 11)と小脳(Day 7)からの信号も、視床で乗り換えて大脳の運動野へ届く。記憶と感情に関わる回路(Day 12)も視床を通る。意識を保つことにも関わる。","視床のほとんどの核は大脳皮質へ線維を送り、大脳皮質からも同じ核へ線維が返ってくる。視床と大脳皮質は、行きと帰りの両方向でつながっている。"]},{"h":"視床の場所と形","b":["視床は、卵の形をした灰白質のかたまりで、左右に1つずつある。長い方の向きが前後になっている。","- 内側の面:第三脳室の壁の上半分になる(Day 8)。左右の視床は、第三脳室を横切る小さな橋 interthalamic adhesion(視床間橋)でつながっていることが多い。","- 上の面:側脳室の体部の床の内側部分になる(Day 8)。","- 外側の面:白質の太い帯 internal capsule(内包、Day 11)の後ろの部分に接している。内包のさらに外側には、大脳基底核のレンズ核がある。","- 前の端:細くとがっていて、側脳室から第三脳室への穴(室間孔、Day 8)の後ろの縁になる。","- 後ろの端:太くふくらんでいて、pulvinar(視床枕:枕のような形)と呼ぶ。その下に外側膝状体と内側膝状体がついている。"]},{"h":"視床の中を分ける白質の板","b":["視床は全体が灰白質だが、中を白質の薄い板が仕切っていて、いくつかの区画に分かれている。","いちばん大事なのは internal medullary lamina(内髄板)。視床の中を前後に走る白質の板で、前の方で Y の字に2つに分かれている。この Y の字の板が、視床を3つの部分に分ける。","- Y の二股に挟まれた前の部分:anterior part(前部)。","- 板の内側:medial part(内側部)。","- 板の外側:lateral part(外側部)。いちばん大きい。","視床の表面にも白質の薄い層がある。上の面を覆うのが stratum zonale(帯層)、外側の面を覆うのが external medullary lamina(外髄板)。外髄板と内包の間には、薄い殻のような灰白質 reticular nucleus(網様核)がある。"]},{"h":"視床の核の並び","b":["3つの部分には、それぞれ核がある。","前部:anterior nucleus(前核)。","内側部:dorsomedial nucleus(背内側核)。","外側部は、さらに下の列と上の列に分かれる。","- 下の列(ventral tier 腹側列):前から順に ventral anterior nucleus(前腹側核、VA)、ventral lateral nucleus(外側腹側核、VL)、ventral posterior nucleus(後腹側核、VP)。VP は、外側の VPL(ventral posterolateral 後外側腹側核)と内側の VPM(ventral posteromedial 後内側腹側核)に分かれる。下の列のさらに後ろに、外側膝状体と内側膝状体が続く。","- 上の列(dorsal tier 背側列):lateral dorsal nucleus(背外側核)、lateral posterior nucleus(後外側核)、そして後ろの端の pulvinar(視床枕)。","内髄板の中にも、小さな核が埋まっている。これを intralaminar nuclei(髄板内核:板の内側の核)といい、代表は centromedian nucleus(中心正中核)。左右の視床の内側の面と視床間橋には midline nuclei(正中核)がある。"]},{"h":"各核が何を中継するか(1):運動と記憶","b":["各核は、決まった場所から情報を受け取り、決まった大脳皮質へ送る。","anterior nucleus(前核):視床下部の乳頭体から、mammillothalamic tract(乳頭視床路)という線維の束で情報を受け取る。帯状回(大脳の内側面で、左右をつなぐ脳梁を取り巻く脳回、Day 12)へ送る。記憶の回路(Papez 回路、Day 12)の一部。","VA と VL(前腹側核と外側腹側核):2か所から運動の調節の信号を受け取る。1つは大脳基底核の globus pallidus(淡蒼球、Day 11)、もう1つは小脳の歯状核(Day 7)。どちらも大脳の運動野と運動前野(運動を準備する領域)へ送る。だから VA と VL は、基底核と小脳が大脳の運動に働きかけるための出口になる。"]},{"h":"各核が何を中継するか(2):感覚","b":["VPL(後外側腹側核):首から下の体の感覚を中継する。内側毛帯(細かい触覚・位置の感覚)と脊髄視床路(痛み・温度)の線維がここに届く(Day 6)。大脳の中心後回(一次体性感覚野)へ送る。","VPM(後内側腹側核):顔の感覚と味覚を中継する。三叉神経の感覚の経路(三叉毛帯と三叉神経視床路、Day 3)と、孤束核からの味覚の線維(Day 4)が届く。中心後回の顔の領域と、味覚の皮質へ送る。","覚え方:VPL の L は Limbs(手足、つまり体)、VPM の M は Mouth(口、つまり顔)。","lateral geniculate body(外側膝状体):視覚を中継する。網膜からの線維(視索)が届き、後頭葉の一次視覚野へ送る(Day 14)。","medial geniculate body(内側膝状体):聴覚を中継する。中脳の下丘からの線維が届き、側頭葉の一次聴覚野(Heschl 回)へ送る(Day 4)。","覚え方:Lateral は Light(光)、Medial は Music(音)。"]},{"h":"各核が何を中継するか(3):その他","b":["dorsomedial nucleus(背内側核)と pulvinar(視床枕):特定の感覚を中継するのではなく、いろいろな場所から情報を集めて、大脳の広い連合野(情報を組み合わせて考えたり判断したりする領域)へ送る。背内側核は前頭葉の前の部分(前頭前野)へ、視床枕は頭頂葉・側頭葉・後頭葉の連合野へ。","intralaminar nuclei(髄板内核)と midline nuclei(正中核):大脳皮質の広い範囲へ、まんべんなく線維を送る。覚醒と注意に関わる。髄板内核は、大脳基底核の線条体(Day 11)へも線維を送る。","reticular nucleus(網様核):視床の核の中で唯一、大脳皮質へ線維を送らない。代わりに、他の視床核へ GABA で働きかけ(抑制)、どの情報を通すかを調節する。視床と皮質の間を行き来する線維が、網様核の中を通り抜けるときに枝を出し、網様核はその情報を受けている。"]},{"h":"働きによる3つの分類","b":["視床の核は、どんな情報を受けて、どこへ送るかで3種類に分けられる。","1. specific relay nuclei(特殊中継核):1種類の感覚、または特定の運動の信号を受け取り、決まった1つの皮質領域へ送る。前核、VA、VL、VPL、VPM、外側膝状体、内側膝状体。","2. nonspecific nuclei(非特殊核):いろいろな場所から情報を受け取り、大脳皮質の広い範囲へばらまくように送る。髄板内核、正中核、網様核。","3. association nuclei(連合核):いろいろな場所から情報を受け取り、大脳の連合野へ送る。背内側核と、上の列の核(背外側核、後外側核、視床枕)。"]},{"h":"視床の血管と視床上部","b":["視床に血液を送る動脈は、主に後ろの循環から来る。脳の底の後ろの方で脳底動脈から分かれる posterior cerebral artery(後大脳動脈、PCA、Day 17)の細い枝が中心で、それに後交通動脈(Day 2、Day 16)の枝が加わる。PCA の枝には、脳の底から真上へ視床に入っていく thalamoperforating arteries(視床穿通動脈)、膝状体の近くから入る thalamogeniculate arteries(視床膝状体動脈)、脈絡叢へ向かう途中で視床の後ろを養う posterior choroidal arteries(後脈絡叢動脈)がある。","視床上部は2つの部分からなる。","- pineal gland(松果体):松ぼっくりのような形の小さな器官。第三脳室の後ろの上にある。暗くなると melatonin(メラトニン)というホルモンを出し、眠りと目覚めのリズムに関わる。","- habenula(手綱):松果体の付け根の左右にある小さな核。馬の手綱のように松果体から伸びて見えるのでこの名前。感情に関わる辺縁系(Day 12)と中脳をつなぐ。"]}],"terms":[{"q":"diencephalon","a":"間脳。第三脳室を囲む"},{"q":"thalamus","a":"視床。感覚の大脳への中継"},{"q":"hypothalamus","a":"視床下部"},{"q":"epithalamus","a":"視床上部。松果体と手綱"},{"q":"subthalamus","a":"腹側視床。視床下核を含む"},{"q":"metathalamus","a":"視床後部。内側・外側膝状体"},{"q":"interthalamic adhesion","a":"視床間橋(massa intermedia)"},{"q":"pulvinar","a":"視床枕。視床の後端"},{"q":"internal medullary lamina","a":"内髄板。視床内の Y 字の白質"},{"q":"external medullary lamina","a":"外髄板。視床の外側面の白質"},{"q":"reticular nucleus(視床の)","a":"視床網様核。皮質に投射しない唯一の核"},{"q":"anterior nucleus","a":"視床前核。乳頭体から帯状回へ"},{"q":"dorsomedial nucleus","a":"背内側核。前頭前野への連合核"},{"q":"VA / VL","a":"前腹側核 / 外側腹側核。基底核・小脳から運動野へ"},{"q":"VPL","a":"後外側腹側核。体の感覚"},{"q":"VPM","a":"後内側腹側核。顔の感覚と味覚"},{"q":"lateral geniculate body","a":"外側膝状体。視覚の中継"},{"q":"medial geniculate body","a":"内側膝状体。聴覚の中継"},{"q":"intralaminar nuclei","a":"髄板内核。非特殊核"},{"q":"specific relay nuclei","a":"特殊中継核"},{"q":"association nuclei","a":"連合核"},{"q":"pineal gland","a":"松果体。メラトニン"},{"q":"habenula","a":"手綱"}],"facts":[{"q":"間脳の4部","a":"視床・視床下部・視床上部・腹側視床"},{"q":"間脳が囲む脳室","a":"第三脳室"},{"q":"膝状体はどの部の一部として扱う","a":"視床"},{"q":"視床下核が属する部","a":"腹側視床(subthalamus)"},{"q":"視床で中継されない感覚","a":"嗅覚"},{"q":"視床の内側の面が作るもの","a":"第三脳室の外側の壁(上部)"},{"q":"視床の上の面が作るもの","a":"側脳室体部の床"},{"q":"左右の視床をつなぐ構造","a":"視床間橋"},{"q":"視床の外側にある構造","a":"内包の後脚"},{"q":"視床の後端の名前","a":"Pulvinar"},{"q":"視床を3部に分ける白質","a":"内髄板(Y 字形)"},{"q":"内髄板で分けられる3部","a":"前部・内側部・外側部"},{"q":"外髄板と内包の間の核","a":"網様核"},{"q":"前部にある核","a":"前核"},{"q":"内側部にある主な核","a":"背内側核"},{"q":"外側部の下の列を前から","a":"VA → VL → VP → 膝状体"},{"q":"VP の2つ","a":"VPL と VPM"},{"q":"内髄板の中の核群","a":"髄板内核"},{"q":"前核への入力","a":"乳頭体(乳頭視床路)"},{"q":"前核の出力先","a":"帯状回"},{"q":"前核が含まれる回路","a":"Papez 回路"},{"q":"VA・VL への入力2つ","a":"淡蒼球と小脳"},{"q":"VA・VL の出力先","a":"運動野・運動前野"},{"q":"VPL に来る経路","a":"内側毛帯と脊髄視床路"},{"q":"VPM に来るもの","a":"顔の感覚と味覚"},{"q":"外側膝状体の入力と出力","a":"網膜から → 一次視覚野"},{"q":"内側膝状体の入力と出力","a":"下丘から → 一次聴覚野"},{"q":"皮質に投射しない唯一の視床核","a":"網様核"},{"q":"特殊中継核の例","a":"前核・VA・VL・VP・膝状体"},{"q":"非特殊核の例","a":"髄板内核・正中核・網様核"},{"q":"連合核の例","a":"背内側核・視床枕"},{"q":"視床を養う主な動脈","a":"PCA の枝(と PCoA の枝)"},{"q":"松果体が出すホルモン","a":"Melatonin"}]},{"title":"10 視床下部と下垂体","secs":[{"title":"Hypothalamusとhypophysis","cards":[{"q":"Hypothalamusの位置と境界は?","a":"第三脳室下部を囲む。前:lamina terminalisとanterior commissure。上:thalamus。後:midbrain。外:internal capsule。内:第三脳室。下:chiasm、tuber cinereum、infundibulum、mammillary bodies","s":2},{"q":"Infundibulumとは?","a":"Tuber cinereumから出るpituitary stalk。中心にneurohypophysisのinfundibular stem、周囲にadenohypophysisのpars tuberalis","s":1},{"q":"Tuber cinereumとは?","a":"Chiasmとmammillary bodiesの間の隆起。第三脳室底の一部でinfundibulumの起始","s":0},{"q":"Hypothalamusの区分は?","a":"内外:medial region(主な核)とlateral region(線維路と散在核)。前後:preoptic、supraoptic、tuberal、mammillary regions","s":2},{"q":"各regionの核は?","a":"Preoptic:medial / lateral preoptic。Supraoptic:suprachiasmatic、supraoptic、anterior、paraventricular。Tuberal:arcuate、ventromedial、dorsomedial。Mammillary:mammillary body、posterior","s":1},{"q":"Hypothalamusとadenohypophysisの連絡は?","a":"Tuberal region(特にarcuate n.)がreleasing / inhibiting factorsを作る → tuberoinfundibular tract → median eminenceの第1毛細血管網 → hypophyseal portal veins → 前葉の第2毛細血管網","s":2},{"q":"Neurohypophysisとの連絡は?","a":"Supraopticとparaventricular nucleiがADHとoxytocinを作る → supraoptico-hypophyseal tractを軸索輸送 → 後葉の毛細血管へ放出","s":2,"n":"SAD POX:Supraoptic = ADH、Paraventricular = OXytocin(主に)"},{"q":"Neurohypophysisのホルモンと作用は?","a":"Oxytocin:子宮と乳腺の平滑筋(myoepithelial)収縮。ADH:遠位尿細管と集合管で水再吸収、血管収縮","s":2},{"q":"Adenohypophysisのホルモンは?","a":"Acidophils:GH、PRL。Basophils:ACTH、TSH、FSH、LH","s":2,"n":"FLAT PiG:FSH, LH, ACTH, TSH, Prolactin, GH。Basophilsは B-FLAT(FSH, LH, ACTH, TSH)、AcidophilsはGPA(GH, Prolactin)"},{"q":"各前葉ホルモンの作用は?","a":"GH:成長・蛋白合成・lipolysis。PRL:乳汁分泌。ACTH:副腎皮質。TSH:甲状腺。FSH・LH:性腺(卵胞発育・排卵、精子形成・androgen)","s":0},{"q":"Adenohypophysisの3部は?","a":"Pars distalis、pars intermedia(ヒトでは痕跡的、MSH)、pars tuberalis(stalk周囲)","s":0},{"q":"Neurohypophysisの構成要素は?","a":"軸索終末、Herring bodies(ADH・oxytocinの顆粒)、pituicytes(glia)","s":0},{"q":"Hypothalamusへの主な入力路は?","a":"Fornix(hippocampus → mammillary body)、stria terminalis(amygdala)、medial forebrain bundle(olfactory・septal・reticular formation)、dorsal longitudinal fasciculus","s":0},{"q":"主な出力路は?","a":"Mammillothalamic tract(anterior thalamic n.)、mammillotegmental tract、dorsal longitudinal fasciculus(dorsal nucleus of vagusとspinal cordのintermediate columnへ)、下垂体への2経路","s":0},{"q":"Hypothalamusの機能は?","a":"下垂体の制御、自律神経の統合、thermoregulation、circadian rhythm、feeding、motivation、memory","s":1},{"q":"Circadian rhythmを担う核は?","a":"Suprachiasmatic nucleus","s":0},{"q":"Leptinが作用する核は?","a":"Arcuate nucleus","s":0}]}],"rev":[8,6,2],"lesson":[{"h":"今日学ぶこと","b":["今日は hypothalamus(視床下部)と、その下にぶら下がる pituitary gland(下垂体)を学ぶ。","視床下部は親指の先ほどの小さな部分だが、体温、体の水分、食欲、眠りのリズム、ホルモン、自律神経をまとめて調節する、体の調節の司令塔。","流れは、視床下部の役割と命令の出し方 → 場所と境界 → 中の領域と核 → 下垂体の作り → 視床下部から下垂体への2つの命令の道 → 下垂体のホルモン → 視床下部の情報の出入り、の順。"]},{"h":"視床下部は何をしているか","b":["体の中の状態(体温、血液の濃さ、血糖、血圧など)は、ある範囲に保たれていないと生きていけない。視床下部は、こうした状態を見張り、ずれたら元に戻す命令を出す。","見張っているもの:視床下部には、血液の温度や濃さを直接感じる神経細胞がある。また、内臓からの感覚(孤束核経由、Day 4)、目からの光の情報、脂肪から出るホルモンなども受け取る。","命令の出し方は2つ。","1. 自律神経を通して:交感神経と副交感神経(Day 1、Day 4)の出発点の神経細胞に命令を出す。たとえば暑いと汗を出させ、寒いと皮膚の血管を締めて熱を逃がさないようにする。","2. ホルモンを通して:下垂体にホルモンを出させ、そのホルモンが血液に乗って全身の臓器に働く。","このほか、食べたい・飲みたいという欲求や、怒りや恐れのときの体の反応も、視床下部が生み出す。"]},{"h":"視床下部の場所と境界","b":["視床下部は、間脳の下の部分で、第三脳室の下半分を左右から囲んでいる(Day 8、Day 9)。","- 上:視床。第三脳室の壁にある浅い溝 hypothalamic sulcus(視床下溝)が、視床と視床下部の境目。","- 前:lamina terminalis(終板)と anterior commissure(前交連)。第三脳室の前の壁(Day 8)。","- 後ろ:中脳。","- 外側:internal capsule(内包:大脳から下りる線維の通り道、Day 11)。","- 内側:第三脳室。","- 下:脳の底面に出ていて、下から見ることができる。"]},{"h":"脳の底から見た視床下部","b":["脳を下から見ると、視床下部の下面に、前から順に次の構造が並んでいる。","1. optic chiasm(視交叉):左右の視神経が合わさって X の字に交わる所(Day 2)。視床下部の前の端。","2. tuber cinereum(灰白隆起):視交叉の後ろの、わずかに盛り上がった灰色の部分。","3. infundibulum(漏斗):灰白隆起の真ん中から、じょうごのように下へ伸びる茎。この茎の先に下垂体がぶら下がる。","4. mammillary bodies(乳頭体):灰白隆起の後ろにある、左右1対の小さな丸いふくらみ。乳頭のような形なのでこの名前。"]},{"h":"視床下部を前から後ろへ4つの領域に分ける","b":["視床下部の中の核は、脳の底から見えた構造を目印にして、前から後ろへ4つの領域に分けると覚えやすい。","1. preoptic region(視索前域):視交叉より前。medial preoptic nucleus(内側視索前核)など。体温の調節や、性に関わる行動。","2. supraoptic region(視索上域):視交叉のすぐ上。ここに大事な核が4つある。","- suprachiasmatic nucleus(視交叉上核):視交叉のすぐ上の小さな核。体内時計。目から直接、光の情報を受け取り、昼と夜のリズムを作る。","- supraoptic nucleus(視索上核):視索(視交叉から後ろへ続く線維の束)の上にある。ADH というホルモンを作る。","- paraventricular nucleus(室傍核):第三脳室の壁のすぐそば(para- はそばの意味)。oxytocin と ADH を作る。自律神経の調節にも関わる。","- anterior hypothalamic nucleus(前核)。","3. tuberal region(隆起域):灰白隆起の上。","- arcuate nucleus(弓状核):漏斗の付け根を弓のように取り巻く。下垂体の前の部分へ命令を出す物質を作る。脂肪から出る leptin(レプチン:満腹を知らせるホルモン)を受け取り、食欲を抑える。","- ventromedial nucleus(腹内側核)と dorsomedial nucleus(背内側核)。食欲や攻撃的な行動に関わる。","4. mammillary region(乳頭体域):乳頭体の上。mammillary body(乳頭体)と posterior hypothalamic nucleus(後核)。乳頭体は記憶の回路(Papez 回路、Day 12)に入る。","主な核は、第三脳室に近い内側の帯(medial region)に集まっている。外側の帯(lateral region)には、視床下部を前後に貫く太い線維の束(medial forebrain bundle 内側前脳束)が走り、その間に核が散らばっている。"]},{"h":"下垂体の作り","b":["pituitary gland(下垂体)は、漏斗の先にぶら下がる、小指の先ほどの器官。頭蓋骨の中央の底にある、鞍のような形のくぼみ(sella turcica トルコ鞍)の中に収まっている。hypophysis(ハイポフィシス)ともいう。","下垂体は、前と後ろで生まれも中身もまったく違う2つの部分からできている。","- adenohypophysis(腺性下垂体、前葉):前の部分。adeno- は腺の意味。胎児のときに、口の天井から上へ伸びてきた組織でできている。ホルモンを作って出す腺の細胞の集まり。","- neurohypophysis(神経性下垂体、後葉):後ろの部分。胎児のときに、脳(視床下部の底)から下へ伸びてきた組織でできている。中身は、視床下部の神経細胞から伸びてきた軸索の先端と、それを支えるグリア細胞(pituicytes 後葉細胞)。自分ではホルモンを作らない。","前葉はさらに3つの部分に分けられる。いちばん大きい pars distalis(主部)、後葉との境の薄い pars intermedia(中間部、ヒトではほとんど痕跡的)、漏斗の茎を取り巻く pars tuberalis(隆起部)。","下垂体の茎(pituitary stalk 下垂体柄)は、中心に後葉へ向かう軸索の束(漏斗)、その周りを前葉の隆起部が取り巻く作りになっている。"]},{"h":"後葉への命令の道:軸索で直接","b":["後葉から出るホルモンは2つ。どちらも、実際に作っているのは視床下部の神経細胞。","1. 視索上核と室傍核の神経細胞が、ADH と oxytocin を作る。","2. 作られたホルモンは、袋に詰められて、その神経細胞の軸索の中を下へ運ばれる。この軸索の束を supraoptico-hypophyseal tract(視索上核下垂体路)という。","3. 軸索は漏斗を通って後葉まで伸びていて、その先端にホルモンをためておく。顕微鏡で見ると、軸索の途中や先端にホルモンの袋がたまったふくらみが見え、これを Herring bodies(ヘリング小体)という。","4. 必要なときに、軸索の先端から、後葉の毛細血管の中へホルモンを放出する。ホルモンは血液に乗って全身へ運ばれる。","つまり後葉は、視床下部が作ったホルモンの倉庫と出口。"]},{"h":"後葉の2つのホルモン","b":["ADH(antidiuretic hormone 抗利尿ホルモン、vasopressin バソプレシンとも呼ぶ):","- 働き:腎臓の、尿の最後の通り道(集合管)で、水を体の中へ取り戻させる。その結果、尿が少なく濃くなり、体の水が保たれる。量が多いと血管を締めて血圧も上げる。","- 出るとき:汗をかいたり水を飲まなかったりして、血液が濃くなったとき。視床下部の神経細胞が血液の濃さを感じて出す。","oxytocin(オキシトシン):","- 働き:子宮の筋を強く縮める(出産のとき)。乳腺の周りの細胞を縮めて、乳を押し出す(授乳のとき)。","- 出るとき:出産で子宮の出口が広がったとき、赤ちゃんが乳首を吸ったとき。"]},{"h":"前葉への命令の道:血管でリレー","b":["前葉のホルモンは、前葉の細胞自身が作る。ただし、いつどれだけ出すかは、視床下部が命令する。その命令は、神経ではなく血液で届く。","1. 視床下部の隆起域の核(主に弓状核)の神経細胞が、前葉への命令の物質を作る。前葉のホルモンを出させる物質を releasing factors(放出因子)、止める物質を inhibiting factors(抑制因子)という。","2. これらの物質は、軸索の中を運ばれて、漏斗の付け根にある median eminence(正中隆起)まで届く。この軸索の束を tuberoinfundibular tract(隆起漏斗路)という。","3. 正中隆起で、物質が毛細血管の網(1つ目の毛細血管網)の中に放出される。","4. 毛細血管の血液は、細い静脈に集まって、下垂体の茎を下る。この静脈を hypophyseal portal veins(下垂体門脈)という。門脈とは、毛細血管と毛細血管の間をつなぐ静脈のこと。","5. 下垂体門脈は、前葉の中で再び毛細血管の網(2つ目の毛細血管網)に分かれる。","6. ここで放出因子・抑制因子が前葉の細胞に届き、細胞はホルモンを出したり止めたりする。","全身を回らずに、視床下部から前葉へ直接、濃いまま届けるための仕組み。毛細血管網が2つあり、その間を門脈がつなぐ、という形を覚える。"]},{"h":"前葉の6つのホルモン","b":["前葉は6つのホルモンを出す。頭文字をとって FLAT PiG と覚える。","- FSH(follicle-stimulating hormone 卵胞刺激ホルモン):卵巣では卵子を育て、精巣では精子を作らせる。","- LH(luteinizing hormone 黄体形成ホルモン):卵巣では排卵を起こし、精巣では男性ホルモンを作らせる。","- ACTH(adrenocorticotropic hormone 副腎皮質刺激ホルモン):腎臓の上にある副腎の外側の部分(副腎皮質)に、ストレスに対抗するホルモン(コルチゾール)を出させる。","- TSH(thyroid-stimulating hormone 甲状腺刺激ホルモン):首の甲状腺に、甲状腺ホルモンを出させる。","- PRL(prolactin プロラクチン):出産後に乳を作らせる。","- GH(growth hormone 成長ホルモン):骨や筋を育て、脂肪を分解して栄養に変える。ぐっすり眠っているときに多く出る。","前葉の細胞は、染色液に染まる色で3種類に分けられる。赤い色素に染まる acidophils(好酸性細胞)は GH と PRL、青い色素に染まる basophils(好塩基性細胞)は FSH・LH・ACTH・TSH を作る。どちらにも染まらない細胞(chromophobes 色素嫌性細胞)もある。覚え方:好塩基性は B-FLAT(Basophils = FSH, LH, ACTH, TSH)。"]},{"h":"視床下部に情報が入ってくる道","b":["視床下部は、脳のいろいろな場所から情報を受け取る。主な道は次のとおり。","- 海馬(記憶に関わる、Day 12)から:fornix(脳弓)という白質の弧を描く束で、乳頭体へ。","- 扁桃体(恐れや怒りの感情に関わる、Day 12)から:stria terminalis(分界条)という細い束で。","- においの領域、中隔(脳の正中の前の方)、脳幹の網様体から:medial forebrain bundle(内側前脳束)で。視床下部の外側の帯を前後に貫く。","- 脳幹の神経細胞から:dorsal longitudinal fasciculus(背側縦束)で。","- 視床の背内側核から。","- 網膜から直接、視交叉上核へ。"]},{"h":"視床下部から情報が出ていく道","b":["視床下部は、情報を受け取った相手に、多くの場合は情報を送り返してもいる。主な出口は次のとおり。","- 下垂体へ:後葉には視索上核下垂体路、前葉には隆起漏斗路と下垂体門脈(前のページ)。","- 視床の前核へ:乳頭体から mammillothalamic tract(乳頭視床路)。記憶の回路の一部(Day 9、Day 12)。","- 脳幹と脊髄の自律神経の出発点へ:dorsal longitudinal fasciculus(背側縦束)で、迷走神経背側核(Day 4)や、脊髄の側角(Day 5)の神経細胞へ。こうして視床下部は自律神経を動かす。","- 中脳へ:乳頭体から mammillotegmental tract(乳頭被蓋路)。","- においの領域と中隔へ:内側前脳束で。"]}],"terms":[{"q":"hypothalamus","a":"視床下部"},{"q":"hypothalamic sulcus","a":"視床下溝。視床と視床下部の境"},{"q":"optic chiasm","a":"視交叉"},{"q":"tuber cinereum","a":"灰白隆起。漏斗の付け根の隆起"},{"q":"infundibulum","a":"漏斗。下垂体茎の上部"},{"q":"mammillary bodies","a":"乳頭体"},{"q":"preoptic region","a":"視索前域"},{"q":"supraoptic region","a":"視索上域"},{"q":"tuberal region","a":"隆起域"},{"q":"mammillary region","a":"乳頭体域"},{"q":"suprachiasmatic nucleus","a":"視交叉上核。体内時計"},{"q":"supraoptic nucleus","a":"視索上核。ADH"},{"q":"paraventricular nucleus","a":"室傍核。oxytocin と ADH"},{"q":"arcuate nucleus","a":"弓状核。放出因子、leptin の作用点"},{"q":"pituitary gland","a":"下垂体(hypophysis)"},{"q":"adenohypophysis","a":"下垂体前葉。腺組織"},{"q":"neurohypophysis","a":"下垂体後葉。神経組織"},{"q":"pars tuberalis","a":"隆起部。下垂体茎を囲む前葉"},{"q":"median eminence","a":"正中隆起。1つ目の毛細血管網"},{"q":"hypophyseal portal veins","a":"下垂体門脈"},{"q":"supraoptico-hypophyseal tract","a":"視索上核下垂体路。後葉への軸索"},{"q":"tuberoinfundibular tract","a":"隆起漏斗路。正中隆起への軸索"},{"q":"ADH","a":"抗利尿ホルモン(vasopressin)"},{"q":"oxytocin","a":"オキシトシン"},{"q":"Herring bodies","a":"ヘリング小体。後葉の軸索終末のホルモン顆粒"},{"q":"pituicytes","a":"後葉のグリア細胞"},{"q":"medial forebrain bundle","a":"内側前脳束"},{"q":"stria terminalis","a":"分界条。扁桃体から視床下部へ"},{"q":"dorsal longitudinal fasciculus","a":"背側縦束。脳幹・脊髄の自律核へ"},{"q":"leptin","a":"レプチン。脂肪細胞からの満腹信号"}],"facts":[{"q":"視床下部の命令の出し方2つ","a":"自律神経とホルモン(下垂体)"},{"q":"視床下部が囲む脳室の部分","a":"第三脳室の下半分"},{"q":"視床下部の上の境界","a":"視床(視床下溝)"},{"q":"視床下部の前の境界","a":"終板と前交連"},{"q":"視床下部の外側の境界","a":"内包"},{"q":"底面の構造を前から","a":"視交叉 → 灰白隆起 → 漏斗 → 乳頭体"},{"q":"漏斗が出る場所","a":"灰白隆起"},{"q":"視床下部の前後の4領域","a":"視索前域・視索上域・隆起域・乳頭体域"},{"q":"主な核が集まる側","a":"内側(medial region)"},{"q":"視索上域の核","a":"視交叉上核・視索上核・室傍核・前核"},{"q":"隆起域の核","a":"弓状核・腹内側核・背内側核"},{"q":"乳頭体域の核","a":"乳頭体・後核"},{"q":"体内時計の核","a":"視交叉上核"},{"q":"ADH と oxytocin を作る核","a":"視索上核と室傍核"},{"q":"前葉への放出因子を作る主な核","a":"弓状核"},{"q":"Leptin が作用する核","a":"弓状核"},{"q":"乳頭体が受ける線維束","a":"脳弓"},{"q":"乳頭体から視床前核への線維束","a":"乳頭視床路"},{"q":"下垂体前葉の別名","a":"Adenohypophysis"},{"q":"下垂体後葉の別名","a":"Neurohypophysis"},{"q":"後葉の正体","a":"視床下部からの軸索の終末"},{"q":"前葉の3部","a":"主部・中間部・隆起部"},{"q":"ヒトで痕跡的な前葉の部分","a":"中間部(pars intermedia)"},{"q":"下垂体茎の中心にあるもの","a":"後葉への軸索(漏斗茎)"},{"q":"後葉へホルモンを運ぶ経路","a":"視索上核下垂体路(軸索輸送)"},{"q":"前葉への因子を運ぶ経路","a":"隆起漏斗路 → 下垂体門脈"},{"q":"1つ目の毛細血管網がある場所","a":"正中隆起"},{"q":"2つの毛細血管網をつなぐ血管","a":"下垂体門脈"},{"q":"ADH の作用","a":"集合管で水を再吸収、血管収縮"},{"q":"ADH が出る刺激","a":"血液の浸透圧が上がる"},{"q":"Oxytocin の作用","a":"子宮収縮と乳汁射出"},{"q":"前葉ホルモン6つ","a":"FSH・LH・ACTH・TSH・PRL・GH"},{"q":"好酸性細胞が出すホルモン","a":"GH と PRL"},{"q":"好塩基性細胞が出すホルモン","a":"FSH・LH・ACTH・TSH"},{"q":"ACTH の標的","a":"副腎皮質"},{"q":"TSH の標的","a":"甲状腺"},{"q":"後葉のホルモン顆粒の名前","a":"Herring bodies"},{"q":"海馬から視床下部への線維束","a":"脳弓"},{"q":"扁桃体から視床下部への線維束","a":"分界条"},{"q":"視床下部から脊髄の自律核への線維束","a":"背側縦束"},{"q":"松果体・手綱を含む部分","a":"視床上部(Day 9)"}]},{"title":"11 大脳基底核と内包","secs":[{"title":"Central core","cards":[{"q":"Insulaから正中へ向かう構造を順に","a":"Insular cortex → extreme capsule → claustrum → external capsule → putamen → globus pallidus → internal capsule → thalamus(前方ではcaudate head)→ third ventricle","s":1},{"q":"Lentiform nucleusとinternal capsule、外側はどちら?","a":"Lentiform nucleusが外側。internal capsuleはその内側","s":1},{"q":"Central coreを構成するものは?","a":"Insula, basal nuclei, thalamus, internal capsule","s":0},{"q":"Cerebral isthmusとは?","a":"Circular sulcusの深部にある白質の狭い帯。central coreと半球の残りをつなぎ、全ての投射線維が通る","s":0}]},{"title":"Basal ganglia","cards":[{"q":"Basal gangliaの主な5核は?","a":"Caudate nucleus, putamen, globus pallidus, subthalamic nucleus, substantia nigra(追加:nucleus accumbens, amygdala)","s":2,"n":"定義の整理:Striatum = Caudate + Putamen、Lentiform = Putamen + Globus pallidus"},{"q":"Striatum / lentiform nucleus / corpus striatumの定義は?","a":"Striatum = caudate + putamen。Lentiform = putamen + globus pallidus。Corpus striatum = caudate + lentiform","s":0},{"q":"Basal gangliaの機能は?","a":"Postureと随意運動の制御。thalamusを介して皮質活動を調節する","s":1},{"q":"Caudate nucleusの機能は?","a":"Putamenと機能的に一体(striatum)。皮質からの入力を受ける入口で、運動の開始・調節と認知面に関与","s":1},{"q":"Basal gangliaの出力核と、皮質へ戻る中継は?","a":"出力はinternal globus pallidus(とSN pars reticulata)。中継はthalamus(VA, VL核)","s":1},{"q":"Striatumへの入力は?","a":"Cortex(motor, sensory, association)、thalamus (intralaminar nuclei)、substantia nigra pars compacta","s":0},{"q":"GPからthalamusへの線維束は?","a":"Ansa lenticularis + lenticular fasciculus = thalamic fasciculus","s":0},{"q":"Main loopを伝達物質つきで","a":"Cortex →(Glu +)→ striatum →(GABA −)→ GP →(GABA −)→ thalamus VA/VL →(Glu +)→ cortex。二重抑制でthalamusが脱抑制される","s":2},{"q":"2つのside loopは?","a":"1) Striatum ⇄ SN:striatum→SNはGABA、SN pars compacta→striatumはdopamine。2) GP ⇄ STN:GP→STNはGABA、STN→GPはglutamate","s":1},{"q":"Substantia nigraとは?","a":"Midbrainの核。dorsalのpars compacta(melanin、dopamine、striatumへ)とventralのpars reticulata(GPiと機能的に同等)","s":1},{"q":"Subthalamic nucleusの位置と所属は?","a":"Internal capsuleの内側、thalamusの下。diencephalonのsubthalamusに属し、尾側はSNに続く。GPとside loopを作る","s":1},{"q":"Parkinson病の回路は?","a":"SN pars compactaの変性 → 1st side loopの調節が消える → GPのthalamusへの抑制が増える → thalamusと皮質の活動低下(hypokinesia)","s":1},{"q":"なぜextrapyramidalと呼ぶ?","a":"延髄のpyramidsを通らない運動制御系だから。中心はbasal ganglia","s":1},{"q":"Extrapyramidal系とcerebellumのつながりは?","a":"Thalamus (VL)で合流:dentate nucleus → superior cerebellar peduncle → VL(dentato-thalamic)。red nucleus経由もある","s":1}]},{"title":"Internal capsule","cards":[{"q":"Internal capsuleの5部は?","a":"Anterior limb、genu、posterior limb、retrolentiform part、sublentiform part","s":1},{"q":"Anterior limbの位置は?","a":"Head of caudate(内側)とlentiform nucleus(外側)の間","s":0},{"q":"Anterior limbを通る線維は?","a":"Anterior thalamic radiation(prefrontal cortexへ)とfrontopontine fibers(pontine nucleiへ、対側小脳に続く)","s":1},{"q":"Genuの位置と線維は?","a":"Lentiform nucleusのapexの内側。corticonuclear (corticobulbar) fibers","s":0},{"q":"Posterior limbの位置は?","a":"Thalamus(内側)とlentiform nucleus(外側)の間","s":0},{"q":"Posterior limbを通る線維は?","a":"Corticospinal fibers(前2/3)とmiddle thalamic radiation(VP核からのsomatosensory fibers)","s":1},{"q":"Retrolentiform partを通る線維は?","a":"Optic (geniculocalcarine) radiation","s":0},{"q":"Sublentiform partを通る線維は?","a":"Auditory radiation","s":0},{"q":"Genuが脳室面に達する場所は?","a":"Foramen of Monroの外側","s":0},{"q":"Internal capsuleの血管支配は?","a":"Lateral lenticulostriate arteries (MCA)、recurrent artery of Heubner(anterior limbとcaudate head)、anterior choroidal artery(posterior limbとretrolentiform part)","s":1}]}],"rev":[9,7,3],"lesson":[{"h":"今日学ぶこと","b":["今日は2つのことを学ぶ。","1つ目は basal ganglia(大脳基底核)。大脳の奥にある灰白質のかたまりで、運動を始めたり止めたり、強さを調節したりする。ここが壊れると、パーキンソン病のように動き出せなくなったり、逆に勝手に体が動いてしまったりする。","2つ目は internal capsule(内包)。大脳皮質と、その下の視床・脳幹・脊髄をつなぐ線維が、すべて通り抜ける白質の帯。","流れは、大脳の奥の構造の並び → 基底核の名前の整理 → 回路の仕組み → パーキンソン病 → 内包の形と中身 → 血管、の順。"]},{"h":"大脳の奥の構造を、外側から内側へ","b":["大脳の表面には灰白質の皮質があり、その下は白質。その白質の奥深くに、さらに灰白質のかたまりがいくつか埋まっている。まず、それらがどう並んでいるかを知る。","大脳を、耳の高さで水平に切ったところを想像する。大脳の外側の面には、深い溝(外側溝、Day 13)がある。その溝の奥に隠れた皮質が insula(島)。島から正中へ向かって、次の順に構造が並ぶ。","1. insular cortex(島皮質):島の表面の灰白質。","2. extreme capsule(最外包):島皮質のすぐ下の薄い白質。","3. claustrum(前障):ごく薄い板のような灰白質。働きはよく分かっていない。","4. external capsule(外包):前障の内側の薄い白質。","5. putamen(被殻):大きな灰白質のかたまり。基底核の1つ。","6. globus pallidus(淡蒼球):被殻の内側の灰白質。基底核の1つ。線維が多く、淡く白っぽく見えるのでこの名前。","7. internal capsule(内包):太い白質の帯。","8. thalamus(視床、Day 9):内包の内側の灰白質。","前の方の高さで切ると、内包の内側には視床の代わりに caudate nucleus(尾状核:基底核の1つ)の頭の部分がある。","被殻と淡蒼球は合わさって、レンズのような形のかたまりを作るので、まとめて lentiform nucleus(レンズ核)と呼ぶ。レンズ核と内包では、レンズ核が外側、内包が内側。"]},{"h":"基底核の名前を整理する","b":["基底核の名前は、組み合わせて呼ぶ名前が多くて混乱しやすい。まず、主な5つの核を覚える。","1. caudate nucleus(尾状核):側脳室の壁に沿って、C の字に曲がった細長い核。前は太い頭、後ろへ細くなって尾になる。尾のような形なのでこの名前。","2. putamen(被殻):レンズ核の外側の部分。","3. globus pallidus(淡蒼球):レンズ核の内側の部分。外側の部分(外節、GPe)と内側の部分(内節、GPi)に分かれる。","4. subthalamic nucleus(視床下核):視床の下、内包の内側にある小さな核。間脳の一部(Day 9)。","5. substantia nigra(黒質):中脳にある黒い核(Day 1)。","組み合わせの名前:","- striatum(線条体)= 尾状核 + 被殻。尾状核と被殻は、もともと1つのかたまりが、間を通る内包の線維で分けられたもの。細かい灰白質の橋がたくさん残っていて、切ると縞模様(線条)に見えるのでこの名前。基底核の入り口。","- lentiform nucleus(レンズ核)= 被殻 + 淡蒼球。形で呼ぶ名前。","- corpus striatum(線条体の旧称で、尾状核 + レンズ核の全体)。","働きの上では、尾状核と被殻(線条体)はひとまとまり、と考える。"]},{"h":"黒質と視床下核","b":["substantia nigra(黒質)は、中脳の大脳脚のすぐ後ろにある核で、2つの部分に分かれる。","- pars compacta(緻密部):神経細胞が密に集まった部分。神経細胞がメラニンという黒い色素を含むので、黒く見える。dopamine(ドーパミン)という物質を作り、線条体へ送る。","- pars reticulata(網様部):神経細胞がまばらな部分。働きは淡蒼球の内節と同じで、基底核の出口の1つ。","subthalamic nucleus(視床下核)は、淡蒼球と互いに線維を送り合い、淡蒼球の働きを調節する。"]},{"h":"基底核の主回路:基本の形","b":["基底核は、大脳皮質から情報を受け取り、視床を経由して大脳皮質へ返す、輪の形の回路を作っている。","1. 大脳皮質(運動野、感覚野、連合野)が、線条体へ信号を送る。","2. 線条体が、淡蒼球の内節へ信号を送る。","3. 淡蒼球の内節が、視床の VA と VL(Day 9)へ信号を送る。","4. 視床の VA と VL が、大脳皮質の運動野と運動前野へ信号を返す。","淡蒼球から視床へ向かう線維は、ansa lenticularis(レンズ核ワナ)と lenticular fasciculus(レンズ核束)という2つの経路を通り、視床の手前で合流して thalamic fasciculus(視床束)になる。"]},{"h":"基底核の主回路:アクセルとブレーキ","b":["主回路の4本の矢印には、それぞれ「相手を働かせる」か「相手にブレーキをかける」かの違いがある。神経細胞が次の細胞へ渡す物質で決まる。","- 大脳皮質 → 線条体:glutamate(グルタミン酸)。相手を働かせる(興奮)。","- 線条体 → 淡蒼球:GABA(ギャバ)。相手にブレーキをかける(抑制)。","- 淡蒼球 → 視床:GABA。相手にブレーキをかける。","- 視床 → 大脳皮質:glutamate。相手を働かせる。","何もしていないとき、淡蒼球は常に視床にブレーキをかけている。そのため視床は運動野を働かせられず、体は動かない。","動こうとするとき、大脳皮質が線条体を働かせる。働いた線条体は、淡蒼球にブレーキをかける。淡蒼球が止まると、淡蒼球が視床にかけていたブレーキが外れる。ブレーキが外れた視床が運動野を働かせ、運動が始まる。","ブレーキのブレーキ(二重の抑制)で働きが生まれるこの仕組みを、disinhibition(脱抑制)という。"]},{"h":"主回路を調整する2つの副回路","b":["主回路には、働きの強さを調整する小さな回路が2つついている。","1つ目は、線条体と黒質の間の回路。","- 線条体は、黒質の緻密部に GABA でブレーキをかける。","- 黒質の緻密部は、線条体へ dopamine を送る。ドーパミンは線条体の働きを調整し、運動を始めやすくする。","2つ目は、淡蒼球と視床下核の間の回路。","- 淡蒼球は、視床下核に GABA でブレーキをかける。","- 視床下核は、淡蒼球へ glutamate を送って働かせる。","この2つの副回路が、線条体と淡蒼球の「ブレーキの強さ」を細かく調整している。"]},{"h":"パーキンソン病では何が起こるか","b":["Parkinson's disease(パーキンソン病)では、黒質の緻密部の神経細胞が少しずつ死んでいく。黒い神経細胞が減るので、黒質の色が薄くなる。","次の順に、運動の障害が起こる。","1. 黒質の緻密部が変性し、線条体へ届くドーパミンが減る。","2. 1つ目の副回路の調整が失われ、線条体の働きのバランスが崩れる。","3. その結果、淡蒼球の内節が視床にかけるブレーキが強くなりすぎる。","4. 視床が運動野を十分に働かせられなくなる。","5. 運動野の活動が下がり、運動が始めにくく、小さく遅くなる。","主な症状は、動きが少なく遅い(寡動)、筋がこわばる(筋固縮)、じっとしているときに手が震える(安静時振戦)の3つ。"]},{"h":"なぜ「錐体外路系」と呼ぶのか","b":["Day 6 で学んだ皮質脊髄路は、延髄の錐体を通るので pyramidal tract(錐体路)とも呼ぶ。錐体路は、運動の命令を筋へ直接伝える経路。","これに対し、基底核のように、錐体路の外で運動を調節する仕組みをまとめて extrapyramidal system(錐体外路系)という。extra- は外という意味。","基底核と小脳(Day 7)は、どちらも視床の VL を経由して運動野に働きかけるので、視床で合流している。小脳の歯状核から上小脳脚を通って視床の VL へ行く経路が、錐体外路系と小脳をつないでいる。"]},{"h":"内包:大脳と下をつなぐ通り道","b":["internal capsule(内包)は、大脳皮質と、その下(視床・脳幹・脊髄)を結ぶ線維が、すべて集まって通る白質の帯。大脳皮質から扇のように集まってきた線維(放線冠、Day 6)が、基底核と視床の間を通り抜けるために、ここで細い帯にまとまる。","水平に切ると、内包は外側に開いた「く」の字(V の字を横に倒した形)に見える。くの字の内側(凹んだ側)にはレンズ核がはまり込み、外側(とがった側)の前には尾状核、後ろには視床がある。","内包は、場所によって5つの部分に分けられる。","1. anterior limb(前脚):前の部分。内側に尾状核の頭、外側にレンズ核。","2. genu(膝):くの字の曲がり角。レンズ核の先端の内側。膝のように曲がっているのでこの名前。","3. posterior limb(後脚):後ろの部分。内側に視床、外側にレンズ核。","4. retrolentiform part(レンズ後部):レンズ核の後ろ。","5. sublentiform part(レンズ下部):レンズ核の下。"]},{"h":"内包のどこを何が通るか","b":["内包の5つの部分は、それぞれ決まった線維が通る。","- 前脚:視床の前核と背内側核から前頭葉へ向かう線維(anterior thalamic radiation 前視床放線)と、前頭葉から橋へ向かう線維(frontopontine fibers 前頭橋路)。前頭橋路は、橋核で乗り換えて反対側の小脳へ行く(Day 7)。","- 膝:顔とのどを動かす命令の線維(corticobulbar fibers 皮質核路、Day 6)。","- 後脚:前の3分の2に、手足を動かす命令の線維(corticospinal fibers 皮質脊髄路、Day 6)。その後ろに、視床の VPL・VPM から中心後回へ向かう体の感覚の線維。","- レンズ後部:外側膝状体から後頭葉の視覚野へ向かう線維(optic radiation 視放線、Day 14)。","- レンズ下部:内側膝状体から側頭葉の聴覚野へ向かう線維(auditory radiation 聴放線、Day 4)。","内包の膝は、側脳室から第三脳室への穴(室間孔、Day 8)のすぐ外側で、脳室の表面に接している。","狭い場所に大事な線維が集中しているので、内包に小さな出血や梗塞が起こるだけで、反対側の半身の麻痺と感覚障害がそろって出る。"]},{"h":"基底核と内包の血管","b":["基底核と内包には、脳の底から真上へ入っていく細い動脈(perforating arteries 穿通枝)が血液を送る。主なものは3つ(動脈の全体は Day 16、Day 17)。","1. lateral lenticulostriate arteries(外側レンズ核線条体動脈):大脳の外側を養う中大脳動脈(MCA)の根元から出る。被殻、淡蒼球の外側、尾状核の頭と体、内包を養う。高血圧で破れやすく、脳出血が最も多い場所。","2. recurrent artery of Heubner(Heubner 反回動脈):大脳の内側を養う前大脳動脈(ACA)から出て、来た道を逆戻りする(反回)。尾状核の頭と内包の前脚を養う。","3. anterior choroidal artery(前脈絡叢動脈):内頸動脈から出る。内包の後脚とレンズ後部、淡蒼球の内側を養う。"]}],"terms":[{"q":"basal ganglia","a":"大脳基底核"},{"q":"insula","a":"島。外側溝の奥の皮質"},{"q":"extreme capsule","a":"最外包。島皮質の下の白質"},{"q":"claustrum","a":"前障。島と被殻の間の薄い灰白質"},{"q":"external capsule","a":"外包。前障と被殻の間"},{"q":"putamen","a":"被殻"},{"q":"globus pallidus","a":"淡蒼球。外節(GPe)と内節(GPi)"},{"q":"caudate nucleus","a":"尾状核。頭・体・尾"},{"q":"lentiform nucleus","a":"レンズ核 = 被殻 + 淡蒼球"},{"q":"striatum","a":"線条体 = 尾状核 + 被殻"},{"q":"subthalamic nucleus","a":"視床下核"},{"q":"substantia nigra pars compacta","a":"黒質緻密部。dopamine"},{"q":"substantia nigra pars reticulata","a":"黒質網様部。出力核"},{"q":"disinhibition","a":"脱抑制。抑制が抑制されて活動が出る"},{"q":"ansa lenticularis","a":"レンズ核ワナ。淡蒼球から視床へ"},{"q":"thalamic fasciculus","a":"視床束"},{"q":"extrapyramidal system","a":"錐体外路系。錐体を通らない運動系"},{"q":"internal capsule","a":"内包"},{"q":"anterior limb","a":"前脚。尾状核頭とレンズ核の間"},{"q":"genu","a":"膝。内包の曲がり角"},{"q":"posterior limb","a":"後脚。視床とレンズ核の間"},{"q":"retrolentiform part","a":"レンズ後部。視放線"},{"q":"sublentiform part","a":"レンズ下部。聴放線"},{"q":"lenticulostriate arteries","a":"レンズ核線条体動脈。MCA の穿通枝"},{"q":"recurrent artery of Heubner","a":"Heubner 反回動脈。ACA の枝"}],"facts":[{"q":"島から内側への層を順に","a":"島皮質 → 最外包 → 前障 → 外包 → 被殻 → 淡蒼球 → 内包 → 視床"},{"q":"島と被殻の間の薄い灰白質","a":"前障(claustrum)"},{"q":"レンズ核と内包、外側はどちら","a":"レンズ核"},{"q":"内包の内側にある構造(後方)","a":"視床"},{"q":"内包の内側にある構造(前方)","a":"尾状核頭"},{"q":"線条体を構成する2核","a":"尾状核と被殻"},{"q":"レンズ核を構成する2核","a":"被殻と淡蒼球"},{"q":"基底核の主な5核","a":"尾
